<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Zombie Survival</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e14;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
  #game{display:block;width:100%;height:100%}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,20,.94);color:#e6edf3;text-align:center;padding:24px;z-index:10;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));overflow-y:auto}
  .overlay.hidden{display:none}
  .overlay h1{font-size:26px;margin-bottom:6px}
  .overlay > p{color:#9ca3af;margin-bottom:16px;font-size:13px;line-height:1.5}
  .btn{background:#4ade80;color:#0a0e14;border:none;padding:14px 32px;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.96)}
  .cards{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:420px;margin-top:4px}
  .card-btn{background:#1f2937;color:#e6edf3;border:1.5px solid #374151;padding:14px;border-radius:12px;font-size:14px;text-align:left;cursor:pointer;transition:background .1s;display:flex;gap:12px;align-items:center}
  .card-btn:active{background:#374151}
  .card-btn .icon{font-size:32px;flex-shrink:0;width:44px;text-align:center}
  .card-btn b{display:block;margin-bottom:3px;font-size:15px}
  .card-btn span{color:#9ca3af;font-size:12px;display:block}
  .classes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;margin-top:4px}
  .class-btn{background:#1f2937;color:#e6edf3;border:1px solid #374151;padding:12px;border-radius:12px;font-size:13px;text-align:left;cursor:pointer;transition:background .1s}
  .class-btn:active{background:#374151}
  .class-btn b{display:block;margin-bottom:3px;font-size:14px}
  .class-btn span{color:#9ca3af;font-size:11px;display:block}
  .class-btn .stats{color:#6b7280;font-size:10px;margin-top:5px}
  .upgrades{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px;margin-top:6px}
  .upgrade-btn{background:#1f2937;color:#e6edf3;border:1.5px solid #374151;padding:12px 14px;border-radius:12px;font-size:13px;text-align:left;cursor:pointer;transition:background .1s}
  .upgrade-btn:active{background:#374151}
  .upgrade-btn b{display:block;margin-bottom:2px;font-size:14px}
  .upgrade-btn span{color:#9ca3af;font-size:12px}
  .upgrade-btn.common{border-color:#4b5563}
  .upgrade-btn.common b{color:#9ca3af}
  .upgrade-btn.rare{border-color:#3b82f6;box-shadow:0 0 12px rgba(59,130,246,.15)}
  .upgrade-btn.rare b{color:#60a5fa}
  .upgrade-btn.epic{border-color:#a855f7;box-shadow:0 0 14px rgba(168,85,247,.2)}
  .upgrade-btn.epic b{color:#c084fc}
  .rarity-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;font-weight:600}
  .rarity-tag.common{background:#374151;color:#9ca3af}
  .rarity-tag.rare{background:#1e3a5f;color:#60a5fa}
  .rarity-tag.epic{background:#3b1d5e;color:#c084fc}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="mapScreen" class="overlay">
  <h1>🧟 Zombie Survival</h1>
  <p>Выбери локацию</p>
  <div class="cards" id="mapList"></div>
</div>

<div id="startScreen" class="overlay hidden">
  <h1>Класс персонажа</h1>
  <p id="mapName"></p>
  <div class="classes" id="classList"></div>
</div>

<div id="upgradeScreen" class="overlay hidden">
  <h1>Волна пройдена!</h1>
  <p>Выбери улучшение</p>
  <div class="upgrades" id="upgradeList"></div>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h1>Ты погиб</h1>
  <p id="finalScore"></p>
  <button class="btn" onclick="restartGame()">Заново</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ========== КОНСТАНТЫ ==========
const WEAPONS = {
  pistol:  { name:'Пистолет', icon:'🔫', dmg:12, fireRate:0.35, bulletSpeed:520, range:260, pellets:1, spread:0,    pierce:0, color:'#fde047' },
  shotgun: { name:'Дробовик', icon:'💥', dmg:8,  fireRate:0.7,  bulletSpeed:450, range:200, pellets:5, spread:0.55, pierce:0, color:'#fb923c' },
  smg:     { name:'ПП',       icon:'⚡', dmg:7,  fireRate:0.12, bulletSpeed:560, range:240, pellets:1, spread:0.09, pierce:0, color:'#60a5fa' },
  rifle:   { name:'Винтовка', icon:'🎯', dmg:35, fireRate:0.9,  bulletSpeed:750, range:400, pellets:1, spread:0,    pierce:2, color:'#a78bfa' }
};

const CLASSES = {
  soldier: { name:'Солдат',    desc:'Сбалансированный',      weapon:'pistol',  hp:100, speed:190, dmgMult:1.0,  fireRateMult:1.0,  color:'#4ade80' },
  tank:    { name:'Танк',      desc:'Много HP, медленный',   weapon:'shotgun', hp:180, speed:140, dmgMult:1.15, fireRateMult:1.1,  color:'#60a5fa' },
  scout:   { name:'Разведчик', desc:'Быстрый, хрупкий',      weapon:'smg',     hp:70,  speed:250, dmgMult:0.85, fireRateMult:0.9,  color:'#facc15' },
  sniper:  { name:'Снайпер',   desc:'Урон на дистанции',     weapon:'rifle',   hp:75,  speed:170, dmgMult:1.3,  fireRateMult:1.2,  color:'#a855f7' }
};

const ZOMBIE_TYPES = {
  walker:   { hp:30,  speed:55,  dmg:8,  r:13, color:'#ef4444', score:10 },
  runner:   { hp:18,  speed:115, dmg:6,  r:11, color:'#f59e0b', score:15 },
  brute:    { hp:85,  speed:40,  dmg:16, r:20, color:'#a855f7', score:25 },
  spitter:  { hp:40,  speed:45,  dmg:8,  r:14, color:'#22c55e', score:20, ranged:true, range:230, projSpeed:260 },
  exploder: { hp:26,  speed:80,  dmg:12, r:12, color:'#f97316', score:20, explodes:true, explosionRadius:80 }
};

// Урон боссов урезан примерно в 2 раза
const BOSS_TYPES = [
  { name:'Громила', color:'#dc2626', r:38, speed:60, dmg:12, hpMul:1.0, attacks:['charge','summon'] },
  { name:'Чумной',  color:'#16a34a', r:42, speed:50, dmg:10, hpMul:1.3, attacks:['radial','spray'] },
  { name:'Фантом',  color:'#7c3aed', r:36, speed:85, dmg:9,  hpMul:1.6, attacks:['teleport','homing','spray'] },
  { name:'Мясник',  color:'#be123c', r:46, speed:55, dmg:14, hpMul:2.2, attacks:['charge','radial','summon','homing'] }
];

const MAPS = {
  forest: {
    name: 'Тёмный лес',
    desc: 'Деревья, камни и мшистые поляны',
    icon: '🌲',
    ground: '#0a1410',
    grid: 'rgba(74,222,128,0.04)',
    accent: '#22c55e',
    obstacleCount: 14,
    obstacleSet: [{type:'tree',weight:3},{type:'rock',weight:2},{type:'bush',weight:2}]
  },
  industrial: {
    name: 'Заброшенный завод',
    desc: 'Ржавые ящики, бочки и машины',
    icon: '🏭',
    ground: '#0f1014',
    grid: 'rgba(148,163,184,0.05)',
    accent: '#94a3b8',
    obstacleCount: 16,
    obstacleSet: [{type:'crate',weight:3},{type:'barrel',weight:3},{type:'machine',weight:1}]
  },
  desert: {
    name: 'Пустошь',
    desc: 'Кактусы, кости и выжженный песок',
    icon: '🏜️',
    ground: '#1a1410',
    grid: 'rgba(251,191,36,0.04)',
    accent: '#f59e0b',
    obstacleCount: 12,
    obstacleSet: [{type:'cactus',weight:3},{type:'rock',weight:2},{type:'bones',weight:2}]
  }
};

const UPGRADES = [
  { id:'dmg1',   name:'Урон +10%',          desc:'Пули бьют немного сильнее',       rarity:'common', apply:p => p.dmgMult *= 1.10 },
  { id:'rate1',  name:'Скорострельность +10%', desc:'Стреляешь чуть быстрее',        rarity:'common', apply:p => p.fireRateMult *= 0.90 },
  { id:'speed1', name:'Скорость +8%',       desc:'Двигаешься быстрее',               rarity:'common', apply:p => p.speed *= 1.08 },
  { id:'hp1',    name:'Макс HP +15',        desc:'Больше здоровья',                  rarity:'common', apply:p => { p.maxHp += 15; p.hp += 15; } },
  { id:'range1', name:'Радиус +30',         desc:'Замечаешь врагов дальше',          rarity:'common', apply:p => p.rangeBonus += 30 },
  { id:'dmg2',   name:'Урон +20%',          desc:'Пули бьют заметно сильнее',        rarity:'rare',   apply:p => p.dmgMult *= 1.20 },
  { id:'rate2',  name:'Скорострельность +20%', desc:'Стреляешь быстрее',             rarity:'rare',   apply:p => p.fireRateMult *= 0.80 },
  { id:'hp2',    name:'Макс HP +30',        desc:'Намного больше здоровья',          rarity:'rare',   apply:p => { p.maxHp += 30; p.hp += 30; } },
  { id:'heal',   name:'Лечение +50',        desc:'Восстанавливает здоровье сейчас', rarity:'rare',   apply:p => p.hp = Math.min(p.maxHp, p.hp + 50) },
  { id:'pierce', name:'Пробивание +1',      desc:'Пули пробивают одного врага',      rarity:'rare',   apply:p => p.pierce += 1 },
  { id:'magnet', name:'Магнит +50',         desc:'Собираешь пикапы издалека',        rarity:'rare',   apply:p => p.pickupRange += 50 },
  { id:'bspeed', name:'Скорость пуль +25%', desc:'Пули летят быстрее',               rarity:'rare',   apply:p => p.bulletSpeedMult *= 1.25 },
  { id:'dmg3',   name:'Урон +40%',          desc:'Пули бьют очень сильно',           rarity:'epic',   apply:p => p.dmgMult *= 1.40 },
  { id:'vamp',   name:'Вампиризм',          desc:'+2 HP за убийство',                rarity:'epic',   apply:p => p.vamp += 2 },
  { id:'multi',  name:'Мультивыстрел',       desc:'+1 пуля за выстрел',               rarity:'epic',   apply:p => p.extraPellets += 1 },
  { id:'expl',   name:'Разрывные пули',     desc:'Пули взрываются при попадании',    rarity:'epic',   apply:p => p.explosive = true },
  { id:'weapon', name:'Смена оружия',        desc:'Новое случайное оружие',           rarity:'epic',   apply:p => {
    const keys = Object.keys(WEAPONS).filter(k => k !== p.weapon);
    p.weapon = keys[Math.floor(Math.random() * keys.length)];
  }}
];

// ========== СОСТОЯНИЕ ==========
const game = {
  running:false, wave:1, score:0, kills:0,
  player:null, zombies:[], bullets:[], enemyBullets:[], particles:[], pickups:[],
  obstacles:[], decorations:[], patches:[], world:null, mapKey:null,
  spawnQueue:0, spawnTimer:0, waveActive:false,
  lastTime:0, screenShake:0, nextId:1, waveBanner:0, boss:null
};

const camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

function makePlayer(classKey) {
  const c = CLASSES[classKey];
  return {
    class: classKey, weapon: c.weapon,
    x: 0, y: 0, r: 14,
    hp: c.hp, maxHp: c.hp,
    speed: c.speed,
    dmgMult: 1, fireRateMult: 1, bulletSpeedMult: 1,
    rangeBonus: 0, extraPellets: 0, pierce: 0,
    pickupRange: 28, vamp: 0, explosive: false,
    fireCd: 0, lastAim: -Math.PI/2
  };
}

function stats(p) {
  const w = WEAPONS[p.weapon], c = CLASSES[p.class];
  return {
    dmg: w.dmg * c.dmgMult * p.dmgMult,
    fireRate: w.fireRate * c.fireRateMult * p.fireRateMult,
    bulletSpeed: w.bulletSpeed * p.bulletSpeedMult,
    range: w.range + p.rangeBonus,
    pellets: w.pellets + p.extraPellets,
    spread: w.spread,
    pierce: w.pierce + p.pierce,
    color: w.color
  };
}

// ========== UI ==========
let selectedMap = null;

function showMapSelection() {
  const list = document.getElementById('mapList');
  list.innerHTML = '';
  for (const [key, m] of Object.entries(MAPS)) {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.style.borderColor = m.accent + '88';
    btn.innerHTML = `
      <div class="icon">${m.icon}</div>
      <div>
        <b style="color:${m.accent}">${m.name}</b>
        <span>${m.desc}</span>
      </div>`;
    btn.onclick = () => {
      selectedMap = key;
      document.getElementById('mapScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
      document.getElementById('mapName').textContent = `${m.icon} ${m.name}`;
      showClassSelection();
    };
    list.appendChild(btn);
  }
}

function showClassSelection() {
  const list = document.getElementById('classList');
  list.innerHTML = '';
  for (const [key, c] of Object.entries(CLASSES)) {
    const w = WEAPONS[c.weapon];
    const btn = document.createElement('button');
    btn.className = 'class-btn';
    btn.style.borderColor = c.color + '88';
    btn.innerHTML = `
      <b style="color:${c.color}">${c.name}</b>
      <span>${c.desc}</span>
      <div class="stats">HP ${c.hp} • ${w.icon} ${w.name}</div>`;
    btn.onclick = () => startGame(selectedMap, key);
    list.appendChild(btn);
  }
}

function startGame(mapKey, classKey) {
  document.getElementById('startScreen').classList.add('hidden');

  const world = {
    w: Math.max(1200, W * 2.0),
    h: Math.max(1000, H * 1.6)
  };

  const p = makePlayer(classKey);
  p.x = world.w / 2;
  p.y = world.h / 2;

  const obstacles = generateObstacles(mapKey, world);
  const decorations = generateDecorations(mapKey, world);
  const patches = generatePatches(world);

  Object.assign(game, {
    player: p,
    world, mapKey,
    zombies: [], bullets: [], enemyBullets: [], particles: [], pickups: [],
    obstacles, decorations, patches,
    wave: 1, score: 0, kills: 0,
    spawnQueue: 0, spawnTimer: 0, waveActive: false,
    running: true, lastTime: 0, screenShake: 0, nextId: 1,
    boss: null, waveBanner: 0
  });

  camera.x = clamp(p.x - W/2, 0, world.w - W);
  camera.y = clamp(p.y - H/2, 0, world.h - H);

  startWave();
}

function startWave() {
  game.waveActive = true;
  game.waveBanner = 2.0;

  if (game.wave % 5 === 0) {
    game.spawnQueue = 2 + Math.floor(game.wave / 2);
    spawnBoss();
  } else {
    game.spawnQueue = 5 + game.wave * 2;
  }
  game.spawnTimer = 0.6;
}

function endWave() {
  game.waveActive = false;
  game.score += 100;
  game.running = false;
  showUpgrades();
}

function pickUpgrades() {
  const wave = game.wave;
  let weights;
  if (wave <= 2)       weights = { common: 80, rare: 20, epic: 0 };
  else if (wave <= 5)  weights = { common: 50, rare: 40, epic: 10 };
  else if (wave <= 9)  weights = { common: 30, rare: 45, epic: 25 };
  else                 weights = { common: 15, rare: 45, epic: 40 };

  const result = [];
  const available = [...UPGRADES];
  for (let i = 0; i < 3; i++) {
    if (available.length === 0) break;
    const roll = Math.random() * 100;
    let rarity;
    if (roll < weights.common) rarity = 'common';
    else if (roll < weights.common + weights.rare) rarity = 'rare';
    else rarity = 'epic';
    let pool = available.filter(u => u.rarity === rarity);
    if (pool.length === 0) pool = available;
    const u = pool[Math.floor(Math.random() * pool.length)];
    result.push(u);
    available.splice(available.indexOf(u), 1);
  }
  return result;
}

function showUpgrades() {
  const pool = pickUpgrades();
  const list = document.getElementById('upgradeList');
  list.innerHTML = '';
  const rarityLabel = { common:'Обычное', rare:'Редкое', epic:'Эпическое' };
  for (const u of pool) {
    const btn = document.createElement('button');
    btn.className = 'upgrade-btn ' + u.rarity;
    btn.innerHTML = `<b>${u.name}<span class="rarity-tag ${u.rarity}">${rarityLabel[u.rarity]}</span></b><span>${u.desc}</span>`;
    btn.onclick = () => {
      u.apply(game.player);
      document.getElementById('upgradeScreen').classList.add('hidden');
      game.wave++;
      game.running = true;
      game.lastTime = 0;
      startWave();
    };
    list.appendChild(btn);
  }
  document.getElementById('upgradeScreen').classList.remove('hidden');
}

function gameOver() {
  game.running = false;
  document.getElementById('finalScore').textContent =
    `${CLASSES[game.player.class].name} • Волна ${game.wave} • Очки ${game.score} • Убито ${game.kills}`;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function restartGame() {
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('mapScreen').classList.remove('hidden');
  game.player = null;
  game.running = false;
  showMapSelection();
}

// ========== ВВОД ==========
const joy = { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0, maxR:60 };
function joyStart(x,y,id){ if(joy.active)return; joy.active=true; joy.id=id; joy.baseX=x; joy.baseY=y; joy.dx=joy.dy=0; }
function joyMove(x,y){
  const dx=x-joy.baseX, dy=y-joy.baseY, d=Math.hypot(dx,dy);
  if(d>1){ const cl=Math.min(d,joy.maxR); joy.dx=(dx/d)*(cl/joy.maxR); joy.dy=(dy/d)*(cl/joy.maxR); }
  else { joy.dx=joy.dy=0; }
}
function joyEnd(){ joy.active=false; joy.id=null; joy.dx=joy.dy=0; }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches)
    if (t.clientX < W*0.55 && !joy.active) joyStart(t.clientX, t.clientY, t.identifier);
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches)
    if (t.identifier === joy.id) joyMove(t.clientX, t.clientY);
}, { passive:false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === joy.id) joyEnd();
});
canvas.addEventListener('touchcancel', joyEnd);
canvas.addEventListener('mousedown', e => { if (e.clientX < W*0.55) joyStart(e.clientX, e.clientY, 'mouse'); });
canvas.addEventListener('mousemove', e => { if (joy.active) joyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', joyEnd);

// ========== ХЕЛПЕРЫ ==========
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rand = (a,b) => a + Math.random()*(b-a);

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt;
  let g = ((n >> 8) & 0xff) + amt;
  let b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

// ========== КОЛЛИЗИИ ==========
function circleRectCollide(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx*dx + dy*dy < cr*cr;
}
function circleCircleCollide(x1, y1, r1, x2, y2, r2) {
  const dx = x1-x2, dy = y1-y2, rr = r1+r2;
  return dx*dx + dy*dy < rr*rr;
}
function collidesAnyObstacle(x, y, r, obstacles) {
  for (const o of obstacles) {
    if (o.shape === 'rect') {
      if (circleRectCollide(x, y, r, o.x, o.y, o.w, o.h)) return true;
    } else if (circleCircleCollide(x, y, r, o.x, o.y, o.r)) return true;
  }
  return false;
}
function pushOutOfObstacles(ent, obstacles) {
  for (const o of obstacles) {
    if (o.shape === 'rect') {
      const nx = Math.max(o.x, Math.min(ent.x, o.x + o.w));
      const ny = Math.max(o.y, Math.min(ent.y, o.y + o.h));
      const dx = ent.x - nx, dy = ent.y - ny;
      const d = Math.hypot(dx, dy);
      if (d < ent.r) {
        if (d > 0.01) {
          ent.x = nx + dx/d * ent.r;
          ent.y = ny + dy/d * ent.r;
        } else {
          const dl = ent.x - o.x, dr = o.x + o.w - ent.x;
          const dt = ent.y - o.y, db = o.y + o.h - ent.y;
          const m = Math.min(dl, dr, dt, db);
          if (m === dl) ent.x = o.x - ent.r;
          else if (m === dr) ent.x = o.x + o.w + ent.r;
          else if (m === dt) ent.y = o.y - ent.r;
          else ent.y = o.y + o.h + ent.r;
        }
      }
    } else {
      const dx = ent.x - o.x, dy = ent.y - o.y;
      const d = Math.hypot(dx, dy), md = ent.r + o.r;
      if (d < md && d > 0.01) {
        ent.x = o.x + dx/d * md;
        ent.y = o.y + dy/d * md;
      }
    }
  }
}
function hasLOS(x1, y1, x2, y2, obstacles) {
  const dist = Math.hypot(x2-x1, y2-y1);
  if (dist < 1) return true;
  const steps = Math.max(2, Math.ceil(dist / 8));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const px = x1 + (x2-x1)*t;
    const py = y1 + (y2-y1)*t;
    for (const o of obstacles) {
      if (o.shape === 'rect') {
        if (px > o.x && px < o.x+o.w && py > o.y && py < o.y+o.h) return false;
      } else {
        if (Math.hypot(px-o.x, py-o.y) < o.r) return false;
      }
    }
  }
  return true;
}
function moveZombieAroundObstacles(z, dx, dy, speed, dt) {
  const d = Math.hypot(dx, dy) || 1;
  const nx = (dx / d) * speed * dt;
  const ny = (dy / d) * speed * dt;
  const oldX = z.x, oldY = z.y;

  if (!collidesAnyObstacle(z.x + nx, z.y, z.r, game.obstacles)) z.x += nx;
  if (!collidesAnyObstacle(z.x, z.y + ny, z.r, game.obstacles)) z.y += ny;

  const moved = Math.hypot(z.x - oldX, z.y - oldY);
  if (moved < speed * dt * 0.25) {
    z.stuckTimer = (z.stuckTimer || 0) + dt;
    if (z.stuckTimer > 0.15) {
      const perpAng = Math.atan2(dy, dx) + (Math.PI / 2) * (z.avoidDir || 1);
      const px = Math.cos(perpAng) * speed * dt;
      const py = Math.sin(perpAng) * speed * dt;
      if (!collidesAnyObstacle(z.x + px, z.y + py, z.r, game.obstacles)) {
        z.x += px; z.y += py;
      } else if (!collidesAnyObstacle(z.x - px, z.y - py, z.r, game.obstacles)) {
        z.x -= px; z.y -= py;
      }
      if (z.stuckTimer > 0.8) {
        z.avoidDir = -(z.avoidDir || 1);
        z.stuckTimer = 0;
      }
    }
  } else {
    z.stuckTimer = 0;
  }

  pushOutOfObstacles(z, game.obstacles);
  z.x = clamp(z.x, z.r, game.world.w - z.r);
  z.y = clamp(z.y, z.r, game.world.h - z.r);
}

// ========== ГЕНЕРАЦИЯ МИРА ==========
function pickWeighted(set) {
  const total = set.reduce((s, o) => s + o.weight, 0);
  let r = Math.random() * total;
  for (const o of set) {
    r -= o.weight;
    if (r <= 0) return o.type;
  }
  return set[0].type;
}

function generateObstacles(mapKey, world) {
  const m = MAPS[mapKey];
  const obstacles = [];
  const cx = world.w / 2, cy = world.h / 2;

  for (let i = 0; i < m.obstacleCount; i++) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const type = pickWeighted(m.obstacleSet);
      let ob;

      if (type === 'tree') {
        const r = 30 + Math.random() * 16;
        ob = { shape:'circle', kind:'tree', r, x: 90 + Math.random()*(world.w-180), y: 90 + Math.random()*(world.h-180), seed: Math.random()*100 };
      } else if (type === 'rock') {
        const r = 24 + Math.random() * 16;
        ob = { shape:'circle', kind:'rock', r, x: 90 + Math.random()*(world.w-180), y: 90 + Math.random()*(world.h-180), seed: Math.random()*100 };
      } else if (type === 'bush') {
        const r = 16 + Math.random() * 8;
        ob = { shape:'circle', kind:'bush', r, x: 90 + Math.random()*(world.w-180), y: 90 + Math.random()*(world.h-180) };
      } else if (type === 'crate') {
        const s = 40 + Math.random() * 15;
        ob = { shape:'rect', kind:'crate', w:s, h:s, x: 90 + Math.random()*(world.w-180-s), y: 90 + Math.random()*(world.h-180-s) };
      } else if (type === 'barrel') {
        const r = 16 + Math.random() * 8;
        ob = { shape:'circle', kind:'barrel', r, x: 90 + Math.random()*(world.w-180), y: 90 + Math.random()*(world.h-180) };
      } else if (type === 'machine') {
        const w = 60 + Math.random() * 25;
        const h = 50 + Math.random() * 20;
        ob = { shape:'rect', kind:'machine', w, h, x: 90 + Math.random()*(world.w-180-w), y: 90 + Math.random()*(world.h-180-h) };
      } else if (type === 'cactus') {
        const r = 18 + Math.random() * 10;
        ob = { shape:'circle', kind:'cactus', r, x: 90 + Math.random()*(world.w-180), y: 90 + Math.random()*(world.h-180), seed: Math.random()*100 };
      } else if (type === 'bones') {
        const r = 22 + Math.random() * 10;
        ob = { shape:'circle', kind:'bones', r, x: 90 + Math.random()*(world.w-180), y: 90 + Math.random()*(world.h-180), seed: Math.random()*100 };
      }

      const ox = ob.shape === 'rect' ? ob.x + ob.w/2 : ob.x;
      const oy = ob.shape === 'rect' ? ob.y + ob.h/2 : ob.y;
      const rT = ob.shape === 'rect' ? Math.max(ob.w, ob.h)/2 : ob.r;

      if (Math.hypot(cx - ox, cy - oy) < rT + 180) continue;

      let ok = true;
      for (const o of obstacles) {
        const oox = o.shape === 'rect' ? o.x + o.w/2 : o.x;
        const ooy = o.shape === 'rect' ? o.y + o.h/2 : o.y;
        const rO = o.shape === 'rect' ? Math.max(o.w, o.h)/2 : o.r;
        if (Math.hypot(oox - ox, ooy - oy) < rO + rT + 40) { ok = false; break; }
      }
      if (ok) { obstacles.push(ob); break; }
    }
  }
  return obstacles;
}

function generateDecorations(mapKey, world) {
  const dec = [];
  const count = 80;
  for (let i = 0; i < count; i++) {
    dec.push({
      kind: mapKey,
      x: Math.random() * world.w,
      y: Math.random() * world.h,
      size: 3 + Math.random() * 8,
      seed: Math.random() * 100,
      rot: Math.random() * Math.PI * 2
    });
  }
  return dec;
}

function generatePatches(world) {
  const patches = [];
  const count = 22;
  for (let i = 0; i < count; i++) {
    patches.push({
      x: Math.random() * world.w,
      y: Math.random() * world.h,
      r: 50 + Math.random() * 100,
      alpha: 0.02 + Math.random() * 0.03
    });
  }
  return patches;
}

// ========== СПАВН ==========
function spawnZombie() {
  const roll = Math.random();
  let typeKey;
  if (game.wave >= 4 && roll < 0.12)      typeKey = 'exploder';
  else if (game.wave >= 3 && roll < 0.24) typeKey = 'spitter';
  else if (game.wave >= 2 && roll < 0.40) typeKey = 'runner';
  else if (roll < 0.55)                   typeKey = 'brute';
  else                                    typeKey = 'walker';

  const t = ZOMBIE_TYPES[typeKey];
  const p = game.player;
  const dist = Math.max(W, H) * 0.72;

  let x, y;
  for (let i = 0; i < 25; i++) {
    const ang = Math.random() * Math.PI * 2;
    x = clamp(p.x + Math.cos(ang) * dist, 60, game.world.w - 60);
    y = clamp(p.y + Math.sin(ang) * dist, 60, game.world.h - 60);
    if (!collidesAnyObstacle(x, y, 25, game.obstacles)) break;
  }

  const hpScale = 1 + (game.wave - 1) * 0.18;
  game.zombies.push({
    id: game.nextId++,
    type: typeKey, x, y,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    r: t.r,
    speed: t.speed * (1 + (game.wave - 1) * 0.03),
    dmg: t.dmg + game.wave * 0.4,
    score: t.score,
    color: t.color,
    ranged: t.ranged || false, range: t.range || 0, projSpeed: t.projSpeed || 0,
    explodes: t.explodes || false, explosionRadius: t.explosionRadius || 0,
    hitFlash: 0, atkCd: 0,
    avoidDir: Math.random() < 0.5 ? 1 : -1,
    stuckTimer: 0
  });
}

function spawnBoss() {
  const idx = Math.floor(game.wave / 5 - 1) % BOSS_TYPES.length;
  const t = BOSS_TYPES[idx];
  const waveScale = 1 + (game.wave - 1) * 0.08;
  const hp = 500 * t.hpMul * waveScale;

  const p = game.player;
  const dist = Math.max(W, H) * 0.72;
  let x, y;
  for (let i = 0; i < 25; i++) {
    const ang = Math.random() * Math.PI * 2;
    x = clamp(p.x + Math.cos(ang) * dist, t.r + 40, game.world.w - t.r - 40);
    y = clamp(p.y + Math.sin(ang) * dist, t.r + 40, game.world.h - t.r - 40);
    if (!collidesAnyObstacle(x, y, t.r + 10, game.obstacles)) break;
  }

  const boss = {
    id: game.nextId++,
    type: 'boss', isBoss: true, bossIndex: idx, name: t.name,
    x, y,
    hp, maxHp: hp,
    r: t.r, speed: t.speed, dmg: t.dmg + game.wave * 0.4,
    score: 500, color: t.color,
    attackSet: t.attacks,
    atkCd: 2.5, contactCd: 0,
    state: 'idle', stateTimer: 0,
    chargeDir: { x: 0, y: 0 },
    hitFlash: 0,
    avoidDir: Math.random() < 0.5 ? 1 : -1,
    stuckTimer: 0
  };
  game.zombies.push(boss);
  game.boss = boss;
}

<script>
// ========== БОСС-АТАКИ ==========
function startBossAttack(b, p) {
  const attack = b.attackSet[Math.floor(Math.random() * b.attackSet.length)];
  if (attack === 'charge') {
    const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy) || 1;
    b.chargeDir = { x: dx/d, y: dy/d };
    b.state = 'charging'; b.stateTimer = 0.8;
    spawnParticles(b.x, b.y, 15, b.color);
  } else if (attack === 'summon') {
    for (let i = 0; i < 3; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = b.r + 25;
      const t = ZOMBIE_TYPES['walker'];
      const hpScale = 1 + (game.wave - 1) * 0.18;
      game.zombies.push({
        id: game.nextId++,
        type: 'walker',

        r: t.r, speed: t.speed, dmg: t.dmg,
        score: t.score, color: t.color,
        ranged:false, range:0, projSpeed:0, explodes:false, explosionRadius:0,
        hitFlash: 0, atkCd: 0, avoidDir:1, stuckTimer:0
      });
    }
    spawnParticles(b.x, b.y, 25, b.color);
    b.atkCd = 4;
  } else if (attack === 'radial') {
    const n = 16;
    for (let i = 0; i < n; i++) {
      const ang = i / n * Math.PI * 2;
      game.enemyBullets.push({
        x: b.x, y: b.y,

        dmg: 5, color: b.color, dist: 0, maxDist: 600
      });

    b.atkCd = 3;
  } else if (attack === 'spray') {
    const baseAng = Math.atan2(p.y - b.y, p.x - b.x);
    for (let i = -2; i <= 2; i++) {
      const ang = baseAng + i * 0.15;
      game.enemyBullets.push({
        x: b.x, y: b.y,
        vx: Math.cos(ang) * 280, vy: Math.sin(ang) * 280,
        dmg: 7, color: b.color, dist: 0, maxDist: 600
      });
    }
    b.atkCd = 2.5;
  } else if (attack === 'teleport') {
    b.x = clamp(p.x + (Math.random()-0.5) * 200, b.r + 20, game.world.w - b.r - 20);
    b.y = clamp(p.y + (Math.random()-0.5) * 200, b.r + 20, game.world.h - b.r - 20);
    pushOutOfObstacles(b, game.obstacles);
    spawnParticles(b.x, b.y, 25, b.color);
    b.atkCd = 3;
  } else if (attack === 'homing') {
    for (let i = 0; i < 3; i++) {

// ========== ЧАСТИЦЫ ==========
function spawnParticles(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = rand(40, 200);
    game.particles.push({
      x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      life: rand(0.3, 0.7), maxLife: 0.7,
      size: rand(2, 4), color
    });
  }
}

function explodeAt(x, y, radius, dmg, color) {
  for (const z of game.zombies) {
    if (z.isBoss) continue;
    const d = Math.hypot(z.x - x, z.y - y);
    if (d < radius) {
      z.hp -= dmg * (1 - d / radius * 0.5);
      z.hitFlash = 0.1;
    }
  }
  spawnParticles(x, y, 20, color || '#f97316');
  game.screenShake = Math.min(game.screenShake + 8, 16);
}

// ========== UPDATE ==========
function updateCamera(dt) {
  const p = game.player;
  const w = game.world;
  camera.targetX = clamp(p.x - W/2, 0, w.w - W);
  camera.targetY = clamp(p.y - H/2, 0, w.h - H);
  camera.x += (camera.targetX - camera.x) * Math.min(1, dt * 8);
  camera.y += (camera.targetY - camera.y) * Math.min(1, dt * 8);
}

function updateBoss(b, dt, p) {
  b.hitFlash = Math.max(0, b.hitFlash - dt);
  b.contactCd -= dt;

  if (b.state === 'idle') {
    const dx = p.x - b.x, dy = p.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < b.r + p.r + 5) {
      if (b.contactCd <= 0) {
        b.contactCd = 0.7;
        p.hp -= b.dmg;
        game.screenShake = Math.min(game.screenShake + 8, 16);
        spawnParticles(p.x, p.y, 10, '#f87171');
      }
    } else {
      moveZombieAroundObstacles(b, dx, dy, b.speed, dt);
    }
    b.atkCd -= dt;
    if (b.atkCd <= 0) startBossAttack(b, p);
  } else if (b.state === 'charging') {
    b.stateTimer -= dt;
    b.x += b.chargeDir.x * 340 * dt;
    b.y += b.chargeDir.y * 340 * dt;
    if (collidesAnyObstacle(b.x, b.y, b.r, game.obstacles)) {
      pushOutOfObstacles(b, game.obstacles);
      b.state = 'idle'; b.atkCd = 2;
      spawnParticles(b.x, b.y, 15, '#9ca3af');
      game.screenShake = Math.min(game.screenShake + 6, 14);
    }
    if (Math.hypot(b.x - p.x, b.y - p.y) < b.r + p.r) {
      p.hp -= b.dmg * 1.2;
      game.screenShake = Math.min(game.screenShake + 10, 18);
      spawnParticles(p.x, p.y, 12, '#f87171');
      b.state = 'idle'; b.atkCd = 2;
    }
    if (b.stateTimer <= 0) { b.state = 'idle'; b.atkCd = 2; }
    b.x = clamp(b.x, b.r, game.world.w - b.r);
    b.y = clamp(b.y, b.r, game.world.h - b.r);
  }
}

function update(dt) {
  const p = game.player;
  const s = stats(p);

  game.waveBanner = Math.max(0, game.waveBanner - dt);

  // Движение
  if (joy.active && (joy.dx || joy.dy)) {
    p.x += joy.dx * p.speed * dt;
    p.y += joy.dy * p.speed * dt;
    pushOutOfObstacles(p, game.obstacles);
  }
  p.x = clamp(p.x, p.r, game.world.w - p.r);
  p.y = clamp(p.y, p.r, game.world.h - p.r);

  updateCamera(dt);

  // Автострельба с LOS
  p.fireCd -= dt;
  if (p.fireCd <= 0) {
    let nearest = null, nd = Infinity;
    for (const z of game.zombies) {
      const d = Math.hypot(z.x - p.x, z.y - p.y);
      if (d < nd && d < s.range && hasLOS(p.x, p.y, z.x, z.y, game.obstacles)) {

    }

          vx: Math.cos(ang) * s.bulletSpeed,
          vy: Math.sin(ang) * s.bulletSpeed,
          dmg: s.dmg, color: s.color,
          dist: 0, maxDist: s.range * 1.15,
          pierce: s.pierce, hitIds: [],

    let dead = b.dist > b.maxDist || b.x < -30 || b.x > game.world.w + 30 || b.y < -30 || b.y > game.world.h + 30;

    if (!dead && collidesAnyObstacle(b.x, b.y, 2, game.obstacles)) {
      dead = true;

    if (!dead) {

        if (b.hitIds.includes(z.id)) continue;
        if (Math.hypot(z.x - b.x, z.y - b.y) < z.r + 3) {
          b.hitIds.push(z.id);
          z.hp -= b.dmg;
          z.hitFlash = 0.08;
          spawnParticles(b.x, b.y, 4, '#fbbf24');
          if (b.explosive) explodeAt(b.x, b.y, 50, b.dmg * 0.5, '#f97316');
          if (b.pierce > 0) b.pierce--;

        }
      }
    }
    if (dead) game.bullets.splice(i, 1);
  }

  // Зомби
  for (let i = game.zombies.length - 1; i >= 0; i--) {

    if (z.isBoss) {

    } else {
      const dx = p.x - z.x, dy = p.y - z.y;
      const d = Math.hypot(dx, dy) || 1;
      const inMelee = d < z.r + p.r + 2;
      const inRange = z.ranged && d < z.range && hasLOS(z.x, z.y, p.x, p.y, game.obstacles);

      z.atkCd -= dt;

      if (inMelee) {
        if (z.atkCd <= 0) {
          z.atkCd = 0.6;
          p.hp -= z.dmg;
          game.screenShake = Math.min(game.screenShake + 6, 14);
          spawnParticles(p.x, p.y, 8, '#f87171');
        }
      } else if (inRange && z.atkCd <= 0) {
        z.atkCd = 2.0;
        const ang = Math.atan2(dy, dx);
        game.enemyBullets.push({
          x: z.x, y: z.y,
          vx: Math.cos(ang) * z.projSpeed, vy: Math.sin(ang) * z.projSpeed,
          dmg: z.dmg, color: z.color, dist: 0, maxDist: 500
        });
      } else {
        moveZombieAroundObstacles(z, dx, dy, z.speed, dt);
      }
    }

    z.hitFlash = Math.max(0, z.hitFlash - dt);

      game.zombies.splice(i, 1);

        explodeAt(z.x, z.y, z.explosionRadius, z.dmg, z.color);
        if (Math.hypot(p.x - z.x, p.y - z.y) < z.explosionRadius) p.hp -= z.dmg;
      }
      if (z.isBoss) {
        game.boss = null;
        game.screenShake = 20;
        for (let k = 0; k < 5; k++) {
          game.pickups.push({ x: z.x + rand(-40,40), y: z.y + rand(-40,40), r: 9, life: 20, bob: Math.random()*6.28 });
        }
      } else if (Math.random() < 0.16) {
        game.pickups.push({ x: z.x, y: z.y, r: 9, life: 12, bob: Math.random() * 6.28 });
      }

  }

  // Вражеские снаряды
  for (let i = game.enemyBullets.length - 1; i >= 0; i--) {

    if (eb.homing) {
      const dx = p.x - eb.x, dy = p.y - eb.y, d = Math.hypot(dx, dy) || 1;
      const speed = Math.hypot(eb.vx, eb.vy);
      const tvx = dx/d * speed, tvy = dy/d * speed;
      eb.vx += (tvx - eb.vx) * 2 * dt;
      eb.vy += (tvy - eb.vy) * 2 * dt;
    }

    eb.x += eb.vx * dt;
    eb.y += eb.vy * dt;
    eb.dist += Math.hypot(eb.vx, eb.vy) * dt;

    if (eb.dist > eb.maxDist) { game.enemyBullets.splice(i, 1); continue; }
    if (collidesAnyObstacle(eb.x, eb.y, 3, game.obstacles)) {
      spawnParticles(eb.x, eb.y, 4, eb.color);
      game.enemyBullets.splice(i, 1);
      continue;
    }
    if (Math.hypot(eb.x - p.x, eb.y - p.y) < p.r + 4) {
      p.hp -= eb.dmg;
      game.screenShake = Math.min(game.screenShake + 5, 14);
      spawnParticles(p.x, p.y, 6, eb.color);
      game.enemyBullets.splice(i, 1);
    }
  }

  // Пикапы
  for (let i = game.pickups.length - 1; i >= 0; i--) {
    const pk = game.pickups[i];
    pk.life -= dt; pk.bob += dt * 4;
    const d = Math.hypot(p.x - pk.x, p.y - pk.y);
    if (d < p.r + pk.r) {
      p.hp = Math.min(p.maxHp, p.hp + 20);
      game.pickups.splice(i, 1);
      spawnParticles(pk.x, pk.y, 10, '#4ade80');
      continue;
    }
    if (d < p.pickupRange + p.r + pk.r) {
      const dx = p.x - pk.x, dy = p.y - pk.y;
      pk.x += dx * dt * 8;
      pk.y += dy * dt * 8;
    }
    if (pk.life <= 0) game.pickups.splice(i, 1);
  }

  // Частицы
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= dt;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }

  game.screenShake *= 0.88;

  // Спавн / конец волны
  if (game.waveActive) {
    if (game.spawnQueue > 0) {
      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        game.spawnTimer = 0.4;
        game.spawnQueue--;
        spawnZombie();
      }
    } else if (game.zombies.length === 0) {
      endWave();
    }
  }

  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}

// ========== ОТРИСОВКА МИРА ==========
function isVisible(x, y, pad) {
  return x + pad > camera.x && x - pad < camera.x + W && y + pad > camera.y && y - pad < camera.y + H;
}

function drawObstacle(o) {
  const cx = o.shape === 'rect' ? o.x + o.w/2 : o.x;
  const cy = o.shape === 'rect' ? o.y + o.h/2 : o.y;
  const r = o.shape === 'rect' ? Math.max(o.w, o.h) : o.r;
  if (!isVisible(cx, cy, r + 30)) return;

  if (o.kind === 'tree') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y + o.r*0.55, o.r*1.05, o.r*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#3b2412';
    ctx.beginPath(); ctx.arc(o.x, o.y + o.r*0.15, o.r*0.35, 0, Math.PI*2); ctx.fill();
    const g = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.4, o.r*0.2, o.x, o.y, o.r*1.15);
    g.addColorStop(0, '#22c55e');
    g.addColorStop(0.7, '#15803d');
    g.addColorStop(1, '#052e16');
    ctx.fillStyle = g;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 + o.seed;
      ctx.beginPath();
      ctx.arc(o.x + Math.cos(a) * o.r*0.5, o.y - o.r*0.4 + Math.sin(a) * o.r*0.5, o.r*0.65, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(134,239,172,0.35)';
    ctx.beginPath(); ctx.arc(o.x - o.r*0.35, o.y - o.r*0.7, o.r*0.28, 0, Math.PI*2); ctx.fill();
  } else if (o.kind === 'rock') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y + o.r*0.5, o.r*0.95, o.r*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    const pts = 7;
    for (let i = 0; i < pts; i++) {
      const a = i / pts * Math.PI * 2;
      const rad = o.r * (0.82 + Math.sin(o.seed + i * 2.3) * 0.2);
      const px = o.x + Math.cos(a) * rad;
      const py = o.y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.4, o.r*0.15, o.x, o.y, o.r);
    g.addColorStop(0, '#94a3b8');
    g.addColorStop(1, '#1e293b');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.ellipse(o.x - o.r*0.35, o.y - o.r*0.35, o.r*0.25, o.r*0.15, -0.5, 0, Math.PI*2);
    ctx.fill();
  } else if (o.kind === 'bush') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y + o.r*0.5, o.r*0.95, o.r*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#166534';
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(o.x + Math.cos(a) * o.r*0.4, o.y + Math.sin(a) * o.r*0.3, o.r*0.65, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.arc(o.x - o.r*0.2, o.y - o.r*0.3, o.r*0.3, 0, Math.PI*2); ctx.fill();
  } else if (o.kind === 'crate') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(o.x + 4, o.y + 6, o.w, o.h);
    const g = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
    g.addColorStop(0, '#a16207');
    g.addColorStop(1, '#713f12');
    ctx.fillStyle = g;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 3;
    ctx.strokeRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
    ctx.strokeStyle = 'rgba(69,26,3,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(o.x + 6, o.y + 6);
    ctx.lineTo(o.x + o.w - 6, o.y + o.h - 6);
    ctx.moveTo(o.x + o.w - 6, o.y + 6);
    ctx.lineTo(o.x + 6, o.y + o.h - 6);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(o.x + 3, o.y + 3, o.w - 6, 3);
  } else if (o.kind === 'barrel') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y + o.r*0.5, o.r*0.9, o.r*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    const g = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.3, o.r*0.2, o.x, o.y, o.r);
    g.addColorStop(0, '#ef4444');
    g.addColorStop(1, '#7f1d1d');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#450a0a';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(69,10,10,0.8)';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r*0.7, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r*0.35, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(o.x - o.r*0.3, o.y - o.r*0.3, o.r*0.2, 0, Math.PI*2); ctx.fill();
  } else if (o.kind === 'machine') {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(o.x + 6, o.y + 8, o.w, o.h);
    const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
    g.addColorStop(0, '#475569');
    g.addColorStop(1, '#1e293b');
    ctx.fillStyle = g;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    ctx.fillStyle = 'rgba(15,23,42,0.7)';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(o.x + 8, o.y + 10 + i * 12, o.w - 16, 6);
    }
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.arc(o.x + o.w - 12, o.y + 12, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(o.x + o.w - 12, o.y + 22, 3, 0, Math.PI*2); ctx.fill();
  } else if (o.kind === 'cactus') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y + o.r*0.6, o.r*0.85, o.r*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    const g = ctx.createLinearGradient(o.x - o.r*0.5, o.y, o.x + o.r*0.5, o.y);
    g.addColorStop(0, '#166534');
    g.addColorStop(0.5, '#22c55e');
    g.addColorStop(1, '#15803d');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(o.x, o.y, o.r*0.5, o.r, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(o.x - o.r*0.7, o.y - o.r*0.2, o.r*0.28, o.r*0.5, 0.3, 0, Math.PI*2);
    ctx.ellipse(o.x + o.r*0.7, o.y + o.r*0.1, o.r*0.28, o.r*0.45, -0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#a3e635';
    ctx.beginPath(); ctx.arc(o.x - o.r*0.15, o.y - o.r*0.5, o.r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(o.x + o.r*0.15, o.y - o.r*0.3, o.r*0.06, 0, Math.PI*2); ctx.fill();
  } else if (o.kind === 'bones') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y + o.r*0.5, o.r*0.9, o.r*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y, o.r*0.6, o.r*0.55, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r*0.6, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(o.x - o.r*0.2, o.y - o.r*0.1, o.r*0.13, 0, Math.PI*2);
    ctx.arc(o.x + o.r*0.2, o.y - o.r*0.1, o.r*0.13, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(o.x - o.r*0.35, o.y + o.r*0.2, o.r*0.7, o.r*0.15);
    ctx.fillStyle = '#e2e8f0';
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(o.x + (i-1)*o.r*0.5, o.y + o.r*0.7);
      ctx.rotate((i-1)*0.4 + o.seed*0.1);
      ctx.fillRect(-o.r*0.5, -o.r*0.08, o.r, o.r*0.16);
      ctx.restore();
    }
  }
}

function drawDecoration(d) {
  if (!isVisible(d.x, d.y, d.size + 8)) return;
  if (d.kind === 'forest') {
    ctx.strokeStyle = 'rgba(74,222,128,0.18)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const offX = (i - 1) * 2.5;
      ctx.beginPath();
      ctx.moveTo(d.x + offX, d.y);
      ctx.lineTo(d.x + offX + Math.sin(d.seed + i) * 3, d.y - d.size);
      ctx.stroke();
    }
  } else if (d.kind === 'industrial') {
    ctx.fillStyle = 'rgba(71,85,105,0.28)';
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.size, d.size * 0.4, d.rot, 0, Math.PI*2);
    ctx.fill();
  } else if (d.kind === 'desert') {
    ctx.fillStyle = 'rgba(180,150,100,0.16)';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size * 0.35, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawPlayer(p) {
  const c = CLASSES[p.class];
  const moving = joy.active && (joy.dx || joy.dy);
  const bob = moving ? Math.sin(performance.now() / 90) * 1.5 : 0;
  const legSwing = moving ? Math.sin(performance.now() / 90) * 2.5 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + p.r * 0.7, p.r * 1.1, p.r * 0.45, 0, 0, Math.PI*2);
  ctx.fill();

  // Ноги
  ctx.fillStyle = shade(c.color, -90);
  ctx.beginPath();
  ctx.ellipse(p.x - 4, p.y + p.r*0.35 + legSwing, 3.5, 5, 0, 0, Math.PI*2);
  ctx.ellipse(p.x + 4, p.y + p.r*0.35 - legSwing, 3.5, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Оружие (за спиной)
  ctx.save();
  ctx.translate(p.x, p.y + bob);
  ctx.rotate(p.lastAim);
  ctx.fillStyle = '#1f2937';
  ctx.fillRect(p.r * 0.4, -3, p.r * 1.1, 6);
  ctx.fillStyle = '#374151';
  ctx.fillRect(p.r * 1.2, -4, p.r * 0.35, 8);
  if (stats(p).fireRate > 0 && p.fireCd > stats(p).fireRate * 0.82) {
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(p.r * 1.55, 0, 5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Тело
  const g = ctx.createRadialGradient(p.x - p.r*0.4, p.y + bob - p.r*0.4, p.r*0.2, p.x, p.y + bob, p.r);
  g.addColorStop(0, shade(c.color, 40));
  g.addColorStop(1, shade(c.color, -50));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y + bob, p.r * 0.92, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#0a0e14';
  ctx.lineWidth = 2; ctx.stroke();

  // Классовые аксессуары
  if (p.class === 'soldier') {
    ctx.fillStyle = '#1f2937';
    ctx.beginPath(); ctx.arc(p.x, p.y + bob - 2, p.r * 0.68, Math.PI, 0); ctx.fill();
    ctx.fillStyle = shade(c.color, -20);
    ctx.fillRect(p.x - p.r*0.7, p.y + bob - 4, p.r * 1.4, 3);
  } else if (p.class === 'tank') {
    ctx.fillStyle = '#1f2937';
    ctx.beginPath(); ctx.arc(p.x, p.y + bob - 1, p.r * 0.8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = shade(c.color, -40);
    ctx.beginPath();
    ctx.arc(p.x - p.r*0.78, p.y + bob, p.r*0.32, 0, Math.PI*2);
    ctx.arc(p.x + p.r*0.78, p.y + bob, p.r*0.32, 0, Math.PI*2);
    ctx.fill();
  } else if (p.class === 'scout') {
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.arc(p.x, p.y + bob - 2, p.r * 0.62, Math.PI, 0); ctx.fill();
    ctx.fillRect(p.x + p.r*0.15, p.y + bob - 5, p.r * 0.75, 3);
  } else if (p.class === 'sniper') {
    ctx.fillStyle = shade(c.color, -50);
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, p.r * 0.88, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  }

  // Визар / глаза
  ctx.fillStyle = '#0a0e14';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + bob - p.r*0.32, p.r*0.5, p.r*0.18, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = c.color;
  ctx.beginPath();
  ctx.arc(p.x - p.r*0.24, p.y + bob - p.r*0.32, 1.8, 0, Math.PI*2);
  ctx.arc(p.x + p.r*0.24, p.y + bob - p.r*0.32, 1.8, 0, Math.PI*2);
  ctx.fill();
}

function drawZombie(z) {
  if (z.isBoss) { drawBoss(z); return; }
  if (!isVisible(z.x, z.y, z.r + 30)) return;

  const bob = Math.sin(performance.now() / 240 + z.id) * 1.5;
  const legSwing = Math.sin(performance.now() / 200 + z.id) * 2;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(z.x, z.y + z.r * 0.75, z.r * 1.05, z.r * 0.4, 0, 0, Math.PI*2);
  ctx.fill();

  // Ноги
  ctx.fillStyle = shade(z.color, -85);
  ctx.beginPath();
  ctx.ellipse(z.x - z.r*0.28, z.y + z.r*0.5 + legSwing, z.r*0.24, z.r*0.4, 0, 0, Math.PI*2);
  ctx.ellipse(z.x + z.r*0.28, z.y + z.r*0.5 - legSwing, z.r*0.24, z.r*0.4, 0, 0, Math.PI*2);
  ctx.fill();

  // Руки тянутся к игроку
  const angToPlayer = Math.atan2(game.player.y - z.y, game.player.x - z.x);
  ctx.save();
  ctx.translate(z.x, z.y + bob);
  ctx.rotate(angToPlayer);
  ctx.fillStyle = shade(z.color, -45);
  ctx.beginPath();
  ctx.ellipse(z.r * 0.75, -z.r * 0.42, z.r * 0.5, z.r * 0.22, 0.25, 0, Math.PI*2);
  ctx.ellipse(z.r * 0.75, z.r * 0.42, z.r * 0.5, z.r * 0.22, -0.25, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Тело
  const g = ctx.createRadialGradient(z.x - z.r*0.35, z.y + bob - z.r*0.35, z.r*0.2, z.x, z.y + bob, z.r);
  g.addColorStop(0, shade(z.color, 30));
  g.addColorStop(1, shade(z.color, -60));
  ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : g;
  ctx.beginPath(); ctx.arc(z.x, z.y + bob, z.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shade(z.color, -85);
  ctx.lineWidth = 2; ctx.stroke();

  // Типовые фичи
  if (z.type === 'brute') {
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2 + performance.now() / 3000;
      ctx.beginPath();
      ctx.moveTo(z.x + Math.cos(a) * z.r * 0.7, z.y + bob + Math.sin(a) * z.r * 0.7);
      ctx.lineTo(z.x + Math.cos(a) * z.r * 1.12, z.y + bob + Math.sin(a) * z.r * 1.12);
      ctx.stroke();
    }
  } else if (z.type === 'runner') {
    ctx.strokeStyle = z.color + '70';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const offY = (i - 1) * z.r * 0.4;
      ctx.beginPath();
      ctx.moveTo(z.x - z.r * 1.6, z.y + bob + offY);
      ctx.lineTo(z.x - z.r * 0.95, z.y + bob + offY);
      ctx.stroke();
    }
  } else if (z.type === 'spitter') {
    ctx.fillStyle = '#84cc16';
    ctx.beginPath(); ctx.arc(z.x, z.y + bob + z.r*0.35, z.r*0.35, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#365314';
    ctx.lineWidth = 1.5; ctx.stroke();
  } else if (z.type === 'exploder') {
    const pulse = 0.4 + Math.sin(performance.now() / 100) * 0.35;
    ctx.strokeStyle = `rgba(249,115,22,${pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(z.x, z.y + bob, z.r * (1.1 + pulse * 0.3), 0, Math.PI*2); ctx.stroke();
  }

  // Глаза
  ctx.fillStyle = '#fde047';
  ctx.beginPath();
  ctx.arc(z.x - z.r*0.3, z.y + bob - z.r*0.22, z.r*0.14, 0, Math.PI*2);
  ctx.arc(z.x + z.r*0.3, z.y + bob - z.r*0.22, z.r*0.14, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#7f1d1d';
  ctx.beginPath();
  ctx.arc(z.x - z.r*0.3, z.y + bob - z.r*0.22, z.r*0.06, 0, Math.PI*2);
  ctx.arc(z.x + z.r*0.3, z.y + bob - z.r*0.22, z.r*0.06, 0, Math.PI*2);
  ctx.fill();

  if (z.hp < z.maxHp) {
    const bw = z.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(z.x - z.r, z.y - z.r - 8, bw, 3);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(z.x - z.r, z.y - z.r - 8, bw * Math.max(0, z.hp / z.maxHp), 3);
  }
}

function drawBoss(b) {
  if (!isVisible(b.x, b.y, b.r + 60)) return;

  const pulse = 0.4 + Math.sin(performance.now() / 150) * 0.3;
  const auraR = b.r * (1.6 + pulse * 0.4);
  const ag = ctx.createRadialGradient(b.x, b.y, b.r * 0.5, b.x, b.y, auraR);
  ag.addColorStop(0, b.color + '60');
  ag.addColorStop(1, b.color + '00');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(b.x, b.y, auraR, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y + b.r * 0.85, b.r * 1.25, b.r * 0.45, 0, 0, Math.PI*2);
  ctx.fill();

  const g = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.2, b.x, b.y, b.r);
  g.addColorStop(0, shade(b.color, 40));
  g.addColorStop(1, shade(b.color, -70));
  ctx.fillStyle = b.hitFlash > 0 ? '#ffffff' : g;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#0a0e14';
  ctx.lineWidth = 3; ctx.stroke();

  // Шипы по краю
  ctx.fillStyle = shade(b.color, -70);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + performance.now() / 2000;
    ctx.beginPath();
    ctx.moveTo(b.x + Math.cos(a - 0.15) * b.r * 0.9, b.y + Math.sin(a - 0.15) * b.r * 0.9);
    ctx.lineTo(b.x + Math.cos(a) * b.r * 1.3, b.y + Math.sin(a) * b.r * 1.3);
    ctx.lineTo(b.x + Math.cos(a + 0.15) * b.r * 0.9, b.y + Math.sin(a + 0.15) * b.r * 0.9);
    ctx.closePath();
    ctx.fill();
  }

  // 4 глаза
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * Math.PI * 2 + performance.now() / 1500;
    const ex = b.x + Math.cos(a) * b.r * 0.5;
    const ey = b.y + Math.sin(a) * b.r * 0.5;
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(ex, ey, b.r * 0.13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7f1d1d';
    ctx.beginPath(); ctx.arc(ex, ey, b.r * 0.065, 0, Math.PI*2); ctx.fill();
  }

  // Корона
  ctx.fillStyle = '#fbbf24';
  const crownY = b.y - b.r - 8;
  ctx.beginPath();
  ctx.moveTo(b.x - b.r * 0.6, crownY + 10);
  ctx.lineTo(b.x - b.r * 0.6, crownY);
  ctx.lineTo(b.x - b.r * 0.3, crownY + 6);
  ctx.lineTo(b.x, crownY);
  ctx.lineTo(b.x + b.r * 0.3, crownY + 6);
  ctx.lineTo(b.x + b.r * 0.6, crownY);
  ctx.lineTo(b.x + b.r * 0.6, crownY + 10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 1.5; ctx.stroke();
}

// ========== HUD ==========
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  const p = game.player;
  const w = WEAPONS[p.weapon];

  const barW = 140, barH = 14;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(16, 16, barW, barH, 7); ctx.fill();

  const hpPct = Math.max(0, p.hp / p.maxHp);
  ctx.fillStyle = hpPct > 0.5 ? '#4ade80' : hpPct > 0.25 ? '#facc15' : '#f87171';
  roundRect(16, 16, barW * hpPct, barH, 7); ctx.fill();

  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.fillStyle = '#e6edf3';
  ctx.textAlign = 'left';
  ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, 16 + barW + 8, 28);

  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = CLASSES[p.class].color;
  ctx.fillText(`ВОЛНА ${game.wave}${game.wave % 5 === 0 ? ' 👑' : ''}`, 16, 62);

  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = '#9ca3af';
  const left = game.zombies.length + game.spawnQueue;
  ctx.fillText(`Врагов: ${left}`, 16, 80);
  ctx.fillText(`${w.icon} ${w.name}`, 16, 98);

  ctx.textAlign = 'right';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = '#e6edf3';
  ctx.fillText(`Очки: ${game.score}`, W - 16, 62);
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = '#9ca3af';
  ctx.fillText(`Убито: ${game.kills}`, W - 16, 80);
  ctx.textAlign = 'left';

  if (game.boss) {
    const bw = Math.min(320, W * 0.7);
    const bx = (W - bw) / 2;
    const by = 115;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    roundRect(bx - 3, by - 3, bw + 6, 24, 4); ctx.fill();
    const bhp = Math.max(0, game.boss.hp / game.boss.maxHp);
    ctx.fillStyle = game.boss.color;
    roundRect(bx, by, bw * bhp, 18, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    roundRect(bx, by, bw * bhp, 8, 3); ctx.fill();
    ctx.fillStyle = '#e6edf3';
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(`👑 ${game.boss.name}`, W/2, by - 8);
    ctx.textAlign = 'left';
  }

  if (game.waveBanner > 0) {
    const alpha = Math.min(1, game.waveBanner);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = game.wave % 5 === 0 ? '#fbbf24' : '#e6edf3';
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(game.wave % 5 === 0 ? `БОСС-ВОЛНА ${game.wave}` : `ВОЛНА ${game.wave}`, W/2, H/2 - 60);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

// ========== DRAW ==========
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const m = MAPS[game.mapKey] || MAPS.forest;
  ctx.fillStyle = m.ground;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (game.screenShake > 0.5) {
    ctx.translate((Math.random() - 0.5) * game.screenShake, (Math.random() - 0.5) * game.screenShake);
  }
  ctx.translate(-camera.x, -camera.y);

  // Патчи
  for (const pt of game.patches) {
    if (!isVisible(pt.x, pt.y, pt.r)) continue;
    ctx.fillStyle = m.accent;
    ctx.globalAlpha = pt.alpha;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Сетка
  ctx.strokeStyle = m.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  const gx0 = Math.floor(camera.x / 40) * 40;
  const gy0 = Math.floor(camera.y / 40) * 40;
  for (let x = gx0; x < camera.x + W + 40; x += 40) {
    ctx.moveTo(x, gy0);
    ctx.lineTo(x, camera.y + H + 40);
  }
  for (let y = gy0; y < camera.y + H + 40; y += 40) {
    ctx.moveTo(gx0, y);
    ctx.lineTo(camera.x + W + 40, y);
  }
  ctx.stroke();

  // Граница мира
  ctx.strokeStyle = m.accent + '50';
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, game.world.w, game.world.h);

  // Декор
  for (const d of game.decorations) drawDecoration(d);

  // Препятствия
  for (const o of game.obstacles) drawObstacle(o);

  // Пикапы
  for (const pk of game.pickups) {
    if (!isVisible(pk.x, pk.y, 30)) continue;
    const scl = 1 + Math.sin(pk.bob) * 0.15;
    ctx.fillStyle = 'rgba(74,222,128,0.3)';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.r * scl * 1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.r * scl, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(pk.x - 1.5, pk.y - 4, 3, 8);
    ctx.fillRect(pk.x - 4, pk.y - 1.5, 8, 3);
  }

  // Частицы
  for (const pt of game.particles) {
    if (!isVisible(pt.x, pt.y, 10)) continue;
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size/2, pt.y - pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  // Пули
  for (const b of game.bullets) {
    if (!isVisible(b.x, b.y, 10)) continue;
    ctx.fillStyle = b.color + '40';
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2); ctx.fill();
  }

  // Вражеские снаряды
  for (const eb of game.enemyBullets) {
    if (!isVisible(eb.x, eb.y, 15)) continue;
    ctx.fillStyle = eb.color + '50';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = eb.color;
    ctx.beginPath(); ctx.arc(eb.x, eb.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1; ctx.stroke();
  }

  // Радиус стрельбы (под игроком)
  const p = game.player;
  const s = stats(p);
  ctx.strokeStyle = 'rgba(74,222,128,0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(p.x, p.y, s.range, 0, Math.PI*2); ctx.stroke();

  // Сущности (сортируем по Y для глубины)
  const entities = [...game.zombies, p].sort((a, b) => a.y - b.y);
  for (const e of entities) {
    if (e === p) drawPlayer(e);
    else if (e.isBoss) drawBoss(e);
    else drawZombie(e);
  }

  ctx.restore();

  // Джойстик
  if (joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, joy.maxR, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(74,222,128,0.65)';
    ctx.beginPath();
    ctx.arc(joy.baseX + joy.dx * joy.maxR, joy.baseY + joy.dy * joy.maxR, 24, 0, Math.PI*2);
    ctx.fill();
  }

  drawHUD();
}

// ========== ЦИКЛ ==========
function loop(ts) {
  requestAnimationFrame(loop);
  if (!game.lastTime) game.lastTime = ts;
  let dt = (ts - game.lastTime) / 1000;
  game.lastTime = ts;
  dt = Math.min(dt, 0.05);
  if (game.running && game.player) update(dt);
  if (game.player) draw();
  else {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(0, 0, W, H);
  }
}

showMapSelection();
requestAnimationFrame(loop);
</script>
</body>
