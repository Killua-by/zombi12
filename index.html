<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Выживание: Зомби 2.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0a0e14;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #e6edf3;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas#game { display: block; position: absolute; top: 0; left: 0; touch-action: none; z-index: 1; }
  #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  .hud-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .hp-box { background: rgba(10,14,20,0.85); border: 1px solid #334155; border-radius: 10px; padding: 6px 10px; width: 140px; }
  .hp-bar-bg { height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; }
  .hp-bar-fill { height: 100%; background: linear-gradient(90deg,#dc2626,#f87171); transition: width 0.15s; border-radius: 6px; }
  .hp-text { font-size: 11px; font-weight: 800; text-align: center; margin-top: 2px; color: #fca5a5; }
  .coin-box { background: rgba(10,14,20,0.85); border: 1px solid #334155; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 800; }
  .wave-info { background: rgba(10,14,20,0.85); border: 1px solid #334155; border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 800; text-align: center; }
  .weapon-info { position: absolute; bottom: 110px; left: 10px; background: rgba(10,14,20,0.85); border: 1px solid #334155; border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 800; }
  .weapon-info .mag { color: #fbbf24; }
  .weapon-info .reserve { color: #94a3b8; font-size: 11px; }
  .weapon-info.reloading { border-color: #fbbf24; animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
  .actions { position: absolute; bottom: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .action-row { display: flex; gap: 8px; }
  .btn { pointer-events: auto; width: 58px; height: 58px; border-radius: 14px; border: 1px solid #334155; background: rgba(30,41,59,0.9); color: white; font-size: 22px; display: flex; justify-content: center; align-items: center; font-weight: 800; position: relative; }
  .btn:active { transform: scale(0.92); background: rgba(56,189,248,0.3); }
  .btn:disabled { opacity: 0.35; filter: grayscale(1); }
  .btn.grenade { background: linear-gradient(135deg,#16a34a,#15803d); }
  .btn.barricade { background: linear-gradient(135deg,#a16207,#854d0e); }
  .btn.reload { background: linear-gradient(135deg,#ea580c,#c2410c); }
  .btn .count-badge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; border-radius: 10px; padding: 2px 6px; font-size: 10px; font-weight: 900; }
  #screen { position: absolute; inset: 0; background: #0a0e14; z-index: 200; display: none; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; text-align: center; }
  #screen.active { display: block; }
  .screen-inner { max-width: 460px; margin: 0 auto; padding: 25px 20px 60px; }
  .title { font-size: 30px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; color: #38bdf8; }
  .title.red { color: #ef4444; }
  .title.green { color: #22c55e; }
  .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
  .btn-big { pointer-events: auto; width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg,#38bdf8,#0ea5e9); color: #0a0e14; font-size: 17px; font-weight: 800; margin-bottom: 10px; cursor: pointer; }
  .btn-big.gray { background: linear-gradient(135deg,#475569,#334155); color: white; }
  .btn-big.green { background: linear-gradient(135deg,#22c55e,#15803d); color: white; }
  .btn-big:active { transform: scale(0.97); }
  .grid-3 { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
  .card-select { pointer-events: auto; background: #1e293b; border: 2px solid #334155; border-radius: 14px; padding: 14px; text-align: left; cursor: pointer; }
  .card-select.selected { border-color: #38bdf8; background: rgba(56,189,248,0.1); }
  .card-select .name { font-weight: 900; font-size: 16px; margin-bottom: 6px; }
  .card-select .desc { font-size: 12px; color: #cbd5e1; line-height: 1.4; }
  .shop-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .shop-item { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; text-align: left; }
  .shop-item .name { font-weight: 900; font-size: 15px; margin-bottom: 4px; }
  .shop-item .desc { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; }
  .shop-item .buy-btn { pointer-events: auto; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #8b5cf6; color: white; font-weight: 800; font-size: 13px; }
  .shop-item .buy-btn:disabled { background: #475569; opacity: 0.6; }
  .meta-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .meta-item .info { text-align: left; }
  .meta-item .info .n { font-weight: 800; font-size: 14px; }
  .meta-item .info .d { font-size: 11px; color: #94a3b8; }
  .meta-item .buy-btn { pointer-events: auto; padding: 8px 14px; border-radius: 8px; border: none; background: #a855f7; color: white; font-weight: 800; font-size: 12px; }
  .meta-item .buy-btn:disabled { background: #475569; opacity: 0.6; }
  .hint { font-size: 12px; color: #64748b; margin-top: 15px; line-height: 1.8; text-align: left; padding-left: 8px; }
  .stat-line { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
  .stat-line b { color: #38bdf8; }
  .save-badge { display:inline-block; background: rgba(34,197,94,0.15); border: 1px solid #22c55e; color: #22c55e; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; margin-left: 6px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap" width="184" height="184"></canvas>
<div id="ui">
  <div class="hud-top">
    <div class="hp-box">
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hpBar" style="width:100%"></div></div>
      <div class="hp-text" id="hpText">100 / 100</div>
    </div>
    <div class="wave-info" id="waveInfo">Волна 1</div>
    <div class="coin-box">💰 <span id="coins">0</span> · 💎 <span id="crystals">0</span></div>
  </div>
  <div class="weapon-info" id="weaponInfo">🔫 Пистолет · ∞</div>
  <div class="actions">
    <div class="action-row">
      <button class="btn barricade" id="barricadeBtn">🧱<span class="count-badge" id="barricadeCount">2</span></button>
      <button class="btn grenade" id="grenadeBtn">💣<span class="count-badge" id="grenadeCount">3</span></button>
      <button class="btn reload" id="reloadBtn">🔄</button>
    </div>
    <div class="action-row">
      <button class="btn" id="pauseBtn">⏸</button>
    </div>
  </div>
</div>
<div id="screen"><div class="screen-inner" id="screenInner"></div></div>

<script>
"use strict";

// ФОРС-ПОЗИЦИЯ МИНИ-КАРТЫ (обход кэша)
(function(){
  const fix = () => {
    const mc = document.getElementById('minimap');
    if (!mc) { setTimeout(fix, 50); return; }
    let wrap = document.getElementById('minimapWrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'minimapWrap';
      mc.parentNode.insertBefore(wrap, mc);
      wrap.appendChild(mc);
    }
    wrap.style.cssText = 'position:fixed!important;bottom:185px!important;right:12px!important;top:auto!important;left:auto!important;width:92px;height:92px;border:2px solid rgba(56,189,248,0.6);border-radius:10px;background:rgba(2,6,23,0.85);z-index:99999!important;pointer-events:none;overflow:hidden;';
    mc.style.cssText = 'width:100%!important;height:100%!important;display:block!important;position:static!important;';
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix);
  else fix();
  window.addEventListener('load', fix);
})();

// ЛИМИТЫ
const MAX_PARTICLES = 60;
const MAX_PICKUPS = 8;
const MAX_ZOMBIES = 22;
const MAX_ZOMBIE_DIST = 1600;
const WAVE_TIMEOUT = 80;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');
const screenEl = document.getElementById('screen');
const screenInner = document.getElementById('screenInner');
const hpBar = document.getElementById('hpBar');
const hpText = document.getElementById('hpText');
const waveInfo = document.getElementById('waveInfo');
const coinsEl = document.getElementById('coins');
const crystalsEl = document.getElementById('crystals');
const weaponInfo = document.getElementById('weaponInfo');
const grenadeBtn = document.getElementById('grenadeBtn');
const barricadeBtn = document.getElementById('barricadeBtn');
const reloadBtn = document.getElementById('reloadBtn');
const grenadeCount = document.getElementById('grenadeCount');
const barricadeCount = document.getElementById('barricadeCount');
const pauseBtn = document.getElementById('pauseBtn');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

let actx = null;
function initAudio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type='sine', vol=0.04) {
  if (!actx || actx.state !== 'running') return;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}

const META_KEY = 'zombie_meta_v2';
let meta = { crystals: 0, upgrades: { hp: 0, damage: 0, speed: 0, coinDrop: 0, startGrenades: 0, startCoins: 0 } };
try { const saved = localStorage.getItem(META_KEY); if (saved) meta = JSON.parse(saved); } catch(e) {}
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch(e) {} }

const SAVE_KEY = 'zombie_save_v2';
let _lastSave = 0;
function saveGame() {
  if (!game.player || ['menu','gameover','classSelect','mapSelect'].includes(game.state)) return;
  const now = performance.now();
  if (now - _lastSave < 3000) return;
  _lastSave = now;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      wave: game.wave, coins: game.coins, crystals: game.crystals, kills: game.kills,
      currentWeapon: game.currentWeapon, weaponAmmo: {...game.weaponAmmo}, magAmmo: {...game.magAmmo},
      selectedClass: game.selectedClass, selectedMap: game.selectedMap,
      playerHP: game.player.hp, playerMaxHP: game.player.maxHp,
      grenades: game.player.grenades, barricades: game.player.barricades,
      damageMult: game.player.damageMult, coinMult: game.player.coinMult,
      timestamp: Date.now()
    }));
  } catch(e) {}
}
function loadGame() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch(e) {} }

const CLASSES = [
  { id: 'assault', name: '💪 Штурмовик', desc: 'Много HP, дробовик.', hpMult: 1.4, dmgMult: 1.0, speedMult: 1.0, startWeapon: 'shotgun', color: '#3b82f6' },
  { id: 'sniper', name: '🎯 Снайпер', desc: 'Мало HP, снайперка.', hpMult: 0.7, dmgMult: 1.7, speedMult: 1.0, startWeapon: 'rifle', color: '#fbbf24' },
  { id: 'engineer', name: '🔧 Инженер', desc: 'Больше гранат/баррикад.', hpMult: 1.0, dmgMult: 0.9, speedMult: 1.15, startWeapon: 'smg', color: '#22c55e' }
];

const MAPS = [
  { id: 'city', name: '🏙️ Город', bg: '#0a0e14', floor: 'tile', obstacleTypes: ['car', 'crate', 'wall'], obstacleCount: 8 },
  { id: 'forest', name: '🌲 Лес', bg: '#0a1410', floor: 'grass', obstacleTypes: ['tree', 'rock', 'bush'], obstacleCount: 12 },
  { id: 'bunker', name: '🏭 Бункер', bg: '#0a0e1a', floor: 'line', obstacleTypes: ['crate', 'barrel', 'wall'], obstacleCount: 6 }
];

const WEAPONS = {
  pistol: { name: 'Пистолет', icon: '🔫', dmg: 14, fireRate: 4.5, speed: 620, spread: 0.05, count: 1, pierce: 0, ammo: -1, cost: 0, range: 1.0, color: '#fde047', magazine: 12, reloadTime: 1.0 },
  shotgun: { name: 'Дробовик', icon: '🔫', dmg: 12, fireRate: 1.8, speed: 700, spread: 0.35, count: 5, pierce: 0, ammo: 360, cost: 120, range: 0.55, color: '#f97316', magazine: 6, reloadTime: 1.8 },
  smg: { name: 'Автомат', icon: '💥', dmg: 9, fireRate: 10, speed: 700, spread: 0.12, count: 1, pierce: 0, ammo: 360, cost: 200, range: 1.0, color: '#22d3ee', magazine: 30, reloadTime: 2.0 },
  rifle: { name: 'Снайперка', icon: '🎯', dmg: 55, fireRate: 2, speed: 1200, spread: 0.01, count: 1, pierce: 2, ammo: 360, cost: 250, range: 1.6, color: '#a855f7', magazine: 5, reloadTime: 2.5 },
  laser: { name: 'Лазер', icon: '⚡', dmg: 22, fireRate: 6, speed: 0, spread: 0, count: 1, pierce: 10, ammo: 360, cost: 350, range: 1.8, color: '#ef4444', isLaser: true, magazine: 20, reloadTime: 2.0 },
  grenadeLauncher: { name: 'Гранатомёт', icon: '💣', dmg: 60, fireRate: 1, speed: 450, spread: 0.08, count: 1, pierce: 0, ammo: 360, cost: 400, range: 1.2, color: '#84cc16', isExplosive: true, magazine: 2, reloadTime: 3.0 }
};

const Z_TYPES = {
  normal:   { hp: 30,   speed: 50,  r: 14, dmg: 12, color: '#5d8a4a', coinMin: 1, coinMax: 3 },
  fast:     { hp: 18,   speed: 110, r: 11, dmg: 15, color: '#b8493a', coinMin: 2, coinMax: 4 },
  tank:     { hp: 140,  speed: 32,  r: 22, dmg: 22, color: '#7d5aa0', coinMin: 5, coinMax: 10 },
  explosive:{ hp: 25,   speed: 60,  r: 15, dmg: 8,  color: '#ea580c', coinMin: 3, coinMax: 6, onDeathExplode: { radius: 80, dmg: 20 } },
  spitter:  { hp: 40,   speed: 45,  r: 14, dmg: 6,  color: '#eab308', coinMin: 3, coinMax: 5, ranged: { rate: 2.0, speed: 320, dmg: 10, color: '#84cc16' } },
  invisible:{ hp: 35,   speed: 70,  r: 13, dmg: 18, color: '#475569', coinMin: 4, coinMax: 7, invisibilityRange: 180 },
  armored:  { hp: 100,  speed: 40,  r: 18, dmg: 20, color: '#64748b', coinMin: 5, coinMax: 9, armor: 0.5 }
};

const game = {
  state: 'menu', wave: 0, kills: 0, coins: 0, crystals: 0,
  player: null, zombies: [], bullets: [], enemyBullets: [], particles: [], pickups: [], barricades: [],
  obstacles: [], spawnQueue: [], spawnTimer: 0, waveActive: false, waveTimer: 0,
  isNight: false, camera: { x: 0, y: 0, zoom: 1 }, time: 0,
  selectedClass: 'assault', selectedMap: 'city', currentWeapon: 'pistol',
  weaponAmmo: {}, magAmmo: {},
  reloading: false, reloadTimer: 0,
  isBossWave: false, boss: null, shopUpgrades: [], mapConfig: null,
  shake: 0, lastTime: 0
};

function createPlayer(className) {
  const cls = CLASSES.find(c => c.id === className) || CLASSES[0];
  const baseHp = 100 * cls.hpMult * (1 + meta.upgrades.hp * 0.1);
  return {
    x: 0, y: 0, r: 14,
    hp: baseHp, maxHp: baseHp,
    speed: 175 * cls.speedMult * (1 + meta.upgrades.speed * 0.05),
    bodyAngle: -Math.PI/2, angle: -Math.PI/2,
    fireCooldown: 0, hurtFlash: 0, invuln: 0,
    damageMult: cls.dmgMult * (1 + meta.upgrades.damage * 0.1),
    coinMult: 1 + meta.upgrades.coinDrop * 0.15,
    grenades: 3 + (className === 'engineer' ? 3 : 0) + meta.upgrades.startGrenades,
    barricades: className === 'engineer' ? 5 : 2,
    color: cls.color
  };
}

const joystick = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
const JOY_MAX = 55;
const keys = { w: false, a: false, s: false, d: false };

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (!joystick.active) {
      joystick.active = true; joystick.id = t.identifier;
      joystick.bx = t.clientX; joystick.by = t.clientY;
      joystick.dx = 0; joystick.dy = 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      let dx = t.clientX - joystick.bx; let dy = t.clientY - joystick.by;
      const d = Math.hypot(dx, dy);
      if (d > JOY_MAX) { dx = dx/d * JOY_MAX; dy = dy/d * JOY_MAX; }
      joystick.dx = dx / JOY_MAX; joystick.dy = dy / JOY_MAX;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      joystick.active = false; joystick.id = null;
      joystick.dx = 0; joystick.dy = 0;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });
window.addEventListener('keydown', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

function rnd(min, max) { return min + Math.random() * (max - min); }

function updateHUD() {
  if (!game.player) return;
  const p = game.player;
  const pct = Math.max(0, p.hp / p.maxHp * 100);
  hpBar.style.width = pct + '%';
  hpText.textContent = `${Math.max(0, Math.ceil(p.hp))} / ${Math.ceil(p.maxHp)}`;
  waveInfo.textContent = game.isBossWave ? '👹 БОСС' : `Волна ${game.wave}`;
  coinsEl.textContent = game.coins;
  crystalsEl.textContent = game.crystals;
  const w = WEAPONS[game.currentWeapon];
  const reserve = game.weaponAmmo[game.currentWeapon];
  const mag = game.magAmmo[game.currentWeapon];
  if (game.reloading) {
    weaponInfo.innerHTML = `${w.icon} ${w.name} · <span class="mag">ПЕРЕЗАРЯДКА...</span>`;
    weaponInfo.classList.add('reloading');
  } else {
    weaponInfo.classList.remove('reloading');
    if (reserve === -1) weaponInfo.innerHTML = `${w.icon} ${w.name} · <span class="mag">∞</span>`;
    else weaponInfo.innerHTML = `${w.icon} ${w.name} · <span class="mag">${mag}</span> / <span class="reserve">${reserve}</span>`;
  }
  grenadeCount.textContent = p.grenades;
  barricadeCount.textContent = p.barricades;
  grenadeBtn.disabled = p.grenades <= 0;
  barricadeBtn.disabled = p.barricades <= 0;
  reloadBtn.disabled = game.reloading || reserve === -1 || mag >= w.magazine || reserve <= 0;
}

function startReload() {
  const w = WEAPONS[game.currentWeapon];
  const reserve = game.weaponAmmo[game.currentWeapon];
  const mag = game.magAmmo[game.currentWeapon];
  if (game.reloading || reserve === -1 || mag >= w.magazine || reserve <= 0) return;
  game.reloading = true;
  game.reloadTimer = w.reloadTime;
  beep(400, 0.15, 'square', 0.05);
  updateHUD();
}

function finishReload() {
  const w = WEAPONS[game.currentWeapon];
  const reserve = game.weaponAmmo[game.currentWeapon];
  const mag = game.magAmmo[game.currentWeapon];
  const needed = w.magazine - mag;
  const available = Math.min(needed, reserve);
  game.magAmmo[game.currentWeapon] += available;
  game.weaponAmmo[game.currentWeapon] -= available;
  game.reloading = false;
  game.reloadTimer = 0;
  beep(700, 0.15, 'sine', 0.06);
  updateHUD();
}

function startGame() {
  initAudio();
  game.state = 'playing';
  game.wave = 0; game.kills = 0;
  game.coins = meta.upgrades.startCoins > 0 ? meta.upgrades.startCoins * 50 : 0;
  game.crystals = 0;
  game.zombies = []; game.bullets = []; game.enemyBullets = [];
  game.particles = []; game.pickups = []; game.barricades = [];
  game.spawnQueue = []; game.spawnTimer = 0;
  game.waveActive = false; game.waveTimer = 0; game.isNight = false;
  game.boss = null; game.isBossWave = false;
  game.time = 0; game.shake = 0;
  game.reloading = false; game.reloadTimer = 0;
  game.mapConfig = MAPS.find(m => m.id === game.selectedMap) || MAPS[0];
  generateObstacles(game.mapConfig);
  game.player = createPlayer(game.selectedClass);
  game.player.x = 0; game.player.y = 0;
  const startWeapon = CLASSES.find(c => c.id === game.selectedClass).startWeapon;
  game.currentWeapon = startWeapon;
  game.weaponAmmo = { pistol: -1, shotgun: 0, smg: 0, rifle: 0, laser: 0, grenadeLauncher: 0 };
  game.magAmmo = { pistol: 12, shotgun: 0, smg: 0, rifle: 0, laser: 0, grenadeLauncher: 0 };
  if (startWeapon !== 'pistol') {
    game.weaponAmmo[startWeapon] = 360;
    game.magAmmo[startWeapon] = WEAPONS[startWeapon].magazine;
  }
  game.camera.x = 0; game.camera.y = 0;
  screenEl.classList.remove('active');
  updateHUD();
  setTimeout(() => { if (game.state === 'playing') startWave(); }, 1000);
}

function continueGame(save) {
  initAudio();
  game.state = 'playing';
  game.wave = save.wave; game.kills = save.kills;
  game.coins = save.coins; game.crystals = save.crystals;
  game.zombies = []; game.bullets = []; game.enemyBullets = [];
  game.particles = []; game.pickups = []; game.barricades = [];
  game.spawnQueue = []; game.spawnTimer = 0;
  game.waveActive = false; game.waveTimer = 0;
  game.isNight = save.wave >= 3;
  game.boss = null; game.isBossWave = false;
  game.time = 0; game.shake = 0;
  game.reloading = false; game.reloadTimer = 0;
  game.selectedClass = save.selectedClass;
  game.selectedMap = save.selectedMap;
  game.currentWeapon = save.currentWeapon;
  game.weaponAmmo = {...save.weaponAmmo};
  game.magAmmo = save.magAmmo ? {...save.magAmmo} : { pistol: 12, shotgun: 0, smg: 0, rifle: 0, laser: 0, grenadeLauncher: 0 };
  game.mapConfig = MAPS.find(m => m.id === game.selectedMap) || MAPS[0];
  generateObstacles(game.mapConfig);
  game.player = createPlayer(game.selectedClass);
  game.player.x = 0; game.player.y = 0;
  game.player.hp = save.playerHP;
  game.player.maxHp = save.playerMaxHP;
  game.player.grenades = save.grenades;
  game.player.barricades = save.barricades;
  if (save.damageMult) game.player.damageMult = save.damageMult;
  if (save.coinMult) game.player.coinMult = save.coinMult;
  game.camera.x = 0; game.camera.y = 0;
  screenEl.classList.remove('active');
  updateHUD();
  setTimeout(() => { if (game.state === 'playing') startWave(); }, 1000);
}

function generateObstacles(cfg) {
  game.obstacles = [];
  for (let i = 0; i < cfg.obstacleCount; i++) {
    let x, y, tries = 0;
    do { x = rnd(-W*0.35, W*0.35); y = rnd(-H*0.35, H*0.35); tries++; }
    while (Math.hypot(x, y) < 130 && tries < 20);
    const type = cfg.obstacleTypes[Math.floor(Math.random() * cfg.obstacleTypes.length)];
    let size = 45;
    if (type === 'wall') size = rnd(50, 75);
    else if (type === 'car') size = rnd(55, 70);
    else if (type === 'tree') size = rnd(40, 55);
    else if (type === 'crate' || type === 'barrel') size = rnd(35, 45);
    else if (type === 'rock') size = rnd(35, 45);
    else if (type === 'bush') size = rnd(35, 45);
    game.obstacles.push({ x, y, size, type });
  }
}

function startWave() {
  game.wave++;
  game.waveActive = true;
  game.waveTimer = 0;
  game.isBossWave = (game.wave % 5 === 0);
  game.isNight = game.wave >= 3;
  if (game.isBossWave) { spawnBoss(); game.spawnQueue = []; }
  else {
    const count = Math.min(20, 5 + Math.floor(game.wave * 2));
    game.spawnQueue = [];
    for (let i = 0; i < count; i++) game.spawnQueue.push(pickZombieType(game.wave));
    game.spawnTimer = 0;
  }
  updateHUD();
}

function pickZombieType(wave) {
  const r = Math.random();
  if (wave < 2) return 'normal';
  if (wave < 3) return r < 0.6 ? 'normal' : 'fast';
  if (wave < 5) {
    if (r < 0.35) return 'normal';
    if (r < 0.6) return 'fast';
    if (r < 0.75) return 'explosive';
    if (r < 0.85) return 'spitter';
    return 'tank';
  }
  if (r < 0.25) return 'normal';
  if (r < 0.45) return 'fast';
  if (r < 0.58) return 'explosive';
  if (r < 0.7) return 'spitter';
  if (r < 0.82) return 'tank';
  if (r < 0.92) return 'armored';
  return 'invisible';
}

function spawnZombie(type) {
  if (game.zombies.length >= MAX_ZOMBIES) return;
  const cfg = Z_TYPES[type];
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(W, H) * 0.6 + rnd(0, 100);
  const hpScale = 1 + (game.wave - 1) * 0.15;
  const speedScale = 1 + (game.wave - 1) * 0.03;
  game.zombies.push({
    x: game.player.x + Math.cos(angle) * dist,
    y: game.player.y + Math.sin(angle) * dist,
    r: cfg.r, hp: cfg.hp * hpScale, maxHp: cfg.hp * hpScale,
    speed: cfg.speed * speedScale, dmg: cfg.dmg, color: cfg.color, type,
    coinMin: cfg.coinMin || 1, coinMax: cfg.coinMax || 3,
    onDeathExplode: cfg.onDeathExplode, ranged: cfg.ranged,
    rangedCooldown: 0, invisibilityRange: cfg.invisibilityRange,
    armor: cfg.armor || 0, angle: 0, hitFlash: 0, slowMult: 1,
    _exploding: false
  });
}

function spawnZombieAt(x, y, type) {
  if (game.zombies.length >= MAX_ZOMBIES) return;
  const cfg = Z_TYPES[type];
  const hpScale = 1 + (game.wave - 1) * 0.15;
  game.zombies.push({
    x, y, r: cfg.r,
    hp: cfg.hp * hpScale * 0.5, maxHp: cfg.hp * hpScale * 0.5,
    speed: cfg.speed, dmg: cfg.dmg, color: cfg.color, type,
    coinMin: 1, coinMax: 2, armor: cfg.armor || 0,
    angle: 0, hitFlash: 0, slowMult: 1, _exploding: false
  });
}

function spawnBoss() {
  const waveHp = 700 + game.wave * 350;
  game.boss = {
    x: game.player.x, y: game.player.y - Math.max(W, H) * 0.6,
    r: 55, hp: waveHp, maxHp: waveHp,
    speed: 55, dmg: 35,
    state: 'chase', stateTimer: 3, angle: 0,
    hitFlash: 0, color: '#7f1d1d', slowMult: 1
  };
  beep(80, 0.6, 'sawtooth', 0.15);
  setTimeout(() => beep(60, 0.8, 'sawtooth', 0.12), 300);
}

function maxRangeFor(mult) { return Math.max(W, H) * mult; }

function nearestTarget(x, y, rangeMult) {
  let best = null, bestD = Infinity;
  const maxRange = Math.max(W, H) * 0.6 * rangeMult;
  for (const z of game.zombies) {
    const d = Math.hypot(z.x - x, z.y - y);
    if (d < bestD && d < maxRange) { bestD = d; best = z; }
  }
  if (game.boss) {
    const d = Math.hypot(game.boss.x - x, game.boss.y - y);
    if (d < bestD && d < maxRange) { bestD = d; best = game.boss; }
  }
  return best;
}

function playerShoot() {
  if (game.reloading) return;
  const p = game.player;
  const w = WEAPONS[game.currentWeapon];
  if (p.fireCooldown > 0) return;
  if (game.magAmmo[game.currentWeapon] <= 0) {
    if (game.weaponAmmo[game.currentWeapon] === -1) game.magAmmo[game.currentWeapon] = w.magazine;
    else if (game.weaponAmmo[game.currentWeapon] > 0) { startReload(); return; }
    else { game.currentWeapon = 'pistol'; updateHUD(); return; }
  }
  const target = nearestTarget(p.x, p.y, w.range);
  if (!target) return;
  p.angle = Math.atan2(target.y - p.y, target.x - p.x);
  p.fireCooldown = 1 / w.fireRate;
  if (w.isLaser) fireLaser(p, w);
  else {
    for (let i = 0; i < w.count; i++) {
      const sa = p.angle + (Math.random() - 0.5) * w.spread;
      game.bullets.push({
        x: p.x + Math.cos(p.angle) * (p.r + 8),
        y: p.y + Math.sin(p.angle) * (p.r + 8),
        vx: Math.cos(sa) * w.speed, vy: Math.sin(sa) * w.speed,
        r: w.isExplosive ? 6 : 4, dmg: w.dmg * p.damageMult,
        pierce: w.pierce, hits: [], color: w.color,
        isExplosive: w.isExplosive, range: maxRangeFor(w.range), traveled: 0
      });
    }
  }
  game.magAmmo[game.currentWeapon]--;
  beep(w.isExplosive ? 200 : 300 + Math.random() * 60, 0.04, 'square', 0.02);
  updateHUD();
}

function fireLaser(p, w) {
  const bl = maxRangeFor(w.range);
  const nx = Math.cos(p.angle), ny = Math.sin(p.angle);
  let closestHit = Infinity;
  const hits = [];
  const all = [...game.zombies];
  if (game.boss) all.push(game.boss);
  for (const z of all) {
    const zx = z.x - p.x, zy = z.y - p.y;
    const proj = zx * nx + zy * ny;
    if (proj < 0 || proj > bl) continue;
    const perp = Math.abs(zx * ny - zy * nx);
    if (perp < z.r + 5) { hits.push(z); if (proj < closestHit) closestHit = proj; }
  }
  for (const z of hits) damageEnemy(z, w.dmg * p.damageMult);
  if (game.particles.length < MAX_PARTICLES) {
    game.particles.push({
      type: 'laser', x1: p.x, y1: p.y,
      x2: p.x + nx * Math.min(closestHit + 50, bl),
      y2: p.y + ny * Math.min(closestHit + 50, bl),
      life: 0.15, maxLife: 0.15, color: w.color
    });
  }
}

function throwGrenade() {
  const p = game.player;
  if (p.grenades <= 0) return;
  p.grenades--;
  game.bullets.push({
    x: p.x, y: p.y,
    vx: Math.cos(p.bodyAngle) * 400, vy: Math.sin(p.bodyAngle) * 400,
    r: 8, dmg: 60, pierce: 0, hits: [], color: '#84cc16',
    isExplosive: true, isGrenade: true, life: 1.2, range: 400, traveled: 0
  });
  beep(500, 0.1, 'triangle', 0.06);
  updateHUD();
}

function placeBarricade() {
  const p = game.player;
  if (p.barricades <= 0) return;
  p.barricades--;
  game.barricades.push({
    x: p.x + Math.cos(p.bodyAngle) * 60,
    y: p.y + Math.sin(p.bodyAngle) * 60,
    r: 28, hp: 80, maxHp: 80
  });
  beep(400, 0.1, 'square', 0.05);
  updateHUD();
}

function damageEnemy(z, dmg) {
  let finalDmg = dmg;
  if (z.armor) finalDmg *= (1 - z.armor);
  z.hp -= finalDmg;
  z.hitFlash = 0.12;
  if (z.hp <= 0) killEnemy(z);
}

function killEnemy(z) {
  if (z.onDeathExplode && !z._exploding) {
    z._exploding = true;
    explodeAt(z.x, z.y, z.onDeathExplode.radius, z.onDeathExplode.dmg);
  }
  if (z.type) {
    const coins = Math.floor(rnd(z.coinMin, z.coinMax));
    game.coins += Math.floor(coins * game.player.coinMult);
    game.kills++;
    game.crystals += 0.1;
  }
  if (game.pickups.length < MAX_PICKUPS) {
    const roll = Math.random();
    if (roll < 0.08) game.pickups.push({ x: z.x, y: z.y, type: 'health', r: 12, life: 15 });
    else if (roll < 0.16) game.pickups.push({ x: z.x, y: z.y, type: 'grenade', r: 12, life: 15 });
    else if (roll < 0.28) game.pickups.push({ x: z.x, y: z.y, type: 'ammo', r: 12, life: 18 });
  }
  const idx = game.zombies.indexOf(z);
  if (idx >= 0) game.zombies.splice(idx, 1);
  spawnBlood(z.x, z.y, 5);
  beep(120, 0.08, 'sawtooth', 0.03);
}

function explodeAt(x, y, radius, dmg) {
  game.shake = Math.max(game.shake, 6);
  for (let i = game.zombies.length - 1; i >= 0; i--) {
    const z = game.zombies[i];
    if (Math.hypot(z.x - x, z.y - y) < radius + z.r) damageEnemy(z, dmg);
  }
  if (game.boss && Math.hypot(game.boss.x - x, game.boss.y - y) < radius + game.boss.r) {
    game.boss.hp -= dmg; game.boss.hitFlash = 0.2;
  }
  const cnt = Math.min(10, MAX_PARTICLES - game.particles.length);
  for (let i = 0; i < cnt; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rnd(50, 180);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4, maxLife: 0.4, size: rnd(2, 5), color: `hsl(${30 + Math.random()*20}, 90%, 55%)` });
  }
  beep(80, 0.3, 'sawtooth', 0.1);
}

function spawnBlood(x, y, count) {
  const actual = Math.min(count, MAX_PARTICLES - game.particles.length);
  for (let i = 0; i < actual; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rnd(40, 100);
    game.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rnd(0.3, 0.6), maxLife: 0.6, size: rnd(2, 4),
      color: `hsl(${348 + Math.random()*16}, 82%, ${32 + Math.random()*22}%)`
    });
  }
}

function update(dt) {
  if (game.state !== 'playing') return;
  game.time += dt;
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 30);
  const p = game.player;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.hurtFlash > 0) p.hurtFlash -= dt;
  if (p.fireCooldown > 0) p.fireCooldown -= dt;
  
  if (game.reloading) {
    game.reloadTimer -= dt;
    if (game.reloadTimer <= 0) finishReload();
  }

  let mx = 0, my = 0;
  if (joystick.active) { mx = joystick.dx; my = joystick.dy; }
  if (keys.w) my -= 1; if (keys.s) my += 1;
  if (keys.a) mx -= 1; if (keys.d) mx += 1;
  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }
  if (mag > 0.05) {
    p.x += mx * p.speed * dt;
    p.y += my * p.speed * dt;
    p.bodyAngle = Math.atan2(my, mx);
  }

  const maxR = 1400;
  const d = Math.hypot(p.x, p.y);
  if (d > maxR) { p.x = (p.x / d) * maxR; p.y = (p.y / d) * maxR; }

  for (const o of game.obstacles) {
    const dx = p.x - o.x, dy = p.y - o.y;
    const dist = Math.hypot(dx, dy);
    if (dist < o.size/2 + p.r && dist > 0.1) {
      const push = (o.size/2 + p.r - dist);
      p.x += (dx/dist) * push; p.y += (dy/dist) * push;
    }
  }

  game.camera.x = p.x; game.camera.y = p.y;
  playerShoot();

  if (game.spawnQueue.length > 0) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      game.spawnTimer = Math.max(0.2, 0.7 - game.wave * 0.02);
      spawnZombie(game.spawnQueue.shift());
    }
  }

  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.traveled += Math.hypot(b.vx, b.vy) * dt;
    if (b.life !== undefined) {
      b.life -= dt;
      if (b.life <= 0) {
        if (b.isGrenade) explodeAt(b.x, b.y, 100, b.dmg);
        game.bullets.splice(i, 1); continue;
      }
    }
    if (b.traveled > b.range) { game.bullets.splice(i, 1); continue; }
    let hit = false;
    for (let j = game.zombies.length - 1; j >= 0; j--) {
      const z = game.zombies[j];
      if (b.hits.includes(z)) continue;
      if (Math.hypot(z.x - b.x, z.y - b.y) < z.r + b.r) {
        damageEnemy(z, b.dmg);
        b.hits.push(z);
        if (b.isExplosive) { explodeAt(b.x, b.y, 80, b.dmg); game.bullets.splice(i, 1); hit = true; break; }
        if (b.pierce > 0) { b.pierce--; b.dmg *= 0.85; } else { game.bullets.splice(i, 1); hit = true; break; }
      }
    }
    if (hit) continue;
    if (game.boss && !b.hits.includes(game.boss)) {
      if (Math.hypot(game.boss.x - b.x, game.boss.y - b.y) < game.boss.r + b.r) {
        damageEnemy(game.boss, b.dmg);
        b.hits.push(game.boss);
        if (b.isExplosive) { explodeAt(b.x, b.y, 90, b.dmg); game.bullets.splice(i, 1); continue; }
        if (b.pierce > 0) b.pierce--;
        else { game.bullets.splice(i, 1); continue; }
      }
    }
  }

  for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
    const b = game.enemyBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.life !== undefined) { b.life -= dt; if (b.life <= 0) { game.enemyBullets.splice(i, 1); continue; } }
    if (Math.hypot(b.x - p.x, b.y - p.y) < p.r + 5) {
      if (p.invuln <= 0) { p.hp -= b.dmg; p.invuln = 0.5; p.hurtFlash = 0.4; game.shake = Math.max(game.shake, 4); beep(150, 0.1, 'sawtooth', 0.05); }
      game.enemyBullets.splice(i, 1);
    }
  }

  for (let i = game.zombies.length - 1; i >= 0; i--) {
    const z = game.zombies[i];
    if (Math.hypot(z.x - p.x, z.y - p.y) > MAX_ZOMBIE_DIST) { game.zombies.splice(i, 1); continue; }
    if (z.hitFlash > 0) z.hitFlash -= dt;
    z.slowMult = 1;
    for (let k = game.barricades.length - 1; k >= 0; k--) {
      const bar = game.barricades[k];
      if (Math.hypot(bar.x - z.x, bar.y - z.y) < bar.r + z.r) {
        z.slowMult = 0.2;
        bar.hp -= z.dmg * dt * 2;
        if (bar.hp <= 0) { game.barricades.splice(k, 1); beep(200, 0.2, 'sawtooth', 0.05); }
        break;
      }
    }
    const dx = p.x - z.x, dy = p.y - z.y;
    const dist = Math.hypot(dx, dy) || 1;
    z.angle = Math.atan2(dy, dx);
    if (z.ranged) {
      z.rangedCooldown -= dt;
      if (z.rangedCooldown <= 0 && dist < 400) {
        z.rangedCooldown = z.ranged.rate;
        game.enemyBullets.push({ x: z.x, y: z.y, vx: Math.cos(z.angle) * z.ranged.speed, vy: Math.sin(z.angle) * z.ranged.speed, dmg: z.ranged.dmg, life: 2, color: z.ranged.color });
        beep(300, 0.1, 'sine', 0.02);
      }
    }
    if (dist > z.r + p.r) {
      z.x += (dx / dist) * z.speed * z.slowMult * dt;
      z.y += (dy / dist) * z.speed * z.slowMult * dt;
    }
    if (dist < z.r + p.r && p.invuln <= 0) {
      p.hp -= z.dmg; p.invuln = 0.3; p.hurtFlash = 0.4;
      game.shake = Math.max(game.shake, 4);
      beep(80, 0.15, 'sawtooth', 0.05);
    }
  }

  for (let i = 0; i < game.zombies.length; i++) {
    for (let j = i + 1; j < game.zombies.length; j++) {
      const a = game.zombies[i], b = game.zombies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const minD = a.r + b.r;
      const d2 = dx*dx + dy*dy;
      if (d2 < minD * minD && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        const nx = dx/d, ny = dy/d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }

  if (game.boss) updateBoss(dt);

  for (let i = game.pickups.length - 1; i >= 0; i--) {
    const pk = game.pickups[i];
    pk.life -= dt;
    if (pk.life <= 0) { game.pickups.splice(i, 1); continue; }
    if (Math.hypot(p.x - pk.x, p.y - pk.y) < p.r + pk.r + 5) {
      if (pk.type === 'health') { p.hp = Math.min(p.maxHp, p.hp + 30); beep(800, 0.1, 'sine', 0.05); }
      else if (pk.type === 'grenade') { p.grenades++; beep(600, 0.1, 'square', 0.05); }
      else if (pk.type === 'ammo') {
        const cw = game.currentWeapon;
        if (cw !== 'pistol' && game.weaponAmmo[cw] !== -1) game.weaponAmmo[cw] += 30;
        else {
          const avail = Object.keys(WEAPONS).filter(w => w !== 'pistol' && game.weaponAmmo[w] > 0);
          if (avail.length > 0) game.weaponAmmo[avail[0]] += 30;
          else game.coins += 10;
        }
        beep(700, 0.1, 'square', 0.05);
      }
      game.pickups.splice(i, 1);
      updateHUD();
    }
  }

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    if (pt.type === 'laser') { pt.life -= dt; if (pt.life <= 0) game.particles.splice(i, 1); continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.92; pt.vy *= 0.92;
    pt.life -= dt;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }

  if (p.hp <= 0) { onDeath(); return; }

  if (game.waveActive) {
    game.waveTimer += dt;
    if (game.waveTimer > WAVE_TIMEOUT) {
      for (const z of game.zombies) {
        const a = Math.random() * Math.PI * 2;
        z.x = p.x + Math.cos(a) * 200;
        z.y = p.y + Math.sin(a) * 200;
      }
      game.waveTimer = 0;
    }
  }

  if (game.waveActive && !game.isBossWave) {
    if (game.spawnQueue.length === 0 && game.zombies.length === 0) { game.waveActive = false; onWaveComplete(); }
  }
  if (game.isBossWave && game.boss === null) { game.waveActive = false; game.isBossWave = false; onWaveComplete(); }
  updateHUD();
}

function updateBoss(dt) {
  const b = game.boss;
  const p = game.player;
  if (b.hitFlash > 0) b.hitFlash -= dt;
  const dx = p.x - b.x, dy = p.y - b.y;
  const dist = Math.hypot(dx, dy);
  b.angle = Math.atan2(dy, dx);
  b.stateTimer -= dt;
  b.slowMult = 1;
  for (const bar of game.barricades) {
    if (Math.hypot(bar.x - b.x, bar.y - b.y) < bar.r + b.r) {
      b.slowMult = 0.3;
      bar.hp -= b.dmg * dt * 3;
      if (bar.hp <= 0) {
        const idx = game.barricades.indexOf(bar);
        if (idx >= 0) game.barricades.splice(idx, 1);
      }
      break;
    }
  }
  // Телепорт если застрял далеко
  if (dist > 900) {
    b.x = p.x + (Math.random() - 0.5) * 400;
    b.y = p.y - 400;
  }
  if (b.state === 'chase') {
    b.x += (dx / dist) * b.speed * b.slowMult * dt;
    b.y += (dy / dist) * b.speed * b.slowMult * dt;
    if (dist < b.r + p.r + 10 && p.invuln <= 0) {
      p.hp -= b.dmg; p.invuln = 0.5; p.hurtFlash = 0.5; game.shake = Math.max(game.shake, 8);
    }
    if (b.stateTimer <= 0) { b.state = Math.random() < 0.5 ? 'summon' : 'charge'; b.stateTimer = 2.5; beep(120, 0.5, 'sawtooth', 0.08); }
  } else if (b.state === 'summon') {
    if (b.stateTimer <= 0.5) {
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = 120 + Math.random() * 80;
        spawnZombieAt(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, 'normal');
      }
      b.state = 'chase'; b.stateTimer = 3;
    }
  } else if (b.state === 'charge') {
    if (b.stateTimer <= 0.8) {
      b.x += Math.cos(b.angle) * b.speed * 6 * dt;
      b.y += Math.sin(b.angle) * b.speed * 6 * dt;
      if (dist < b.r + p.r && p.invuln <= 0) {
        p.hp -= b.dmg * 1.5; p.invuln = 1; p.hurtFlash = 0.8; game.shake = 15;
        b.state = 'chase'; b.stateTimer = 3;
      }
      // ВАЖНО: возврат из charge если не попал
      if (b.stateTimer <= -0.5) { b.state = 'chase'; b.stateTimer = 3; }
    }
  }
  if (b.hp <= 0) killBoss();
}

function killBoss() {
  const b = game.boss;
  game.coins += 100; game.crystals += 10; game.kills++;
  const cnt = Math.min(25, MAX_PARTICLES - game.particles.length);
  for (let i = 0; i < cnt; i++) {
    const a = Math.random() * Math.PI * 2; const s = rnd(100, 300);
    game.particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rnd(0.5,1), maxLife: 1, size: rnd(3,7), color: `hsl(${Math.random()*20}, 90%, ${30+Math.random()*30}%)` });
  }
  if (game.pickups.length < MAX_PICKUPS - 3) {
    game.pickups.push({ x: b.x, y: b.y, type: 'health', r: 12, life: 30 });
    game.pickups.push({ x: b.x + 30, y: b.y, type: 'ammo', r: 12, life: 30 });
    game.pickups.push({ x: b.x - 30, y: b.y, type: 'grenade', r: 12, life: 30 });
  }
  game.shake = 20;
  beep(80, 0.8, 'sawtooth', 0.15);
  game.boss = null;
}

function openShop() {
  game.shopUpgrades = [];
  const allWeapons = Object.keys(WEAPONS).filter(w => w !== 'pistol' && game.weaponAmmo[w] === 0);
  const shuffled = [...allWeapons].sort(() => Math.random() - 0.5);
  for (let i = 0; i < Math.min(3, shuffled.length); i++) {
    const wId = shuffled[i]; const w = WEAPONS[wId];
    game.shopUpgrades.push({ type: 'weapon', id: wId, name: `${w.icon} ${w.name}`, desc: `Урон ${w.dmg} · Магазин ${w.magazine}`, cost: w.cost, ammo: 360 });
  }
  const upgrades = [
    { type: 'upgrade', id: 'hp', name: '❤️ +15 Макс HP', desc: 'Увеличивает максимум HP', cost: 80 },
    { type: 'upgrade', id: 'damage', name: '💥 +10% Урон', desc: 'Больше урона', cost: 100 },
    { type: 'upgrade', id: 'speed', name: '👟 +8% Скорость', desc: 'Быстрее бегаешь', cost: 80 },
    { type: 'upgrade', id: 'grenades', name: '💣 +2 Гранаты', desc: 'Больше гранат', cost: 60 }

  screenInner.innerHTML = `

function buyShopItem(idx) {
  const item = game.shopUpgrades[idx];
  if (!item || game.coins < item.cost) return;
  game.coins -= item.cost;
  if (item.type === 'weapon') {
    game.weaponAmmo[item.id] = item.ammo;
    game.magAmmo[item.id] = WEAPONS[item.id].magazine;
    game.currentWeapon = item.id;
    game.reloading = false;
    beep(700, 0.1, 'square', 0.06);
  } else {
    const p = game.player;
    if (item.id === 'hp') { p.maxHp += 15; p.hp += 15; }
    else if (item.id === 'damage') { p.damageMult *= 1.1; }
    else if (item.id === 'speed') { p.speed *= 1.08; }
    else if (item.id === 'grenades') { p.grenades += 2; }
    beep(600, 0.1, 'sine', 0.06);
  }
  game.shopUpgrades.splice(idx, 1);
  renderShop();
  updateHUD();
}

function renderMeta(fromDeath) {
  screenEl.classList.add('active');
  screenInner.innerHTML = `
    <h1 class="title" style="color:#a855f7;">💎 МЕТА-ПРОГРЕСС</h1>
    <p class="subtitle">Кристаллов: ${meta.crystals} 💎</p>
    <div id="metaList"></div>
    <button class="btn-big gray" id="backBtn" style="margin-top:20px;">← НАЗАД</button>
  `;
  const list = document.getElementById('metaList');
  META_UPGRADES.forEach(u => {
    const lvl = meta.upgrades[u.id] || 0;
    const cost = (lvl + 1) * u.costPer;
    const canBuy = lvl < u.maxLvl && meta.crystals >= cost;
    const el = document.createElement('div');
    el.className = 'meta-item';
    el.innerHTML = `
      <div class="info">
        <div class="n">${u.name} <span style="color:#fbbf24;">(ур. ${lvl}/${u.maxLvl})</span></div>
        <div class="d">${u.desc}</div>
      </div>
      <button class="buy-btn" data-id="${u.id}" ${canBuy ? '' : 'disabled'}>${lvl >= u.maxLvl ? 'MAX' : `${cost} 💎`}</button>
    `;
    list.appendChild(el);
  });
  list.querySelectorAll('.buy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      buyMeta(id, fromDeath);
    });
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    if (fromDeath) onDeath(); else openMenu();
  });
}

function buyMeta(id, fromDeath) {
  const u = META_UPGRADES.find(x => x.id === id);
  const lvl = meta.upgrades[id] || 0;
  const cost = (lvl + 1) * u.costPer;
  if (lvl >= u.maxLvl || meta.crystals < cost) return;
  meta.crystals -= cost;
  meta.upgrades[id] = lvl + 1;
  saveMeta();
  beep(800, 0.15, 'sine', 0.06);
  renderMeta(fromDeath);
}

function pseudo(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

// УПРОЩЁННЫЙ ФОН (без циклов заполнения)
function drawFloor(cam) {
  const cfg = game.mapConfig || MAPS[0];
  ctx.fillStyle = cfg.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  // Простая сетка (только линии, не квадраты)
  const gs = 80;
  const startX = Math.floor((cam.x - W/2/cam.zoom - 100) / gs) * gs;
  const startY = Math.floor((cam.y - H/2/cam.zoom - 100) / gs) * gs;
  const endX = cam.x + W/2/cam.zoom + 100;
  const endY = cam.y + H/2/cam.zoom + 100;
  ctx.strokeStyle = cfg.floor === 'grass' ? 'rgba(34,139,34,0.08)' : 'rgba(100,150,210,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = startX; x < endX; x += gs) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
  for (let y = startY; y < endY; y += gs) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
  ctx.stroke();

  ctx.restore();
}

function drawObstacle(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(4, 6, o.size * 0.55, o.size * 0.35, 0, 0, Math.PI*2);
  ctx.fill();

  if (o.type === 'wall') {
    ctx.fillStyle = '#475569';
    ctx.fillRect(-o.size/2, -o.size/2, o.size, o.size);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
    ctx.strokeRect(-o.size/2, -o.size/2, o.size, o.size);
    const bw = o.size / 3, bh = o.size / 4;
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 3; j++) {
        const offX = (i % 2 === 0) ? 0 : bw / 2;
        const shade = 80 + (i+j)*15;
        ctx.fillStyle = `rgb(${shade}, ${shade+20}, ${shade+40})`;
        ctx.fillRect(-o.size/2 + j*bw + offX + 2, -o.size/2 + i*bh + 2, bw - 4, bh - 4);
      }
    }
  } else if (o.type === 'car') {
    ctx.fillStyle = '#1e40af';
    ctx.fillRect(-o.size*0.4, -o.size*0.3, o.size*0.8, o.size*0.6);
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
    ctx.strokeRect(-o.size*0.4, -o.size*0.3, o.size*0.8, o.size*0.6);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-o.size*0.2, -o.size*0.18, o.size*0.4, o.size*0.36);
    ctx.fillStyle = 'rgba(56,189,248,0.6)';
    ctx.fillRect(-o.size*0.18, -o.size*0.16, o.size*0.16, o.size*0.32);
    ctx.fillRect(o.size*0.02, -o.size*0.16, o.size*0.16, o.size*0.32);
    ctx.fillStyle = '#0a0e14';
    ctx.beginPath(); ctx.arc(-o.size*0.3, -o.size*0.35, o.size*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(o.size*0.3, -o.size*0.35, o.size*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-o.size*0.3, o.size*0.35, o.size*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(o.size*0.3, o.size*0.35, o.size*0.1, 0, Math.PI*2); ctx.fill();
  } else if (o.type === 'crate') {
    ctx.fillStyle = '#a16207';
    ctx.fillRect(-o.size/2, -o.size/2, o.size, o.size);
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 3;
    ctx.strokeRect(-o.size/2, -o.size/2, o.size, o.size);
    ctx.beginPath();
    ctx.moveTo(-o.size/2, -o.size/2); ctx.lineTo(o.size/2, o.size/2);
    ctx.moveTo(o.size/2, -o.size/2); ctx.lineTo(-o.size/2, o.size/2);
    ctx.stroke();
  } else if (o.type === 'tree') {
    ctx.fillStyle = '#78350f';
    ctx.fillRect(-6, 0, 12, o.size * 0.4);
    ctx.fillStyle = '#14532d';
    ctx.beginPath(); ctx.arc(0, -o.size*0.2, o.size*0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#16a34a';
    ctx.beginPath(); ctx.arc(-o.size*0.1, -o.size*0.3, o.size*0.35, 0, Math.PI*2); ctx.fill();
  } else if (o.type === 'rock') {
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.moveTo(-o.size*0.5, 0);
    ctx.lineTo(-o.size*0.3, -o.size*0.5);
    ctx.lineTo(o.size*0.2, -o.size*0.5);
    ctx.lineTo(o.size*0.5, o.size*0.2);
    ctx.lineTo(0, o.size*0.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.stroke();
  } else if (o.type === 'bush') {
    ctx.fillStyle = '#15803d';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + 0.3;
      ctx.beginPath(); ctx.arc(Math.cos(a) * o.size*0.2, Math.sin(a) * o.size*0.2, o.size*0.28, 0, Math.PI*2); ctx.fill();
    }
  } else if (o.type === 'barrel') {
    ctx.fillStyle = '#a16207';
    ctx.beginPath(); ctx.ellipse(0, 0, o.size*0.4, o.size*0.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-o.size*0.4, -o.size*0.15); ctx.lineTo(o.size*0.4, -o.size*0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-o.size*0.4, o.size*0.15); ctx.lineTo(o.size*0.4, o.size*0.15); ctx.stroke();
  }
  ctx.restore();
}

function drawBarricade(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(3, 5, b.r, b.r*0.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#78350f';
  ctx.fillRect(-b.r, -b.r, b.r*2, b.r*2);
  ctx.strokeStyle = '#451a03'; ctx.lineWidth = 3;
  ctx.strokeRect(-b.r, -b.r, b.r*2, b.r*2);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(-b.r, -b.r + (b.r*2/4) * i);
    ctx.lineTo(b.r, -b.r + (b.r*2/4) * i);
    ctx.stroke();
  }
  if (b.hp < b.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-b.r, -b.r - 8, b.r*2, 4);
    ctx.fillStyle = b.hp/b.maxHp > 0.5 ? '#22c55e' : b.hp/b.maxHp > 0.25 ? '#fbbf24' : '#ef4444';
    ctx.fillRect(-b.r, -b.r - 8, b.r*2 * (b.hp/b.maxHp), 4);
  }
  ctx.restore();
}

function drawMinimap() {
  miniCtx.clearRect(0, 0, 184, 184);
  miniCtx.fillStyle = 'rgba(2,6,23,0.9)';
  miniCtx.fillRect(0, 0, 184, 184);
  const scale = 184 / 3000;
  const toMapX = (x) => (x + 1500) * scale;
  const toMapY = (y) => (y + 1500) * scale;
  miniCtx.strokeStyle = 'rgba(56,189,248,0.5)';
  miniCtx.lineWidth = 2;
  miniCtx.strokeRect(1, 1, 182, 182);
  miniCtx.fillStyle = 'rgba(100,116,139,0.5)';
  for (const o of game.obstacles) {
    miniCtx.fillRect(toMapX(o.x - o.size/2), toMapY(o.y - o.size/2), o.size*scale, o.size*scale);
  }
  for (const pk of game.pickups) {
    if (pk.type === 'health') miniCtx.fillStyle = '#22c55e';
    else if (pk.type === 'grenade') miniCtx.fillStyle = '#84cc16';
    else miniCtx.fillStyle = '#fbbf24';
    miniCtx.fillRect(toMapX(pk.x)-1.5, toMapY(pk.y)-1.5, 3, 3);
  }
  for (const z of game.zombies) {
    miniCtx.fillStyle = z.slowMult < 1 ? '#fbbf24' : '#ef4444';
    miniCtx.fillRect(toMapX(z.x)-1.5, toMapY(z.y)-1.5, 3, 3);
  }
  if (game.boss) {
    miniCtx.fillStyle = '#fbbf24';
    miniCtx.beginPath();
    miniCtx.arc(toMapX(game.boss.x), toMapY(game.boss.y), 5, 0, Math.PI*2);
    miniCtx.fill();
  }
  if (game.player) {
    miniCtx.fillStyle = '#38bdf8';
    miniCtx.beginPath();
    miniCtx.arc(toMapX(game.player.x), toMapY(game.player.y), 4, 0, Math.PI*2);
    miniCtx.fill();
    miniCtx.strokeStyle = '#fff';
    miniCtx.lineWidth = 1.5;
    miniCtx.stroke();
  }
}

function drawPickup(pk) {
  const pulse = 1 + Math.sin(game.time * 6) * 0.12;
  const r = pk.r * pulse;
  if (pk.type === 'health') {
    ctx.fillStyle = 'rgba(34,197,94,0.2)';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, r*1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#22c55e';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#86efac'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(pk.x - 2, pk.y - 6, 4, 12);
    ctx.fillRect(pk.x - 6, pk.y - 2, 12, 4);
  } else if (pk.type === 'grenade') {
    ctx.fillStyle = 'rgba(132,204,22,0.2)';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, r*1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#84cc16';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#bef264'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💣', pk.x, pk.y);
  } else if (pk.type === 'ammo') {
    ctx.fillStyle = 'rgba(251,191,36,0.2)';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, r*1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#78350f';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('📦', pk.x, pk.y);
  }
}

function draw() {
  const cam = game.camera;
  drawFloor(cam);
  if (game.state === 'menu' || game.state === 'classSelect' || game.state === 'mapSelect') return;
  
  ctx.save();
  if (game.shake > 0.3) ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  for (const o of game.obstacles) drawObstacle(o);
  for (const b of game.barricades) drawBarricade(b);
  for (const pk of game.pickups) drawPickup(pk);

  // Частицы
  for (const pt of game.particles) {
    if (pt.type === 'laser') {
      const alpha = pt.life / pt.maxLife;
      ctx.strokeStyle = pt.color;
      ctx.globalAlpha = alpha * 0.3;
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(pt.x1, pt.y1); ctx.lineTo(pt.x2, pt.y2); ctx.stroke();
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(pt.x1, pt.y1); ctx.lineTo(pt.x2, pt.y2); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Зомби
  for (const z of game.zombies) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(z.x, z.y + z.r * 0.7, z.r * 0.9, z.r * 0.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = z.hitFlash > 0 ? '#fff' : z.color;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    if (z.slowMult < 1) {
      ctx.strokeStyle = 'rgba(56,189,248,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 4, 0, Math.PI*2); ctx.stroke();
    }
    ctx.save();
    ctx.translate(z.x, z.y); ctx.rotate(z.angle);
    ctx.fillStyle = '#1a0a0a';
    ctx.beginPath(); ctx.arc(z.r * 0.35, -z.r * 0.35, z.r * 0.18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(z.r * 0.35, z.r * 0.35, z.r * 0.18, 0, Math.PI*2); ctx.fill();
    if (z.armor) {
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, z.r * 0.85, 0, Math.PI*2); ctx.stroke();
    }
    if (z.onDeathExplode) {
      ctx.strokeStyle = `rgba(234,88,12,${0.5 + Math.sin(game.time*10)*0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, z.r + 4, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
    if (z.hp < z.maxHp) {
      const w = z.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(z.x - w/2, z.y - z.r - 8, w, 4);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(z.x - w/2, z.y - z.r - 8, w * (z.hp / z.maxHp), 4);
    }
  }

  // Босс
  if (game.boss) {
    const b = game.boss;
    if (b.state === 'charge' && b.stateTimer <= 0.8) {
      ctx.fillStyle = 'rgba(239,68,68,0.3)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(b.x, b.y + b.r * 0.7, b.r * 0.9, b.r * 0.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = b.hitFlash > 0 ? '#fff' : b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#450a0a'; ctx.lineWidth = 4; ctx.stroke();
    if (b.slowMult < 1) {
      ctx.strokeStyle = 'rgba(56,189,248,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 6, 0, Math.PI*2); ctx.stroke();
    }
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.angle);
    ctx.fillStyle = 'rgba(251,191,36,0.35)';
    ctx.beginPath(); ctx.arc(b.r * 0.4, -b.r * 0.3, b.r * 0.25, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.r * 0.4, b.r * 0.3, b.r * 0.25, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.arc(b.r * 0.4, -b.r * 0.3, b.r * 0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.r * 0.4, b.r * 0.3, b.r * 0.15, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Пули (без shadowBlur!)
  for (const b of game.bullets) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  }
  for (const b of game.enemyBullets) {
    ctx.fillStyle = b.color || '#84cc16';
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }

  // Игрок
  const p = game.player;
  if (p) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + p.r * 0.7, p.r * 0.9, p.r * 0.4, 0, 0, Math.PI*2); ctx.fill();
    
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.bodyAngle);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#bfdbfe'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(p.r * 0.6, 0);
    ctx.lineTo(p.r * 0.2, -p.r * 0.3);
    ctx.lineTo(p.r * 0.2, p.r * 0.3);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(p.r * 0.3, -4, p.r * 1.2, 8);
    ctx.fillStyle = '#475569';
    ctx.fillRect(p.r * 1.3, -3, 8, 6);
    ctx.restore();

    if (p.hurtFlash > 0) {
      ctx.fillStyle = `rgba(239,68,68,${p.hurtFlash * 0.6})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2); ctx.fill();
    }
  }

  // Ночь
  if (game.isNight && p) {
    const lightGrad = ctx.createRadialGradient(p.x, p.y, 80, p.x, p.y, 400);
    lightGrad.addColorStop(0, 'rgba(0,0,0,0)');
    lightGrad.addColorStop(1, 'rgba(0,0,0,0.88)');
    ctx.fillStyle = lightGrad;
    ctx.beginPath(); ctx.arc(p.x, p.y, 500, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  if (joystick.active) {
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.arc(joystick.bx, joystick.by, JOY_MAX, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(joystick.bx + joystick.dx*JOY_MAX, joystick.by + joystick.dy*JOY_MAX, 22, 0, Math.PI*2);
    ctx.fillStyle = '#38bdf8'; ctx.fill();
    ctx.restore();
  }

  drawMinimap();

  if (game.boss) {
    const pct = game.boss.hp / game.boss.maxHp;
    const barW = W * 0.7, barH = 14;
    const barX = (W - barW) / 2, barY = 80;
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(barX, barY, barW * pct, barH);
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👹 БОСС', W/2, barY - 6);
  }
}

function loop(now) {
  let dt = (now - game.lastTime) / 1000;
  game.lastTime = now;
  // Watchdog: если кадр занял > 100мс — обрезаем dt
  if (dt > 0.1) dt = 0.033;
  if (dt < 0) dt = 0;
  if (game.state === 'playing') {
    update(dt);
  }
  if (game.state !== 'menu' && game.state !== 'classSelect' && game.state !== 'mapSelect') {
    if (game.player) draw();
  } else {
    draw();
  }
  requestAnimationFrame(loop);
}

window.addEventListener('error', e => console.error('JS ERROR:', e.message, e.lineno));

game.lastTime = performance.now();
openMenu();
requestAnimationFrame(loop);
</script>
</body>
