<style>

  .btn-big.gray { background: linear-gradient(135deg,#475569,#334155); color: white; }
  .btn-big.green { background: linear-gradient(135deg,#22c55e,#15803d); color: white; }

  .meta-item .buy-btn:disabled { background: #475569; opacity: 0.6; }
  .hint { font-size: 12px; color: #64748b; margin-top: 15px; line-height: 1.8; text-align: left; padding-left: 8px; }
  .stat-line { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }

<script>
"use strict";

// Мини-карта fix
(function(){
  const fix = () => {
    const mc = document.getElementById('minimap');
    if (!mc) { setTimeout(fix, 50); return; }
    let w = document.getElementById('minimapWrap');
    if (!w) { w = document.createElement('div'); w.id = 'minimapWrap'; mc.parentNode.insertBefore(w, mc); w.appendChild(mc); }
    w.style.cssText = 'position:fixed!important;bottom:185px!important;right:12px!important;top:auto!important;left:auto!important;width:92px;height:92px;border:2px solid rgba(56,189,248,0.6);border-radius:10px;background:rgba(2,6,23,0.85);z-index:99999!important;pointer-events:none;overflow:hidden;';
    mc.style.cssText = 'width:100%!important;height:100%!important;display:block!important;position:static!important;image-rendering:pixelated;';
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
  window.addEventListener('load', fix);
})();

// === СПРАЙТЫ 64×64 ===
const SPRITES = {};
const NIGHT_MASK_SIZE = 1024;
let NIGHT_MASK = null;

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function P(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function C(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill(); }
function E(g, x, y, rx, ry, c) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); g.fill(); }
function TRI(g, x1, y1, x2, y2, x3, y3, c) { g.fillStyle = c; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineTo(x3,y3); g.closePath(); g.fill(); }

function makePlayerSprite64() {
  const S = 64;
  const c = makeCanvas(S, S);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  E(g, 32, 58, 18, 5, 'rgba(0,0,0,0.4)');
  P(g, 23, 42, 7, 14, '#1e3a8a');
  P(g, 34, 42, 7, 14, '#1e3a8a');
  P(g, 22, 54, 9, 6, '#0f172a');
  P(g, 33, 54, 9, 6, '#0f172a');
  P(g, 22, 56, 9, 1, '#334155');
  P(g, 33, 56, 9, 1, '#334155');
  const bodyGrad = g.createLinearGradient(20, 22, 20, 44);
  bodyGrad.addColorStop(0, '#60a5fa'); bodyGrad.addColorStop(0.5, '#3b82f6'); bodyGrad.addColorStop(1, '#1e40af');
  g.fillStyle = bodyGrad; g.fillRect(19, 22, 26, 22);
  P(g, 21, 24, 6, 3, 'rgba(147,197,253,0.6)');
  P(g, 21, 28, 3, 2, 'rgba(147,197,253,0.4)');
  P(g, 19, 38, 26, 4, '#111827');
  P(g, 29, 38, 6, 4, '#fbbf24');
  P(g, 30, 39, 4, 2, '#f59e0b');
  P(g, 21, 40, 2, 3, '#fcd34d');
  P(g, 24, 40, 2, 3, '#fcd34d');
  P(g, 38, 40, 2, 3, '#fcd34d');
  P(g, 41, 40, 2, 3, '#fcd34d');
  P(g, 14, 22, 6, 9, '#334155');
  P(g, 44, 22, 6, 9, '#334155');
  P(g, 15, 23, 4, 2, '#64748b');
  P(g, 45, 23, 4, 2, '#64748b');
  P(g, 12, 30, 5, 13, '#93c5fd');
  P(g, 47, 30, 5, 13, '#93c5fd');
  P(g, 11, 42, 7, 6, '#fde68a');
  P(g, 46, 42, 7, 6, '#fde68a');
  C(g, 32, 18, 11, '#475569');
  P(g, 21, 18, 22, 6, '#475569');
  P(g, 22, 19, 20, 2, '#64748b');
  P(g, 21, 22, 22, 1, '#1e293b');
  const visGrad = g.createLinearGradient(22, 19, 42, 24);
  visGrad.addColorStop(0, '#0ea5e9'); visGrad.addColorStop(1, '#0284c7');
  g.fillStyle = visGrad; g.fillRect(23, 19, 18, 4);
  P(g, 25, 20, 4, 1, 'rgba(255,255,255,0.7)');
  P(g, 34, 20, 3, 1, 'rgba(255,255,255,0.5)');
  P(g, 26, 23, 12, 3, '#fde68a');
  P(g, 30, 24, 4, 1, '#92400e');
  P(g, 50, 34, 12, 5, '#1f2937');
  P(g, 50, 35, 12, 1, '#374151');
  P(g, 60, 35, 4, 3, '#0f172a');
  P(g, 60, 35, 4, 1, '#475569');
  P(g, 53, 39, 5, 7, '#374151');
  P(g, 54, 40, 3, 5, '#1f2937');
  P(g, 54, 33, 2, 1, '#94a3b8');
  return c;
}

function makeZombieSprite64(bodyColor, darkColor, lightColor, eyeColor, hasArmor, hasSpikes, hasBelt) {
  const S = 64;
  const c = makeCanvas(S, S);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  E(g, 32, 58, 16, 5, 'rgba(0,0,0,0.35)');
  P(g, 24, 46, 6, 10, darkColor);
  P(g, 34, 46, 6, 10, darkColor);
  P(g, 23, 54, 8, 3, '#1a0a0a');
  P(g, 33, 54, 8, 3, '#1a0a0a');
  C(g, 32, 34, 16, bodyColor);
  C(g, 32, 38, 11, lightColor);
  E(g, 32, 44, 12, 4, darkColor);
  P(g, 22, 30, 3, 1, '#7f1d1d');
  P(g, 40, 34, 3, 1, '#7f1d1d');
  P(g, 26, 40, 2, 2, '#450a0a');
  P(g, 36, 42, 3, 1, '#450a0a');
  g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(20, 28); g.lineTo(24, 33); g.stroke();
  g.beginPath(); g.moveTo(42, 32); g.lineTo(38, 36); g.stroke();
  P(g, 13, 32, 5, 11, bodyColor);
  P(g, 46, 32, 5, 11, bodyColor);
  C(g, 15, 44, 3, darkColor);
  C(g, 49, 44, 3, darkColor);
  P(g, 13, 46, 1, 2, darkColor);
  P(g, 15, 47, 1, 2, darkColor);
  P(g, 17, 46, 1, 2, darkColor);
  P(g, 47, 46, 1, 2, darkColor);
  P(g, 49, 47, 1, 2, darkColor);
  P(g, 51, 46, 1, 2, darkColor);
  C(g, 32, 18, 10, bodyColor);
  E(g, 32, 24, 8, 2, darkColor);
  P(g, 25, 12, 3, 3, darkColor);
  P(g, 36, 11, 4, 3, darkColor);
  P(g, 29, 10, 3, 2, darkColor);
  P(g, 27, 16, 3, 3, '#000');
  P(g, 34, 16, 3, 3, '#000');
  P(g, 28, 17, 2, 2, eyeColor);
  P(g, 35, 17, 2, 2, eyeColor);
  P(g, 26, 14, 4, 1, darkColor);
  P(g, 34, 14, 4, 1, darkColor);
  P(g, 27, 22, 10, 2, '#1a0505');
  P(g, 28, 22, 1, 1, '#f8fafc');
  P(g, 31, 22, 1, 1, '#f8fafc');
  P(g, 34, 22, 1, 1, '#f8fafc');
  P(g, 37, 22, 1, 1, '#f8fafc');
  P(g, 29, 24, 1, 2, '#7f1d1d');
  P(g, 35, 24, 1, 1, '#7f1d1d');
  if (hasSpikes) {
    P(g, 18, 32, 3, 1, lightColor);
    P(g, 18, 34, 3, 1, lightColor);
    P(g, 43, 32, 3, 1, lightColor);
    P(g, 43, 34, 3, 1, lightColor);
    C(g, 16, 33, 2, lightColor);
    C(g, 48, 33, 2, lightColor);
    C(g, 32, 8, 2, lightColor);
  }
  if (hasArmor) {
    g.strokeStyle = '#94a3b8'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(32, 34, 15, 0, Math.PI*2); g.stroke();
    P(g, 20, 32, 4, 2, '#cbd5e1');
    P(g, 20, 36, 4, 2, '#cbd5e1');
    P(g, 40, 32, 4, 2, '#cbd5e1');
    P(g, 40, 36, 4, 2, '#cbd5e1');
    P(g, 21, 32, 1, 1, '#475569');
    P(g, 41, 32, 1, 1, '#475569');
  }
  if (hasBelt) {
    P(g, 22, 42, 20, 2, '#0f172a');
    P(g, 31, 42, 2, 2, '#fbbf24');
  }
  return c;
}

function makeBossSprite128() {
  const S = 128;
  const c = makeCanvas(S, S);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const cx = 64, cy = 66;
  E(g, cx, cy + 46, 42, 10, 'rgba(0,0,0,0.5)');
  P(g, 40, 96, 12, 20, '#450a0a');
  P(g, 76, 96, 12, 20, '#450a0a');
  P(g, 38, 114, 16, 6, '#1a0505');
  P(g, 74, 114, 16, 6, '#1a0505');
  const bodyGrad = g.createRadialGradient(50, 50, 10, cx, cy, 50);
  bodyGrad.addColorStop(0, '#dc2626'); bodyGrad.addColorStop(0.5, '#991b1b'); bodyGrad.addColorStop(1, '#450a0a');
  g.fillStyle = bodyGrad; g.beginPath(); g.arc(cx, cy, 44, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#1a0505'; g.lineWidth = 3;
  g.beginPath(); g.arc(cx, cy, 44, 0, Math.PI*2); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(40, 50); g.lineTo(42, 80); g.stroke();
  g.beginPath(); g.moveTo(88, 50); g.lineTo(86, 80); g.stroke();
  g.beginPath(); g.moveTo(cx, 30); g.lineTo(cx, 65); g.stroke();
  P(g, 18, 60, 12, 26, '#7f1d1d');
  P(g, 98, 60, 12, 26, '#7f1d1d');
  C(g, 24, 88, 8, '#991b1b');
  C(g, 104, 88, 8, '#991b1b');
  TRI(g, 16, 92, 20, 108, 24, 92, '#1a0505');
  TRI(g, 22, 94, 26, 110, 30, 94, '#1a0505');
  TRI(g, 98, 94, 102, 110, 106, 94, '#1a0505');
  TRI(g, 104, 92, 108, 108, 112, 92, '#1a0505');
  for (let i = 0; i < 5; i++) {
    const sx = 30 + i * 17;
    TRI(g, sx, 30, sx + 6, 12, sx + 12, 30, '#450a0a');
  }
  P(g, 42, 48, 18, 14, '#1a0505');
  P(g, 68, 48, 18, 14, '#1a0505');
  C(g, 51, 55, 6, '#fbbf24');
  C(g, 77, 55, 6, '#fbbf24');
  P(g, 48, 53, 4, 4, '#000');
  P(g, 74, 53, 4, 4, '#000');
  P(g, 49, 53, 2, 2, '#fef3c7');
  P(g, 75, 53, 2, 2, '#fef3c7');
  P(g, 40, 78, 48, 16, '#1a0505');
  for (let i = 0; i < 8; i++) TRI(g, 42 + i*6, 78, 45 + i*6, 88, 48 + i*6, 78, '#f8fafc');
  for (let i = 0; i < 8; i++) TRI(g, 43 + i*6, 94, 45 + i*6, 86, 47 + i*6, 94, '#f8fafc');
  P(g, 46, 94, 2, 4, '#7f1d1d');
  P(g, 80, 94, 2, 3, '#7f1d1d');
  return c;
}

function makeBulletSprite16(color) {
  const S = 16;
  const c = makeCanvas(S, S);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  C(g, 8, 8, 6, 'rgba(0,0,0,0.5)');
  C(g, 8, 8, 5, color);
  C(g, 6, 6, 2.5, '#ffffff');
  C(g, 6, 6, 1.5, 'rgba(255,255,255,0.9)');
  P(g, 2, 7, 3, 2, color);
  return c;
}

function makeTreeSprite64() {
  const S = 64;
  const c = makeCanvas(S, S);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  E(g, 32, 58, 20, 5, 'rgba(0,0,0,0.4)');
  P(g, 27, 32, 10, 30, '#78350f');
  P(g, 27, 32, 2, 30, '#451a03');
  P(g, 35, 32, 2, 30, '#451a03');
  for (let i = 0; i < 6; i++) {
    P(g, 29, 34 + i*5, 1, 3, '#451a03');
    P(g, 32, 36 + i*5, 1, 2, '#451a03');
    P(g, 34, 35 + i*5, 1, 3, '#451a03');
  }
  TRI(g, 22, 60, 27, 60, 30, 56, '#5a2d0c');
  TRI(g, 34, 56, 37, 60, 42, 60, '#5a2d0c');
  P(g, 20, 30, 8, 2, '#78350f');
  P(g, 37, 26, 8, 2, '#78350f');
  C(g, 22, 20, 12, '#14532d');
  C(g, 42, 18, 12, '#14532d');
  C(g, 32, 12, 14, '#14532d');
  C(g, 32, 28, 13, '#14532d');
  C(g, 20, 18, 10, '#166534');
  C(g, 44, 16, 10, '#166534');
  C(g, 32, 10, 12, '#166534');
  C(g, 30, 26, 10, '#166534');
  C(g, 18, 14, 6, '#16a34a');
  C(g, 32, 6, 7, '#16a34a');
  C(g, 44, 12, 6, '#16a34a');
  C(g, 28, 20, 5, '#22c55e');
  C(g, 16, 12, 3, '#4ade80');
  C(g, 30, 4, 3, '#4ade80');
  return c;
}

function makeCarSprite() {
  const W = 96, H = 64;
  const c = makeCanvas(W, H);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  E(g, 48, 56, 38, 6, 'rgba(0,0,0,0.5)');
  const bodyGrad = g.createLinearGradient(0, 20, 0, 48);
  bodyGrad.addColorStop(0, '#3b82f6'); bodyGrad.addColorStop(0.5, '#1e40af'); bodyGrad.addColorStop(1, '#1e3a8a');
  g.fillStyle = bodyGrad;
  g.beginPath();
  g.moveTo(8, 40); g.lineTo(12, 24); g.lineTo(24, 18); g.lineTo(72, 18); g.lineTo(84, 24); g.lineTo(88, 40); g.lineTo(88, 48); g.lineTo(8, 48); g.closePath();
  g.fill();
  g.strokeStyle = '#0f172a'; g.lineWidth = 2; g.stroke();
  P(g, 24, 22, 48, 16, '#0f172a');

let actx = null;
function initAudio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type='sine', vol=0.04) {
  if (!actx || actx.state !== 'running') return;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}

function createPlayer(className) {
  const cls = CLASSES.find(c => c.id === className) || CLASSES[0];
  const baseHp = 100 * cls.hpMult * (1 + meta.upgrades.hp * 0.1);
  return {
    x: 0, y: 0, r: 16, hp: baseHp, maxHp: baseHp,
    speed: 175 * cls.speedMult * (1 + meta.upgrades.speed * 0.05),
    bodyAngle: -Math.PI/2, angle: -Math.PI/2,
    fireCooldown: 0, hurtFlash: 0, invuln: 0,
    damageMult: cls.dmgMult * (1 + meta.upgrades.damage * 0.1),
    coinMult: 1 + meta.upgrades.coinDrop * 0.15,
    grenades: 3 + (className === 'engineer' ? 3 : 0) + meta.upgrades.startGrenades,
    barricades: className === 'engineer' ? 5 : 2,
    color: cls.color
  };
}

const joystick = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
const JOY_MAX = 55;
const keys = { w: false, a: false, s: false, d: false };

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (!joystick.active) { joystick.active = true; joystick.id = t.identifier; joystick.bx = t.clientX; joystick.by = t.clientY; joystick.dx = 0; joystick.dy = 0; }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      let dx = t.clientX - joystick.bx; let dy = t.clientY - joystick.by;
      const d = Math.hypot(dx, dy);
      if (d > JOY_MAX) { dx = dx/d * JOY_MAX; dy = dy/d * JOY_MAX; }
      joystick.dx = dx / JOY_MAX; joystick.dy = dy / JOY_MAX;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) { joystick.active = false; joystick.id = null; joystick.dx = 0; joystick.dy = 0; }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });
window.addEventListener('keydown', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

function rnd(min, max) { return min + Math.random() * (max - min); }

function updateHUD() {
  if (!game.player) return;
  const p = game.player;
  const pct = Math.max(0, p.hp / p.maxHp * 100);
  hpBar.style.width = pct + '%';
  hpText.textContent = `${Math.max(0, Math.ceil(p.hp))} / ${Math.ceil(p.maxHp)}`;
  waveInfo.textContent = game.isBossWave ? '👹 БОСС' : `Волна ${game.wave}`;
  coinsEl.textContent = game.coins;
  crystalsEl.textContent = game.crystals;
  const w = WEAPONS[game.currentWeapon];
  const reserve = game.weaponAmmo[game.currentWeapon];
  const mag = game.magAmmo[game.currentWeapon];
  if (game.reloading) {
    weaponInfo.innerHTML = `${w.icon} ${w.name} · <span class="mag">ПЕРЕЗАРЯДКА</span>`;
    weaponInfo.classList.add('reloading');
  } else {
    weaponInfo.classList.remove('reloading');
    if (reserve === -1) weaponInfo.innerHTML = `${w.icon} ${w.name} · <span class="mag">∞</span>`;
    else weaponInfo.innerHTML = `${w.icon} ${w.name} · <span class="mag">${mag}</span> / <span class="reserve">${reserve}</span>`;
  }
  grenadeCount.textContent = p.grenades;
  barricadeCount.textContent = p.barricades;
  grenadeBtn.disabled = p.grenades <= 0;
  barricadeBtn.disabled = p.barricades <= 0;
  reloadBtn.disabled = game.reloading || reserve === -1 || mag >= w.magazine || reserve <= 0;
}

function startReload() {
  const w = WEAPONS[game.currentWeapon];
  const reserve = game.weaponAmmo[game.currentWeapon];
  const mag = game.magAmmo[game.currentWeapon];
  if (game.reloading || reserve === -1 || mag >= w.magazine || reserve <= 0) return;
  game.reloading = true;
  game.reloadTimer = w.reloadTime;
  beep(400, 0.15, 'square', 0.05);
  updateHUD();
}

function finishReload() {
  const w = WEAPONS[game.currentWeapon];
  const reserve = game.weaponAmmo[game.currentWeapon];
  const mag = game.magAmmo[game.currentWeapon];
  const needed = w.magazine - mag;
  const available = Math.min(needed, reserve);
  game.magAmmo[game.currentWeapon] += available;
  game.weaponAmmo[game.currentWeapon] -= available;
  game.reloading = false;
  game.reloadTimer = 0;
  beep(700, 0.15, 'sine', 0.06);
  updateHUD();
}

function startGame() {
  initAudio();
  game.state = 'playing';
  game.wave = 0; game.kills = 0;
  game.coins = meta.upgrades.startCoins > 0 ? meta.upgrades.startCoins * 50 : 0;
  game.crystals = 0;
  game.zombies = []; game.bullets = []; game.enemyBullets = [];
  game.particles = []; game.pickups = []; game.barricades = [];
  game.spawnQueue = []; game.spawnTimer = 0;
  game.waveActive = false; game.waveTimer = 0; game.isNight = false;
  game.boss = null; game.isBossWave = false;
  game.time = 0; game.shake = 0;
  game.reloading = false; game.reloadTimer = 0;
  game.mapConfig = MAPS.find(m => m.id === game.selectedMap) || MAPS[0];
  generateObstacles(game.mapConfig);
  game.player = createPlayer(game.selectedClass);
  game.player.x = 0; game.player.y = 0;
  const sw = CLASSES.find(c => c.id === game.selectedClass).startWeapon;
  game.currentWeapon = sw;
  game.weaponAmmo = { pistol: -1, shotgun: 0, smg: 0, rifle: 0, laser: 0, grenadeLauncher: 0 };
  game.magAmmo = { pistol: 12, shotgun: 0, smg: 0, rifle: 0, laser: 0, grenadeLauncher: 0 };
  if (sw !== 'pistol') { game.weaponAmmo[sw] = 360; game.magAmmo[sw] = WEAPONS[sw].magazine; }
  game.camera.x = 0; game.camera.y = 0;
  screenEl.classList.remove('active');
  updateHUD();
  setTimeout(() => { if (game.state === 'playing') startWave(); }, 1000);
}

function continueGame(save) {
  initAudio();
  game.state = 'playing';
  game.wave = save.wave; game.kills = save.kills;
  game.coins = save.coins; game.crystals = save.crystals;
  game.zombies = []; game.bullets = []; game.enemyBullets = [];
  game.particles = []; game.pickups = []; game.barricades = [];
  game.spawnQueue = []; game.spawnTimer = 0;
  game.waveActive = false; game.waveTimer = 0;
  game.isNight = save.wave >= 3;
  game.boss = null; game.isBossWave = false;
  game.time = 0; game.shake = 0;
  game.reloading = false; game.reloadTimer = 0;
  game.selectedClass = save.selectedClass;
  game.selectedMap = save.selectedMap;
  game.currentWeapon = save.currentWeapon;
  game.weaponAmmo = {...save.weaponAmmo};
  game.magAmmo = save.magAmmo ? {...save.magAmmo} : { pistol: 12, shotgun: 0, smg: 0, rifle: 0, laser: 0, grenadeLauncher: 0 };
  game.mapConfig = MAPS.find(m => m.id === game.selectedMap) || MAPS[0];
  generateObstacles(game.mapConfig);
  game.player = createPlayer(game.selectedClass);
  game.player.x = 0; game.player.y = 0;
  game.player.hp = save.playerHP;
  game.player.maxHp = save.playerMaxHP;
  game.player.grenades = save.grenades;
  game.player.barricades = save.barricades;
  if (save.damageMult) game.player.damageMult = save.damageMult;
  if (save.coinMult) game.player.coinMult = save.coinMult;
  game.camera.x = 0; game.camera.y = 0;
  screenEl.classList.remove('active');
  updateHUD();
  setTimeout(() => { if (game.state === 'playing') startWave(); }, 1000);
}

function generateObstacles(cfg) {
  game.obstacles = [];
  const count = cfg.obstacleCount;
  const minDist = 140;
  const minFromCenter = 180;
  let tries = 0;
  while (game.obstacles.length < count && tries < count * 30) {
    tries++;
    const angle = Math.random() * Math.PI * 2;
    const dist = minFromCenter + Math.random() * (MAP_RADIUS - minFromCenter - 100);
    const x = Math.cos(angle) * dist;
    const y = Math.sin(angle) * dist;
    let ok = true;
    for (const o of game.obstacles) {
      if (Math.hypot(o.x - x, o.y - y) < minDist) { ok = false; break; }
    }
    if (!ok) continue;
    const type = cfg.obstacleTypes[Math.floor(Math.random() * cfg.obstacleTypes.length)];
    let size = 60;
    if (type === 'car') size = rnd(85, 110);
    else if (type === 'tree') size = rnd(70, 90);
    else if (type === 'crate') size = rnd(55, 70);
    else if (type === 'barrel') size = rnd(45, 60);
    else if (type === 'rock') size = rnd(55, 75);
    else if (type === 'bush') size = rnd(50, 65);
    game.obstacles.push({ x, y, size, type });
  }
}

function tryMove(entity, targetX, targetY, dt) {
  const dx = targetX - entity.x;
  const dy = targetY - entity.y;
  const dist = Math.hypot(dx, dy) || 1;
  const nx = dx / dist;
  const ny = dy / dist;
  const speed = entity.speed * (entity.slowMult || 1);
  const step = speed * dt;
  let newX = entity.x + nx * step;
  let newY = entity.y + ny * step;
  let blocked = false;
  for (const o of game.obstacles) {
    const r = o.size / 2 + entity.r;
    if (Math.hypot(newX - o.x, newY - o.y) < r) { blocked = true; break; }
  }
  if (!blocked && entity.isZombie) {
    for (const other of game.zombies) {
      if (other === entity) continue;
      if (Math.hypot(newX - other.x, newY - other.y) < entity.r + other.r - 4) { blocked = true; break; }
    }
  }
  if (!blocked) return { x: newX, y: newY, blocked: false };
  const baseAngle = Math.atan2(ny, nx);
  const tries = [Math.PI/2, -Math.PI/2, Math.PI*0.75, -Math.PI*0.75, Math.PI*0.4, -Math.PI*0.4];
  let bestMove = null;
  let bestDist = dist;
  for (const offset of tries) {
    const testAngle = baseAngle + offset;
    const tx = entity.x + Math.cos(testAngle) * step;
    const ty = entity.y + Math.sin(testAngle) * step;
    let free = true;
    for (const o of game.obstacles) {
      const r = o.size / 2 + entity.r;
      if (Math.hypot(tx - o.x, ty - o.y) < r) { free = false; break; }
    }
    if (free && entity.isZombie) {
      for (const other of game.zombies) {
        if (other === entity) continue;
        if (Math.hypot(tx - other.x, ty - other.y) < entity.r + other.r - 4) { free = false; break; }
      }
    }
    if (free) {
      const nd = Math.hypot(targetX - tx, targetY - ty);
      if (nd < bestDist) { bestDist = nd; bestMove = { x: tx, y: ty }; }
    }
  }
  if (bestMove) return { x: bestMove.x, y: bestMove.y, blocked: false };
  return { x: entity.x, y: entity.y, blocked: true };
}

function startWave() {
  game.wave++;
  game.waveActive = true;
  game.waveTimer = 0;
  game.isBossWave = (game.wave % 5 === 0);
  game.isNight = game.wave >= 3;
  if (game.isBossWave) { spawnBoss(); game.spawnQueue = []; }
  else {
    const count = Math.min(18, 5 + Math.floor(game.wave * 1.8));
    game.spawnQueue = [];
    for (let i = 0; i < count; i++) game.spawnQueue.push(pickZombieType(game.wave));
    game.spawnTimer = 0;
  }
  updateHUD();
}

function pickZombieType(wave) {
  const r = Math.random();
  if (wave < 2) return 'normal';
  if (wave < 3) return r < 0.6 ? 'normal' : 'fast';
  if (wave < 5) {
    if (r < 0.35) return 'normal';
    if (r < 0.6) return 'fast';
    if (r < 0.75) return 'explosive';
    if (r < 0.85) return 'spitter';
    return 'tank';
  }
  if (r < 0.25) return 'normal';
  if (r < 0.45) return 'fast';
  if (r < 0.58) return 'explosive';
  if (r < 0.7) return 'spitter';
  if (r < 0.82) return 'tank';
  if (r < 0.92) return 'armored';
  return 'invisible';
}

function findSpawnPoint(angle, dist) {
  for (let t = 0; t < 20; t++) {
    const a = angle + (Math.random() - 0.5) * 0.3;
    const d = dist + (Math.random() - 0.5) * 50;
    const x = game.player.x + Math.cos(a) * d;
    const y = game.player.y + Math.sin(a) * d;
    let ok = true;
    for (const o of game.obstacles) {
      if (Math.hypot(x - o.x, y - o.y) < o.size / 2 + 20) { ok = false; break; }
    }
    if (ok && Math.hypot(x, y) < MAP_RADIUS - 30) return { x, y };
  }
  return { x: game.player.x + Math.cos(angle) * dist, y: game.player.y + Math.sin(angle) * dist };
}

function spawnZombie(type) {
  if (game.zombies.length >= MAX_ZOMBIES) return;
  const cfg = Z_TYPES[type];
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.min(MAP_RADIUS - 50, Math.max(W, H) * 0.4 + rnd(0, 100));
  const pt = findSpawnPoint(angle, dist);
  const hpScale = 1 + (game.wave - 1) * 0.15;
  const speedScale = 1 + (game.wave - 1) * 0.03;
  game.zombies.push({
    x: pt.x, y: pt.y, r: cfg.r,
    hp: cfg.hp * hpScale, maxHp: cfg.hp * hpScale,
    speed: cfg.speed * speedScale, dmg: cfg.dmg, color: cfg.color, type,
    coinMin: cfg.coinMin || 1, coinMax: cfg.coinMax || 3,
    onDeathExplode: cfg.onDeathExplode, ranged: cfg.ranged,
    rangedCooldown: 0, invisibilityRange: cfg.invisibilityRange,
    armor: cfg.armor || 0, angle: 0, hitFlash: 0, slowMult: 1, _exploding: false,
    isZombie: true
  });
}

function spawnBoss() {
  const waveHp = 500 + game.wave * 250;
  game.boss = {
    x: game.player.x, y: game.player.y - Math.min(MAP_RADIUS - 100, 400),
    r: 50, hp: waveHp, maxHp: waveHp,
    speed: 45, dmg: 18,
    state: 'chase', stateTimer: 2.5, angle: 0,
    hitFlash: 0, color: '#7f1d1d', slowMult: 1,
    chargeAngle: 0
  };
  beep(80, 0.6, 'sawtooth', 0.15);
}

function maxRangeFor(mult) { return Math.max(W, H) * mult; }

function nearestTarget(x, y, rangeMult) {
  let best = null, bestD = Infinity;
  const maxRange = Math.max(W, H) * 0.6 * rangeMult;
  for (const z of game.zombies) {
    const d = Math.hypot(z.x - x, z.y - y);
    if (d < bestD && d < maxRange) { bestD = d; best = z; }
  }
  if (game.boss) {
    const d = Math.hypot(game.boss.x - x, game.boss.y - y);
    if (d < bestD && d < maxRange) { bestD = d; best = game.boss; }
  }
  return best;
}

function playerShoot() {
  if (game.reloading) return;
  const p = game.player;
  const w = WEAPONS[game.currentWeapon];
  if (p.fireCooldown > 0) return;
  if (game.magAmmo[game.currentWeapon] <= 0) {
    if (game.weaponAmmo[game.currentWeapon] === -1) game.magAmmo[game.currentWeapon] = w.magazine;
    else if (game.weaponAmmo[game.currentWeapon] > 0) { startReload(); return; }
    else { game.currentWeapon = 'pistol'; updateHUD(); return; }
  }
  const target = nearestTarget(p.x, p.y, w.range);
  if (!target) return;
  p.angle = Math.atan2(target.y - p.y, target.x - p.x);
  p.fireCooldown = 1 / w.fireRate;
  if (w.isLaser) fireLaser(p, w);
  else {
    for (let i = 0; i < w.count; i++) {
      if (game.bullets.length >= MAX_BULLETS) break;
      const sa = p.angle + (Math.random() - 0.5) * w.spread;
      game.bullets.push({
        x: p.x + Math.cos(p.angle) * (p.r + 8), y: p.y + Math.sin(p.angle) * (p.r + 8),
        vx: Math.cos(sa) * w.speed, vy: Math.sin(sa) * w.speed,
        r: w.isExplosive ? 6 : 4, dmg: w.dmg * p.damageMult,
        pierce: w.pierce, hits: [], color: w.color, sprite: w.sprite,
        isExplosive: w.isExplosive, range: maxRangeFor(w.range), traveled: 0
      });
    }
  }
  game.magAmmo[game.currentWeapon]--;
  beep(w.isExplosive ? 200 : 300 + Math.random() * 60, 0.04, 'square', 0.02);
  updateHUD();
}

function fireLaser(p, w) {
  const bl = maxRangeFor(w.range);
  const nx = Math.cos(p.angle), ny = Math.sin(p.angle);
  let closestHit = Infinity;
  const hits = [];
  const all = [...game.zombies];
  if (game.boss) all.push(game.boss);
  for (const z of all) {
    const zx = z.x - p.x, zy = z.y - p.y;
    const proj = zx * nx + zy * ny;
    if (proj < 0 || proj > bl) continue;
    const perp = Math.abs(zx * ny - zy * nx);
    if (perp < z.r + 5) { hits.push(z); if (proj < closestHit) closestHit = proj; }
  }
  for (const z of hits) if (game.zombies.includes(z) || z === game.boss) damageEnemy(z, w.dmg * p.damageMult);
  if (game.particles.length < MAX_PARTICLES) {
    game.particles.push({ type: 'laser', x1: p.x, y1: p.y, x2: p.x + nx * Math.min(closestHit + 50, bl), y2: p.y + ny * Math.min(closestHit + 50, bl), life: 0.12, maxLife: 0.12, color: w.color });
  }
}

function throwGrenade() {
  const p = game.player;
  if (p.grenades <= 0) return;
  p.grenades--;
  if (game.bullets.length < MAX_BULLETS) {
    game.bullets.push({ x: p.x, y: p.y, vx: Math.cos(p.bodyAngle) * 400, vy: Math.sin(p.bodyAngle) * 400, r: 8, dmg: 60, pierce: 0, hits: [], color: '#84cc16', sprite: 'bullet_green', isExplosive: true, isGrenade: true, life: 1.2, range: 400, traveled: 0 });
  }
  beep(500, 0.1, 'triangle', 0.06);
  updateHUD();
}

function placeBarricade() {
  const p = game.player;
  if (p.barricades <= 0) return;
  p.barricades--;
  game.barricades.push({ x: p.x + Math.cos(p.bodyAngle) * 60, y: p.y + Math.sin(p.bodyAngle) * 60, r: 28, hp: 80, maxHp: 80 });
  beep(400, 0.1, 'square', 0.05);
  updateHUD();
}

function damageEnemy(z, dmg) {
  let finalDmg = dmg;
  if (z.armor) finalDmg *= (1 - z.armor);
  if (z === game.boss && z.state === 'recover') finalDmg *= 2;
  z.hp -= finalDmg;
  z.hitFlash = 0.12;
  if (z.hp <= 0) killEnemy(z);
}

function killEnemy(z) {
  if (z.onDeathExplode && !z._exploding) {
    z._exploding = true;
    explodeAt(z.x, z.y, z.onDeathExplode.radius, z.onDeathExplode.dmg);
  }
  if (z.type) {
    const coins = Math.floor(rnd(z.coinMin || 1, z.coinMax || 3));
    game.coins += Math.floor(coins * game.player.coinMult);
    game.kills++;
    game.crystals += 0.1;
  }
  if (game.pickups.length < MAX_PICKUPS) {
    const roll = Math.random();
    if (roll < 0.08) game.pickups.push({ x: z.x, y: z.y, type: 'health', r: 14, life: 15 });
    else if (roll < 0.16) game.pickups.push({ x: z.x, y: z.y, type: 'grenade', r: 14, life: 15 });
    else if (roll < 0.28) game.pickups.push({ x: z.x, y: z.y, type: 'ammo', r: 14, life: 18 });
  }
  const idx = game.zombies.indexOf(z);
  if (idx >= 0) game.zombies.splice(idx, 1);
  spawnBlood(z.x, z.y, 5);
  beep(120, 0.08, 'sawtooth', 0.03);
}

function explodeAt(x, y, radius, dmg) {
  game.shake = Math.max(game.shake, 4);
  const toDamage = [];
  for (const z of game.zombies) {
    if (Math.hypot(z.x - x, z.y - y) < radius + z.r) toDamage.push(z);
  }
  for (const z of toDamage) {
    if (game.zombies.includes(z)) damageEnemy(z, dmg);
  }
  if (game.boss && Math.hypot(game.boss.x - x, game.boss.y - y) < radius + game.boss.r) {
    damageEnemy(game.boss, dmg);
  }
  const cnt = Math.min(8, MAX_PARTICLES - game.particles.length);
  for (let i = 0; i < cnt; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rnd(50, 180);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4, maxLife: 0.4, size: rnd(2, 5), color: `hsl(${30 + Math.random()*20}, 90%, 55%)` });
  }
  beep(80, 0.3, 'sawtooth', 0.08);
}

function spawnBlood(x, y, count) {
  const actual = Math.min(count, MAX_PARTICLES - game.particles.length);
  for (let i = 0; i < actual; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rnd(40, 100);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.6), maxLife: 0.6, size: rnd(2, 4), color: `hsl(${348 + Math.random()*16}, 82%, ${32 + Math.random()*22}%)` });
  }
}
function update(dt) {
  if (game.state !== 'playing') return;
  game.time += dt;
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 30);
  const p = game.player;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.hurtFlash > 0) p.hurtFlash -= dt;
  if (p.fireCooldown > 0) p.fireCooldown -= dt;

  if (game.reloading) {
    game.reloadTimer -= dt;
    if (game.reloadTimer <= 0) finishReload();
  }

  let mx = 0, my = 0;
  if (joystick.active) { mx = joystick.dx; my = joystick.dy; }
  if (keys.w) my -= 1; if (keys.s) my += 1;
  if (keys.a) mx -= 1; if (keys.d) mx += 1;
  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }
  if (mag > 0.05) {
    const move = tryMove({ ...p, speed: p.speed, slowMult: 1 }, p.x + mx * 10, p.y + my * 10, dt);
    if (!move.blocked) { p.x = move.x; p.y = move.y; }
    p.bodyAngle = Math.atan2(my, mx);
  }

  const d = Math.hypot(p.x, p.y);
  if (d > MAP_RADIUS) { p.x = (p.x / d) * MAP_RADIUS; p.y = (p.y / d) * MAP_RADIUS; }

  game.camera.x = p.x; game.camera.y = p.y;
  playerShoot();

  if (game.spawnQueue.length > 0) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      game.spawnTimer = Math.max(0.2, 0.7 - game.wave * 0.02);
      spawnZombie(game.spawnQueue.shift());
    }
  }

  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.traveled += Math.hypot(b.vx, b.vy) * dt;
    if (b.life !== undefined) {
      b.life -= dt;
      if (b.life <= 0) { if (b.isGrenade) explodeAt(b.x, b.y, 100, b.dmg); game.bullets.splice(i, 1); continue; }
    }
    if (b.traveled > b.range) { game.bullets.splice(i, 1); continue; }
    let blocked = false;
    for (const o of game.obstacles) {
      if (Math.hypot(b.x - o.x, b.y - o.y) < o.size / 2) { blocked = true; break; }
    }
    if (blocked) {
      if (b.isGrenade) explodeAt(b.x, b.y, 100, b.dmg);
      game.bullets.splice(i, 1);
      continue;
    }
    let hit = false;
    for (let j = game.zombies.length - 1; j >= 0; j--) {
      const z = game.zombies[j];
      if (b.hits.includes(z)) continue;
      if (Math.hypot(z.x - b.x, z.y - b.y) < z.r + b.r) {
        damageEnemy(z, b.dmg); b.hits.push(z);
        if (b.isExplosive) { explodeAt(b.x, b.y, 80, b.dmg); game.bullets.splice(i, 1); hit = true; break; }
        if (b.pierce > 0) { b.pierce--; b.dmg *= 0.85; } else { game.bullets.splice(i, 1); hit = true; break; }
      }
    }
    if (hit) continue;
    if (game.boss && !b.hits.includes(game.boss)) {
      if (Math.hypot(game.boss.x - b.x, game.boss.y - b.y) < game.boss.r + b.r) {
        damageEnemy(game.boss, b.dmg); b.hits.push(game.boss);
        if (b.isExplosive) { explodeAt(b.x, b.y, 90, b.dmg); game.bullets.splice(i, 1); continue; }
        if (b.pierce > 0) b.pierce--; else { game.bullets.splice(i, 1); continue; }
      }
    }
  }

  for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
    const b = game.enemyBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.life !== undefined) { b.life -= dt; if (b.life <= 0) { game.enemyBullets.splice(i, 1); continue; } }
    if (Math.hypot(b.x - p.x, b.y - p.y) < p.r + 5) {
      if (p.invuln <= 0) { p.hp -= b.dmg; p.invuln = 0.5; p.hurtFlash = 0.4; game.shake = Math.max(game.shake, 4); beep(150, 0.1, 'sawtooth', 0.05); }
      game.enemyBullets.splice(i, 1);
    }
  }

  for (let i = game.zombies.length - 1; i >= 0; i--) {
    const z = game.zombies[i];
    if (Math.hypot(z.x - p.x, z.y - p.y) > MAX_ZOMBIE_DIST) { game.zombies.splice(i, 1); continue; }
    if (z.hitFlash > 0) z.hitFlash -= dt;
    z.slowMult = 1;
    for (let k = game.barricades.length - 1; k >= 0; k--) {
      const bar = game.barricades[k];
      if (Math.hypot(bar.x - z.x, bar.y - z.y) < bar.r + z.r) {
        z.slowMult = 0.2;
        bar.hp -= z.dmg * dt * 2;
        if (bar.hp <= 0) { game.barricades.splice(k, 1); beep(200, 0.2, 'sawtooth', 0.05); }
        break;
      }
    }
    const dx = p.x - z.x, dy = p.y - z.y;
    const dist = Math.hypot(dx, dy) || 1;
    z.angle = Math.atan2(dy, dx);
    if (z.ranged) {
      z.rangedCooldown -= dt;
      if (z.rangedCooldown <= 0 && dist < 400 && game.enemyBullets.length < MAX_ENEMY_BULLETS) {
        z.rangedCooldown = z.ranged.rate;
        game.enemyBullets.push({ x: z.x, y: z.y, vx: Math.cos(z.angle) * z.ranged.speed, vy: Math.sin(z.angle) * z.ranged.speed, dmg: z.ranged.dmg, life: 2, color: z.ranged.color });
      }
    }
    if (dist > z.r + p.r) {
      const move = tryMove(z, p.x, p.y, dt);
      if (!move.blocked) { z.x = move.x; z.y = move.y; }
    }
    if (dist < z.r + p.r && p.invuln <= 0) {
      p.hp -= z.dmg; p.invuln = 0.3; p.hurtFlash = 0.4;
      game.shake = Math.max(game.shake, 4);
      beep(80, 0.15, 'sawtooth', 0.05);
    }
  }

  if (game.boss) updateBoss(dt);

  for (let i = game.pickups.length - 1; i >= 0; i--) {
    const pk = game.pickups[i];
    pk.life -= dt;
    if (pk.life <= 0) { game.pickups.splice(i, 1); continue; }
    if (Math.hypot(p.x - pk.x, p.y - pk.y) < p.r + pk.r + 5) {
      if (pk.type === 'health') { p.hp = Math.min(p.maxHp, p.hp + 30); beep(800, 0.1, 'sine', 0.05); }
      else if (pk.type === 'grenade') { p.grenades++; beep(600, 0.1, 'square', 0.05); }
      else if (pk.type === 'ammo') {
        const cw = game.currentWeapon;
        if (cw !== 'pistol' && game.weaponAmmo[cw] !== -1) game.weaponAmmo[cw] += 30;
        else {
          const av = Object.keys(WEAPONS).filter(w => w !== 'pistol' && game.weaponAmmo[w] > 0);
          if (av.length > 0) game.weaponAmmo[av[0]] += 30;
          else game.coins += 10;
        }
        beep(700, 0.1, 'square', 0.05);
      }
      game.pickups.splice(i, 1);
      updateHUD();
    }
  }

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    if (pt.type === 'laser') { pt.life -= dt; if (pt.life <= 0) game.particles.splice(i, 1); continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.92; pt.vy *= 0.92;
    pt.life -= dt;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }

  if (p.hp <= 0) { onDeath(); return; }

  if (game.waveActive) {
    game.waveTimer += dt;
    if (game.waveTimer > WAVE_TIMEOUT) {
      for (const z of game.zombies) {
        const pt = findSpawnPoint(Math.random() * Math.PI * 2, 200);
        z.x = pt.x; z.y = pt.y;
      }
      game.waveTimer = 0;
    }
  }

  if (game.waveActive && !game.isBossWave) {
    if (game.spawnQueue.length === 0 && game.zombies.length === 0) { game.waveActive = false; onWaveComplete(); }
  }
  if (game.isBossWave && game.boss === null) { game.waveActive = false; game.isBossWave = false; onWaveComplete(); }
  updateHUD();
}

function updateBoss(dt) {
  const b = game.boss;
  const p = game.player;
  if (b.hitFlash > 0) b.hitFlash -= dt;
  const dx = p.x - b.x, dy = p.y - b.y;
  const dist = Math.hypot(dx, dy) || 1;
  b.stateTimer -= dt;
  b.slowMult = 1;

  for (const bar of game.barricades) {
    if (Math.hypot(bar.x - b.x, bar.y - b.y) < bar.r + b.r) {
      b.slowMult = 0.3;
      bar.hp -= b.dmg * dt * 3;
      if (bar.hp <= 0) { const idx = game.barricades.indexOf(bar); if (idx >= 0) game.barricades.splice(idx, 1); }
      break;
    }
  }

  if (b.state === 'chase') {
    b.angle = Math.atan2(dy, dx);
    let newX = b.x + (dx / dist) * b.speed * b.slowMult * dt;
    let newY = b.y + (dy / dist) * b.speed * b.slowMult * dt;
    for (const o of game.obstacles) {
      if (Math.hypot(newX - o.x, newY - o.y) < o.size / 2 + b.r) {
        const idx = game.obstacles.indexOf(o);
        if (idx >= 0) {
          game.obstacles.splice(idx, 1);
          beep(150, 0.2, 'sawtooth', 0.08);
          game.shake = Math.max(game.shake, 6);
        }
      }
    }
    b.x = newX; b.y = newY;
    if (dist < b.r + p.r && p.invuln <= 0) {
      p.hp -= b.dmg; p.invuln = 0.6; p.hurtFlash = 0.4;
      game.shake = Math.max(game.shake, 6);
    }
    if (b.stateTimer <= 0) { b.state = 'windup'; b.stateTimer = 1.2; beep(200, 0.4, 'sawtooth', 0.06); }
  }
  else if (b.state === 'windup') {
    b.angle = Math.atan2(dy, dx);
    b.x += (Math.random() - 0.5) * 1.5;
    b.y += (Math.random() - 0.5) * 1.5;
    if (b.stateTimer <= 0) { b.chargeAngle = b.angle; b.state = 'charge'; b.stateTimer = 1.5; beep(300, 0.15, 'square', 0.08); }
  }
  else if (b.state === 'charge') {
    b.x += Math.cos(b.chargeAngle) * 380 * dt;
    b.y += Math.sin(b.chargeAngle) * 380 * dt;
    if (dist < b.r + p.r + 5 && p.invuln <= 0) {
      p.hp -= b.dmg * 2; p.invuln = 1; p.hurtFlash = 0.8; game.shake = 20;
      beep(60, 0.3, 'sawtooth', 0.15);
      p.x += Math.cos(b.chargeAngle) * 60; p.y += Math.sin(b.chargeAngle) * 60;
      b.state = 'recover'; b.stateTimer = 1.2;
    }
    const bd = Math.hypot(b.x, b.y);
    if (bd > MAP_RADIUS) { b.state = 'recover'; b.stateTimer = 1.2; }
    if (b.stateTimer <= 0) { b.state = 'recover'; b.stateTimer = 1.2; }
  }
  else if (b.state === 'recover') {
    if (b.stateTimer <= 0) { b.state = 'chase'; b.stateTimer = 2.5; }
  }

  if (b.hp <= 0) killBoss();
}

function killBoss() {
  const b = game.boss;
  game.coins += 100; game.crystals += 10; game.kills++;
  const cnt = Math.min(20, MAX_PARTICLES - game.particles.length);
  for (let i = 0; i < cnt; i++) {
    const a = Math.random() * Math.PI * 2; const s = rnd(100, 300);
    game.particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rnd(0.5,1), maxLife: 1, size: rnd(3,7), color: `hsl(${Math.random()*20}, 90%, ${30+Math.random()*30}%)` });
  }
  if (game.pickups.length < MAX_PICKUPS - 3) {
    game.pickups.push({ x: b.x, y: b.y, type: 'health', r: 14, life: 30 });
    game.pickups.push({ x: b.x + 30, y: b.y, type: 'ammo', r: 14, life: 30 });
    game.pickups.push({ x: b.x - 30, y: b.y, type: 'grenade', r: 14, life: 30 });
  }
  game.shake = 15;
  beep(80, 0.8, 'sawtooth', 0.15);
  game.boss = null;
}

function onWaveComplete() {
  saveGame();
  game.state = 'shop';
  openShop();
}

function openShop() {
  game.shopUpgrades = [];
  const allWeapons = Object.keys(WEAPONS).filter(w => w !== 'pistol' && game.weaponAmmo[w] === 0);
  const shuffled = [...allWeapons].sort(() => Math.random() - 0.5);
  for (let i = 0; i < Math.min(3, shuffled.length); i++) {
    const wId = shuffled[i]; const w = WEAPONS[wId];
    game.shopUpgrades.push({ type: 'weapon', id: wId, name: `${w.icon} ${w.name}`, desc: `Урон ${w.dmg} · Магазин ${w.magazine}`, cost: w.cost, ammo: 360 });
  }
  const upgrades = [
    { type: 'upgrade', id: 'hp', name: '❤️ +15 Макс HP', desc: 'Увеличивает максимум HP', cost: 80 },
    { type: 'upgrade', id: 'damage', name: '💥 +10% Урон', desc: 'Больше урона', cost: 100 },
    { type: 'upgrade', id: 'speed', name: '👟 +8% Скорость', desc: 'Быстрее бегаешь', cost: 80 },
    { type: 'upgrade', id: 'grenades', name: '💣 +2 Гранаты', desc: 'Больше гранат', cost: 60 }
  ];
  game.shopUpgrades = [...game.shopUpgrades, ...upgrades];
  screenEl.classList.add('active');
  renderShop();
}

function renderShop() {
  screenInner.innerHTML = `
    <h1 class="title green">🛒 МАГАЗИН</h1>
    <p class="subtitle">Волна ${game.wave} пройдена! Монет: ${game.coins} 💰</p>
    <div class="shop-grid" id="shopGrid"></div>
    <button class="btn-big green" id="nextWaveBtn">▶ СЛЕДУЮЩАЯ ВОЛНА</button>
  `;
  const grid = document.getElementById('shopGrid');
  game.shopUpgrades.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'shop-item';
    el.innerHTML = `<div class="name">${item.name}</div><div class="desc">${item.desc}</div><button class="buy-btn" data-idx="${i}" ${game.coins < item.cost ? 'disabled' : ''}>Купить · ${item.cost} 💰</button>`;
    grid.appendChild(el);
  });
  grid.querySelectorAll('.buy-btn').forEach(btn => {
    btn.addEventListener('click', () => buyShopItem(parseInt(btn.getAttribute('data-idx'))));
  });
  document.getElementById('nextWaveBtn').addEventListener('click', () => {
    screenEl.classList.remove('active');
    game.state = 'playing';
    game.lastTime = performance.now();
    startWave();
  });
}

function buyShopItem(idx) {
  const item = game.shopUpgrades[idx];
  if (!item || game.coins < item.cost) return;
  game.coins -= item.cost;
  if (item.type === 'weapon') {
    game.weaponAmmo[item.id] = item.ammo;
    game.magAmmo[item.id] = WEAPONS[item.id].magazine;
    game.currentWeapon = item.id;
    game.reloading = false;
    beep(700, 0.1, 'square', 0.06);
  } else {
    const p = game.player;
    if (item.id === 'hp') { p.maxHp += 15; p.hp += 15; }
    else if (item.id === 'damage') { p.damageMult *= 1.1; }
    else if (item.id === 'speed') { p.speed *= 1.08; }
    else if (item.id === 'grenades') { p.grenades += 2; }
    beep(600, 0.1, 'sine', 0.06);
  }
  game.shopUpgrades.splice(idx, 1);
  renderShop();
  updateHUD();
}

function onDeath() {
  game.state = 'gameover';
  game.crystals = Math.floor(game.crystals);
  meta.crystals += game.crystals;
  saveMeta();
  clearSave();
  beep(150, 0.8, 'sawtooth', 0.1);
  screenEl.classList.add('active');
  screenInner.innerHTML = `
    <h1 class="title red">ТЫ ПОГИБ</h1>
    <p class="subtitle">Ты продержался ${game.wave} волн</p>
    <div style="background:#1e293b;border-radius:12px;padding:15px;margin-bottom:20px;">
      <div class="stat-line">💀 Убито: <b>${game.kills}</b></div>
      <div class="stat-line">💰 Монет: <b>${game.coins}</b></div>
      <div class="stat-line">💎 Кристаллов: <b>${game.crystals}</b></div>
      <div class="stat-line">💎 Всего: <b>${meta.crystals}</b></div>
    </div>
    <button class="btn-big" id="metaBtn">⬆️ МЕТА-ПРОГРЕСС</button>
    <button class="btn-big gray" id="menuBtn">🏠 В МЕНЮ</button>
  `;
  document.getElementById('metaBtn').addEventListener('click', openMeta);
  document.getElementById('menuBtn').addEventListener('click', openMenu);
}

const META_UPGRADES = [
  { id: 'hp', name: '❤️ Крепкое здоровье', desc: '+10% макс. HP', maxLvl: 10, costPer: 5 },
  { id: 'damage', name: '💥 Острые пули', desc: '+10% урона', maxLvl: 10, costPer: 5 },
  { id: 'speed', name: '👟 Быстрые ноги', desc: '+5% скорости', maxLvl: 10, costPer: 4 },
  { id: 'coinDrop', name: '💰 Жадность', desc: '+15% монет', maxLvl: 10, costPer: 6 },
  { id: 'startGrenades', name: '💣 Арсенал', desc: '+1 стартовая граната', maxLvl: 5, costPer: 8 },
  { id: 'startCoins', name: '🪙 Капитал', desc: '+50 стартовых монет', maxLvl: 5, costPer: 10 }
];

function openMeta() { game.state = 'meta'; renderMeta(true); }

function renderMeta(fromDeath) {
  screenEl.classList.add('active');
  screenInner.innerHTML = `
    <h1 class="title" style="color:#a855f7;">💎 МЕТА-ПРОГРЕСС</h1>
    <p class="subtitle">Кристаллов: ${meta.crystals} 💎</p>
    <div id="metaList"></div>
    <button class="btn-big gray" id="backBtn" style="margin-top:20px;">← НАЗАД</button>
  `;
  const list = document.getElementById('metaList');
  META_UPGRADES.forEach(u => {
    const lvl = meta.upgrades[u.id] || 0;
    const cost = (lvl + 1) * u.costPer;
    const canBuy = lvl < u.maxLvl && meta.crystals >= cost;
    const el = document.createElement('div');
    el.className = 'meta-item';
    el.innerHTML = `<div class="info"><div class="n">${u.name} <span style="color:#fbbf24;">(ур. ${lvl}/${u.maxLvl})</span></div><div class="d">${u.desc}</div></div><button class="buy-btn" data-id="${u.id}" ${canBuy ? '' : 'disabled'}>${lvl >= u.maxLvl ? 'MAX' : `${cost} 💎`}</button>`;
    list.appendChild(el);
  });
  list.querySelectorAll('.buy-btn').forEach(btn => {
    btn.addEventListener('click', () => buyMeta(btn.getAttribute('data-id'), fromDeath));
  });
  document.getElementById('backBtn').addEventListener('click', () => { if (fromDeath) onDeath(); else openMenu(); });
}

function buyMeta(id, fromDeath) {
  const u = META_UPGRADES.find(x => x.id === id);
  const lvl = meta.upgrades[id] || 0;
  const cost = (lvl + 1) * u.costPer;
  if (lvl >= u.maxLvl || meta.crystals < cost) return;
  meta.crystals -= cost; meta.upgrades[id] = lvl + 1;
  saveMeta(); beep(800, 0.15, 'sine', 0.06);
  renderMeta(fromDeath);
}

// === ПРОМОКОД ===
function activatePromo() {
  const input = document.getElementById('promoInput');
  if (!input) return;
  const code = input.value.trim();
  if (!code) { beep(200, 0.15, 'square', 0.06); return; }
  if (!meta.promos) meta.promos = [];
  if (meta.promos.includes(code)) {
    beep(150, 0.2, 'sawtooth', 0.06);
    showPromoResult('❌ Уже активирован', '#ef4444');
    return;
  }
  const promo = PROMO_CODES[code];
  if (!promo) {
    beep(150, 0.2, 'sawtooth', 0.06);
    showPromoResult('❌ Неверный код', '#ef4444');
    return;
  }
  meta.promos.push(code);
  if (promo.crystals) meta.crystals += promo.crystals;
  if (promo.admin) meta.isAdmin = true;
  saveMeta();
  beep(1000, 0.15, 'sine', 0.08);
  setTimeout(() => beep(1300, 0.2, 'sine', 0.08), 100);
  showPromoResult(promo.msg, '#22c55e');
  input.value = '';
}

function showPromoResult(text, color) {
  const result = document.getElementById('promoResult');
  if (!result) return;
  result.textContent = text;
  result.style.color = color;
  result.style.opacity = '1';
  setTimeout(() => { result.style.opacity = '0'; }, 3000);
}

  screenInner.innerHTML = `

    <div style="margin-top:16px; padding:14px; background:#1e293b; border-radius:12px; border:1px solid #334155;">

      <div style="display:flex; gap:8px;">
        <input type="text" id="promoInput" placeholder="Введи код..." autocomplete="off" style="flex:1; padding:12px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:14px; text-align:center; font-weight:700; outline:none;" />
        <button id="promoBtn" style="padding:12px 22px; border:none; border-radius:10px; background:linear-gradient(135deg,#22c55e,#15803d); color:white; font-weight:900; font-size:16px;">✓</button>
      </div>
      <div id="promoResult" style="font-size:12px; font-weight:800; text-align:center; margin-top:8px; opacity:0; transition:opacity 0.3s; min-height:16px;"></div>
    </div>

    <div class="hint"><p>🕹️ Води пальцем — движение</p><p>🎯 Стрельба автоматическая</p><p>🔄 Перезарядка</p><p>📦 Патроны с зомби</p><p>💣 Граната · 🧱 Баррикада</p></div>`;
  document.getElementById('playBtn').addEventListener('click', () => { clearSave(); openClassSelect(); });
  document.getElementById('metaBtn').addEventListener('click', () => { game.state = 'meta'; renderMeta(false); });
  document.getElementById('promoBtn').addEventListener('click', activatePromo);
  document.getElementById('promoInput').addEventListener('keypress', (e) => { 
    if (e.key === 'Enter') { e.preventDefault(); activatePromo(); }
  });
  if (saved) {
    document.getElementById('continueBtn').addEventListener('click', () => continueGame(saved));
    document.getElementById('deleteSaveBtn').addEventListener('click', () => { if (confirm('Удалить сохранение?')) { clearSave(); openMenu(); } });
  }
}

function openClassSelect() {
  game.state = 'classSelect';
  screenInner.innerHTML = `<h1 class="title">🎖️ ВЫБЕРИ КЛАСС</h1><div class="grid-3" id="classGrid"></div><button class="btn-big green" id="nextBtn">ДАЛЕЕ → КАРТА</button><button class="btn-big gray" id="backBtn">← НАЗАД</button>`;
  const grid = document.getElementById('classGrid');
  CLASSES.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card-select' + (c.id === game.selectedClass ? ' selected' : '');
    el.innerHTML = `<div class="name">${c.name}</div><div class="desc">${c.desc}</div>`;
    el.addEventListener('click', () => { game.selectedClass = c.id; openClassSelect(); });
    grid.appendChild(el);
  });
  document.getElementById('nextBtn').addEventListener('click', () => openMapSelect());
  document.getElementById('backBtn').addEventListener('click', openMenu);
}

function openMapSelect() {
  game.state = 'mapSelect';
  screenInner.innerHTML = `<h1 class="title">🗺️ КАРТА</h1><div class="grid-3" id="mapGrid"></div><button class="btn-big green" id="startBtn">▶ НАЧАТЬ</button><button class="btn-big gray" id="backBtn">← НАЗАД</button>`;
  const grid = document.getElementById('mapGrid');
  MAPS.forEach(m => {
    const el = document.createElement('div');
    el.className = 'card-select' + (m.id === game.selectedMap ? ' selected' : '');
    el.innerHTML = `<div class="name">${m.name}</div><div class="desc">Препятствий: ${m.obstacleCount}</div>`;
    el.addEventListener('click', () => { game.selectedMap = m.id; openMapSelect(); });
    grid.appendChild(el);
  });
  document.getElementById('startBtn').addEventListener('click', () => { screenEl.classList.remove('active'); startGame(); });
  document.getElementById('backBtn').addEventListener('click', () => openClassSelect());
}

function drawFloor(cam) {
  const cfg = game.mapConfig || MAPS[0];
  ctx.fillStyle = cfg.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
  const gs = 80;
  const startX = Math.floor((cam.x - W/2/cam.zoom - 100) / gs) * gs;
  const startY = Math.floor((cam.y - H/2/cam.zoom - 100) / gs) * gs;
  const endX = cam.x + W/2/cam.zoom + 100;
  const endY = cam.y + H/2/cam.zoom + 100;
  ctx.strokeStyle = cfg.floor === 'grass' ? 'rgba(34,139,34,0.08)' : 'rgba(100,150,210,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = startX; x < endX; x += gs) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
  for (let y = startY; y < endY; y += gs) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(239,68,68,0.5)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(0, 0, MAP_RADIUS, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawObstacle(o) {
  const sprite = SPRITES[o.type];
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(o.x + 4, o.y + o.size * 0.35, o.size * 0.5, o.size * 0.25, 0, 0, Math.PI*2);
  ctx.fill();
  if (sprite) {
    ctx.imageSmoothingEnabled = false;
    const drawSize = o.size * 1.15;
    ctx.drawImage(sprite, o.x - drawSize/2, o.y - drawSize/2, drawSize, drawSize);
  }
  ctx.restore();
}

function drawBarricade(b) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(b.x + 3, b.y + 5, b.r, b.r*0.5, 0, 0, Math.PI*2); ctx.fill();
  const sprite = SPRITES.barricade;
  if (sprite) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sprite, b.x - b.r*1.15, b.y - b.r*1.15, b.r*2.3, b.r*2.3);
  }
  if (b.hp < b.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(b.x - b.r, b.y - b.r - 8, b.r*2, 4);
    ctx.fillStyle = b.hp/b.maxHp > 0.5 ? '#22c55e' : b.hp/b.maxHp > 0.25 ? '#fbbf24' : '#ef4444';
    ctx.fillRect(b.x - b.r, b.y - b.r - 8, b.r*2 * (b.hp/b.maxHp), 4);
  }
  ctx.restore();
}

function drawMinimap() {
  miniCtx.clearRect(0, 0, 184, 184);
  miniCtx.fillStyle = 'rgba(2,6,23,0.9)';
  miniCtx.fillRect(0, 0, 184, 184);
  const scale = 184 / (MAP_RADIUS * 2.2);
  const toMapX = (x) => 92 + x * scale;
  const toMapY = (y) => 92 + y * scale;
  miniCtx.strokeStyle = 'rgba(239,68,68,0.5)';
  miniCtx.lineWidth = 2;
  miniCtx.beginPath();
  miniCtx.arc(92, 92, MAP_RADIUS * scale, 0, Math.PI*2);
  miniCtx.stroke();
  miniCtx.fillStyle = 'rgba(100,116,139,0.6)';
  for (const o of game.obstacles) {
    miniCtx.fillRect(toMapX(o.x - o.size/2), toMapY(o.y - o.size/2), o.size*scale, o.size*scale);
  }
  for (const pk of game.pickups) {
    if (pk.type === 'health') miniCtx.fillStyle = '#22c55e';
    else if (pk.type === 'grenade') miniCtx.fillStyle = '#84cc16';
    else miniCtx.fillStyle = '#fbbf24';
    miniCtx.fillRect(toMapX(pk.x)-1.5, toMapY(pk.y)-1.5, 3, 3);
  }
  for (const z of game.zombies) {
    miniCtx.fillStyle = z.slowMult < 1 ? '#fbbf24' : '#ef4444';
    miniCtx.fillRect(toMapX(z.x)-1.5, toMapY(z.y)-1.5, 3, 3);
  }
  if (game.boss) {
    miniCtx.fillStyle = game.boss.state === 'charge' ? '#dc2626' : '#fbbf24';
    miniCtx.beginPath(); miniCtx.arc(toMapX(game.boss.x), toMapY(game.boss.y), 5, 0, Math.PI*2); miniCtx.fill();
  }
  if (game.player) {
    miniCtx.fillStyle = '#38bdf8';
    miniCtx.beginPath(); miniCtx.arc(toMapX(game.player.x), toMapY(game.player.y), 4, 0, Math.PI*2); miniCtx.fill();
    miniCtx.strokeStyle = '#fff'; miniCtx.lineWidth = 1.5; miniCtx.stroke();
  }
}

function drawPickup(pk) {
  const pulse = 1 + Math.sin(game.time * 6) * 0.1;
  const r = pk.r * pulse;
  const spriteKey = pk.type === 'health' ? 'health' : pk.type === 'grenade' ? 'grenade' : 'ammo';
  const sprite = SPRITES[spriteKey];
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = pk.type === 'health' ? '#22c55e' : pk.type === 'grenade' ? '#84cc16' : '#fbbf24';
  ctx.beginPath(); ctx.arc(pk.x, pk.y, r*1.6, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  if (sprite) {
    ctx.imageSmoothingEnabled = false;
    const sz = r * 2.2;
    ctx.drawImage(sprite, pk.x - sz/2, pk.y - sz/2, sz, sz);
  }
}

function draw() {
  const cam = game.camera;
  drawFloor(cam);
  if (game.state === 'menu' || game.state === 'classSelect' || game.state === 'mapSelect') return;
  
  ctx.save();
  if (game.shake > 0.3) ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
  ctx.imageSmoothingEnabled = false;

  for (const o of game.obstacles) drawObstacle(o);
  for (const b of game.barricades) drawBarricade(b);
  for (const pk of game.pickups) drawPickup(pk);

  for (const pt of game.particles) {
    if (pt.type === 'laser') {
      const alpha = pt.life / pt.maxLife;
      ctx.strokeStyle = pt.color; ctx.globalAlpha = alpha; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(pt.x1, pt.y1); ctx.lineTo(pt.x2, pt.y2); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const z of game.zombies) {
    let alpha = 1;
    if (z.type === 'invisible') {
      const d = Math.hypot(z.x - game.player.x, z.y - game.player.y);
      if (d > z.invisibilityRange) alpha = 0.25;
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(z.x, z.y + z.r * 0.7, z.r * 0.9, z.r * 0.4, 0, 0, Math.PI*2); ctx.fill();
    const sprite = SPRITES[z.type ? Z_TYPES[z.type].sprite : 'zombie_normal'];
    if (sprite) {
      ctx.save();
      ctx.translate(z.x, z.y);
      ctx.rotate(z.angle + Math.PI/2);
      ctx.imageSmoothingEnabled = false;
      const size = z.r * 3.2;
      ctx.drawImage(sprite, -size/2, -size/2, size, size);
      ctx.restore();
    }
    if (z.hitFlash > 0) {
      ctx.globalAlpha = Math.min(1, z.hitFlash * 6);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = alpha;
    }
    if (z.slowMult < 1) {
      ctx.strokeStyle = 'rgba(56,189,248,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 4, 0, Math.PI*2); ctx.stroke();
    }
    if (z.hp < z.maxHp) {
      const w = z.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(z.x - w/2, z.y - z.r - 10, w, 4);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(z.x - w/2, z.y - z.r - 10, w * (z.hp / z.maxHp), 4);
    }
    ctx.restore();
  }

  // БОСС
  if (game.boss) {
    const b = game.boss;
    if (b.state === 'windup') {
      const pulse = 0.4 + Math.sin(game.time * 20) * 0.4;
      ctx.fillStyle = `rgba(239,68,68,${pulse * 0.4})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.5, 0, Math.PI*2); ctx.fill();
    }
    if (b.state === 'charge') {
      for (let i = 1; i <= 5; i++) {
        const tx = b.x - Math.cos(b.chargeAngle) * (i * 25);
        const ty = b.y - Math.sin(b.chargeAngle) * (i * 25);
        ctx.fillStyle = `rgba(220,38,38,${0.5 - i*0.08})`;
        ctx.beginPath(); ctx.arc(tx, ty, b.r * (1 - i*0.1), 0, Math.PI*2); ctx.fill();
      }
    }
    if (b.state === 'recover') {
      ctx.fillStyle = 'rgba(168,85,247,0.3)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(b.x, b.y + b.r * 0.7, b.r * 0.9, b.r * 0.4, 0, 0, Math.PI*2); ctx.fill();
    if (SPRITES.boss) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle + Math.PI/2);
      const size = b.r * 3.1;
      if (b.state === 'recover') ctx.filter = 'hue-rotate(270deg) brightness(1.3)';
      if (b.hitFlash > 0) ctx.filter = 'brightness(2)';
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(SPRITES.boss, -size/2, -size/2, size, size);
      ctx.filter = 'none';
      ctx.restore();
    }
  }

  // Пули
  for (const b of game.bullets) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.2, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    const sprite = SPRITES[b.sprite];
    if (sprite) {
      const sz = b.r * 4;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sprite, -sz/2, -sz/2, sz, sz);
      ctx.restore();
    } else {
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    }
  }
  for (const b of game.enemyBullets) {
    ctx.fillStyle = b.color || '#84cc16';
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
  }

  // Игрок
  const p = game.player;
  if (p) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + p.r * 0.7, p.r * 0.9, p.r * 0.4, 0, 0, Math.PI*2); ctx.fill();
    if (SPRITES.player) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.bodyAngle + Math.PI/2);
      ctx.imageSmoothingEnabled = false;
      const size = p.r * 3.6;
      ctx.drawImage(SPRITES.player, -size/2, -size/2, size, size);
      ctx.restore();
    }
    if (p.hurtFlash > 0) {
      ctx.fillStyle = `rgba(239,68,68,${p.hurtFlash * 0.6})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2); ctx.fill();
    }
  }

  // НОЧЬ
  if (game.isNight) {
    ctx.restore();
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'destination-out';
    const maskSize = Math.max(W, H) * 1.6;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(NIGHT_MASK, W/2 - maskSize/2, H/2 - maskSize/2, maskSize, maskSize);
    ctx.globalCompositeOperation = 'source-over';
    ctx.imageSmoothingEnabled = false;
    ctx.restore();
    return;
  }
  ctx.restore();

  if (joystick.active) {
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.arc(joystick.bx, joystick.by, JOY_MAX, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(joystick.bx + joystick.dx*JOY_MAX, joystick.by + joystick.dy*JOY_MAX, 22, 0, Math.PI*2);
    ctx.fillStyle = '#38bdf8'; ctx.fill();
    ctx.restore();
  }

  drawMinimap();

  if (game.boss) {
    const pct = game.boss.hp / game.boss.maxHp;
    const barW = W * 0.7, barH = 14;
    const barX = (W - barW) / 2, barY = 80;
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = game.boss.state === 'recover' ? '#a855f7' : '#ef4444';
    ctx.fillRect(barX, barY, barW * pct, barH);
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    const stateText = game.boss.state === 'windup' ? '👹 БОСС — ЗАМАХ' :
                      game.boss.state === 'charge' ? '💥 РЫВОК' :
                      game.boss.state === 'recover' ? '⚡ УЯЗВИМ x2' : '👹 БОСС';
    ctx.fillText(stateText, W/2, barY - 6);
  }
}

function loop(now) {
  let dt = (now - game.lastTime) / 1000;
  game.lastTime = now;
  if (dt > 0.15) dt = 0.033;
  if (dt < 0) dt = 0;
  if (game.state === 'playing') update(dt);
  if (game.state !== 'menu' && game.state !== 'classSelect' && game.state !== 'mapSelect') {
    if (game.player) draw();
  } else {
    draw();
  }
  requestAnimationFrame(loop);
}

window.addEventListener('error', e => console.error('JS ERROR:', e.message, e.lineno));

game.lastTime = performance.now();
openMenu();
requestAnimationFrame(loop);
</script>
