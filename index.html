<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Zombie Survival</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e14;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
  #game{display:block;width:100%;height:100%}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,20,.94);color:#e6edf3;text-align:center;padding:24px;z-index:10;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .overlay.hidden{display:none}
  .overlay h1{font-size:28px;margin-bottom:8px}
  .overlay p{color:#9ca3af;margin-bottom:20px;font-size:14px;line-height:1.5}
  .btn{background:#4ade80;color:#0a0e14;border:none;padding:14px 32px;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.96)}
  .upgrades{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin-top:8px}
  .upgrade-btn{background:#1f2937;color:#e6edf3;border:1px solid #374151;padding:14px 16px;border-radius:12px;font-size:14px;text-align:left;cursor:pointer;transition:background .1s}
  .upgrade-btn:active{background:#374151}
  .upgrade-btn b{color:#4ade80;display:block;margin-bottom:2px}
  .upgrade-btn span{color:#9ca3af;font-size:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>🧟 Zombie Survival</h1>
  <p>Джойстик слева — движение.<br>Стрельба автоматическая.</p>
  <button class="btn" onclick="startGame()">Начать</button>
</div>

<div id="upgradeScreen" class="overlay hidden">
  <h1>Волна пройдена!</h1>
  <p>Выбери улучшение</p>
  <div class="upgrades" id="upgradeList"></div>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h1>Ты погиб</h1>
  <p id="finalScore"></p>
  <button class="btn" onclick="restartGame()">Заново</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const game = {
  running: false, wave: 1, score: 0, kills: 0,
  player: null, zombies: [], bullets: [], particles: [], pickups: [],
  spawnQueue: 0, spawnTimer: 0, waveActive: false,
  lastTime: 0, screenShake: 0
};

const UPGRADES = [
  { name:'Урон +20%',             desc:'Пули бьют сильнее',         apply: p => p.dmg *= 1.2 },
  { name:'Скорострельность +15%', desc:'Быстрее стреляешь',         apply: p => p.fireRate *= 0.85 },
  { name:'Скорость +12%',         desc:'Быстрее бегаешь',           apply: p => p.speed *= 1.12 },
  { name:'Макс HP +25',           desc:'Больше здоровья',           apply: p => { p.maxHp += 25; p.hp += 25; } },
  { name:'Радиус стрельбы +40',   desc:'Дальше замечаешь врагов',   apply: p => p.range += 40 },
  { name:'Скорость пуль +20%',    desc:'Пули летят быстрее',        apply: p => p.bulletSpeed *= 1.2 },
  { name:'Лечение +50',           desc:'Восстанавливает здоровье',  apply: p => p.hp = Math.min(p.maxHp, p.hp + 50) },
  { name:'Магнит +30',            desc:'Дальше собираешь пикапы',   apply: p => p.pickupRange += 30 }
];

function makePlayer() {
  return {
    x: W/2, y: H/2, r: 14,
    hp: 100, maxHp: 100,
    speed: 190, dmg: 12, fireRate: 0.35, fireCd: 0,
    bulletSpeed: 520, range: 260, pickupRange: 28
  };
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  Object.assign(game, {
    player: makePlayer(),
    zombies: [], bullets: [], particles: [], pickups: [],
    wave: 1, score: 0, kills: 0,
    spawnQueue: 0, spawnTimer: 0, waveActive: false,
    running: true, lastTime: 0, screenShake: 0
  });
  startWave();
}

function startWave() {
  game.waveActive = true;
  game.spawnQueue = 5 + game.wave * 2;
  game.spawnTimer = 0.6;
}

function endWave() {
  game.waveActive = false;
  game.score += 100;
  game.running = false;
  showUpgrades();
}

function showUpgrades() {
  const pool = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
  const list = document.getElementById('upgradeList');
  list.innerHTML = '';
  for (const u of pool) {
    const btn = document.createElement('button');
    btn.className = 'upgrade-btn';
    btn.innerHTML = `<b>${u.name}</b><span>${u.desc}</span>`;
    btn.onclick = () => {
      u.apply(game.player);
      document.getElementById('upgradeScreen').classList.add('hidden');
      game.wave++;
      game.running = true;
      game.lastTime = 0;
      startWave();
    };
    list.appendChild(btn);
  }
  document.getElementById('upgradeScreen').classList.remove('hidden');
}

function gameOver() {
  game.running = false;
  document.getElementById('finalScore').textContent =
    `Волна ${game.wave} • Очки ${game.score} • Убито ${game.kills}`;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function restartGame() {
  document.getElementById('gameOverScreen').classList.add('hidden');
  startGame();
}

// ===== ввод: джойстик =====
const joy = { active: false, id: null, baseX: 0, baseY: 0, dx: 0, dy: 0, maxR: 60 };

function joyStart(x, y, id) {
  if (joy.active) return;
  joy.active = true; joy.id = id;
  joy.baseX = x; joy.baseY = y;
  joy.dx = 0; joy.dy = 0;
}
function joyMove(x, y) {
  const dx = x - joy.baseX, dy = y - joy.baseY;
  const d = Math.hypot(dx, dy);
  if (d > 1) {
    const cl = Math.min(d, joy.maxR);
    joy.dx = (dx / d) * (cl / joy.maxR);
    joy.dy = (dy / d) * (cl / joy.maxR);
  } else { joy.dx = 0; joy.dy = 0; }
}
function joyEnd() { joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0; }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < W * 0.55 && !joy.active) joyStart(t.clientX, t.clientY, t.identifier);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joy.id) joyMove(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === joy.id) joyEnd();
});
canvas.addEventListener('touchcancel', joyEnd);

canvas.addEventListener('mousedown', e => { if (e.clientX < W * 0.55) joyStart(e.clientX, e.clientY, 'mouse'); });
canvas.addEventListener('mousemove', e => { if (joy.active) joyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', joyEnd);

// ===== игровая логика =====
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);

function spawnZombie() {
  const brute = Math.random() < 0.18;
  const pad = 40;
  let x, y;
  const edge = Math.floor(Math.random() * 4);
  if (edge === 0) { x = Math.random() * W; y = -pad; }
  else if (edge === 1) { x = W + pad; y = Math.random() * H; }
  else if (edge === 2) { x = Math.random() * W; y = H + pad; }
  else { x = -pad; y = Math.random() * H; }

  const hp = brute ? 80 + game.wave * 16 : 30 + game.wave * 8;
  game.zombies.push({
    x, y, hp, maxHp: hp,
    r: brute ? 20 : 13,
    speed: brute ? 40 + game.wave * 1.5 : 55 + game.wave * 3,
    dmg: brute ? 16 : 8,
    type: brute ? 'brute' : 'basic',
    hitFlash: 0, atkCd: 0
  });
}

function spawnParticles(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = rand(40, 180);
    game.particles.push({
      x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: rand(0.3, 0.7), maxLife: 0.7,
      size: rand(2, 4), color
    });
  }
}

function update(dt) {
  const p = game.player;

  if (joy.active && (joy.dx || joy.dy)) {
    p.x += joy.dx * p.speed * dt;
    p.y += joy.dy * p.speed * dt;
  }
  p.x = clamp(p.x, p.r, W - p.r);
  p.y = clamp(p.y, p.r, H - p.r);

  p.fireCd -= dt;
  if (p.fireCd <= 0) {
    let nearest = null, nd = Infinity;
    for (const z of game.zombies) {
      const d = Math.hypot(z.x - p.x, z.y - p.y);
      if (d < nd && d < p.range) { nd = d; nearest = z; }
    }
    if (nearest) {
      p.fireCd = p.fireRate;
      const ang = Math.atan2(nearest.y - p.y, nearest.x - p.x);
      game.bullets.push({
        x: p.x, y: p.y,
        vx: Math.cos(ang) * p.bulletSpeed,
        vy: Math.sin(ang) * p.bulletSpeed,
        dmg: p.dmg, dist: 0, maxDist: p.range * 1.1
      });
    }
  }

  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    const step = Math.hypot(b.vx, b.vy) * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.dist += step;
    let dead = b.dist > b.maxDist || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20;
    if (!dead) {
      for (const z of game.zombies) {
        if (Math.hypot(z.x - b.x, z.y - b.y) < z.r + 3) {
          z.hp -= b.dmg; z.hitFlash = 0.08;
          spawnParticles(b.x, b.y, 4, '#fbbf24');
          dead = true; break;
        }
      }
    }
    if (dead) game.bullets.splice(i, 1);
  }

  for (let i = game.zombies.length - 1; i >= 0; i--) {
    const z = game.zombies[i];
    const dx = p.x - z.x, dy = p.y - z.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < z.r + p.r) {
      z.atkCd -= dt;
      if (z.atkCd <= 0) {
        z.atkCd = 0.6;
        p.hp -= z.dmg;
        game.screenShake = Math.min(game.screenShake + 6, 14);
        spawnParticles(p.x, p.y, 8, '#f87171');
      }
    } else {
      z.x += (dx / d) * z.speed * dt;
      z.y += (dy / d) * z.speed * dt;
    }
    z.hitFlash = Math.max(0, z.hitFlash - dt);
    if (z.hp <= 0) {
      game.zombies.splice(i, 1);
      game.kills++;
      game.score += z.type === 'brute' ? 25 : 10;
      spawnParticles(z.x, z.y, 14, z.type === 'brute' ? '#a855f7' : '#4ade80');
      if (Math.random() < 0.18) {
        game.pickups.push({ x: z.x, y: z.y, r: 9, life: 12, bob: Math.random() * 6.28 });
      }
    }
  }

  for (let i = game.pickups.length - 1; i >= 0; i--) {
    const pk = game.pickups[i];
    pk.life -= dt; pk.bob += dt * 4;
    const d = Math.hypot(p.x - pk.x, p.y - pk.y);
    if (d < p.r + pk.r) {
      p.hp = Math.min(p.maxHp, p.hp + 20);
      game.pickups.splice(i, 1);
      spawnParticles(pk.x, pk.y, 10, '#4ade80');
      continue;
    }
    if (d < p.pickupRange + p.r + pk.r) {
      const dx = p.x - pk.x, dy = p.y - pk.y;
      pk.x += dx * dt * 8; pk.y += dy * dt * 8;
    }
    if (pk.life <= 0) game.pickups.splice(i, 1);
  }

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= dt;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }

  game.screenShake *= 0.88;

  if (game.waveActive) {
    if (game.spawnQueue > 0) {
      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        game.spawnTimer = 0.4;
        game.spawnQueue--;
        spawnZombie();
      }
    } else if (game.zombies.length === 0) {
      endWave();
    }
  }

  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}

// ===== отрисовка =====
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  const barW = 140, barH = 14;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(16, 16, barW, barH, 7); ctx.fill();

  const p = game.player;
  const hpPct = Math.max(0, p.hp / p.maxHp);
  ctx.fillStyle = hpPct > 0.5 ? '#4ade80' : hpPct > 0.25 ? '#facc15' : '#f87171';
  roundRect(16, 16, barW * hpPct, barH, 7); ctx.fill();

  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.fillStyle = '#e6edf3';
  ctx.textAlign = 'left';
  ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, 16 + barW + 8, 28);

  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = '#e6edf3';
  ctx.fillText(`ВОЛНА ${game.wave}`, 16, 62);

  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = '#9ca3af';
  const left = game.zombies.length + game.spawnQueue;
  ctx.fillText(`Врагов: ${left}`, 16, 80);

  ctx.textAlign = 'right';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = '#e6edf3';
  ctx.fillText(`Очки: ${game.score}`, W - 16, 62);

  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = '#9ca3af';
  ctx.fillText(`Убито: ${game.kills}`, W - 16, 80);
  ctx.textAlign = 'left';
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.save();
  if (game.screenShake > 0.5) {
    ctx.translate((Math.random() - 0.5) * game.screenShake, (Math.random() - 0.5) * game.screenShake);
  }

  for (const pk of game.pickups) {
    const s = 1 + Math.sin(pk.bob) * 0.15;
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.r * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(pk.x - 1.5, pk.y - 4, 3, 8);
    ctx.fillRect(pk.x - 4, pk.y - 1.5, 8, 3);
  }

  for (const pt of game.particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#fde047';
  for (const b of game.bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  for (const z of game.zombies) {
    ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : (z.type === 'brute' ? '#a855f7' : '#ef4444');
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
    if (z.hp < z.maxHp) {
      const bw = z.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(z.x - z.r, z.y - z.r - 8, bw, 3);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(z.x - z.r, z.y - z.r - 8, bw * (z.hp / z.maxHp), 3);
    }
  }

  const p = game.player;
  ctx.strokeStyle = 'rgba(74,222,128,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.range, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = '#4ade80';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#86efac';
  ctx.lineWidth = 3; ctx.stroke();

  ctx.restore();

  if (joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, joy.maxR, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(74,222,128,0.65)';
    ctx.beginPath();
    ctx.arc(joy.baseX + joy.dx * joy.maxR, joy.baseY + joy.dy * joy.maxR, 24, 0, Math.PI * 2);
    ctx.fill();
  }

  drawHUD();
}

function loop(ts) {
  requestAnimationFrame(loop);
  if (!game.lastTime) game.lastTime = ts;
  let dt = (ts - game.lastTime) / 1000;
  game.lastTime = ts;
  dt = Math.min(dt, 0.05);
  if (game.running && game.player) update(dt);
  if (game.player) draw();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
