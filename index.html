<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Zombie Pixel Survival</title>
<script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
<script>window.vConsole = new window.VConsole();</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Courier New',Courier,monospace}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e14;touch-action:none}
  #game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,20,.97);color:#e6edf3;text-align:center;padding:20px;z-index:10;overflow-y:auto}
  .overlay.hidden{display:none}
  h1{font-size:24px;margin-bottom:8px;color:#4ade80;text-shadow:2px 2px 0 #000}
  p{color:#9ca3af;margin-bottom:16px;font-size:13px;line-height:1.4}
  .btn{background:#4ade80;color:#000;border:3px solid #166534;padding:12px 24px;font-size:16px;font-weight:900;margin:6px;cursor:pointer;box-shadow:4px 4px 0 #000}
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
  .btn.alt{background:#64748b;border-color:#334155;color:#fff}
  .btn.red{background:#ef4444;border-color:#7f1d1d;color:#fff}
  .btn.big{font-size:20px;padding:16px 40px}
  .cards{display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:400px}
  .card-btn{background:#1e293b;color:#fff;border:3px solid #475569;padding:12px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:4px 4px 0 #000}
  .card-btn.locked{opacity:.6;border-color:#ef4444}
  .card-btn .icon{font-size:28px}
  .card-btn b{font-size:16px;color:#fbbf24;display:block;margin-bottom:4px}
  .card-btn span{font-size:12px;color:#94a3b8}
  .card-btn .price{font-size:12px;color:#ef4444;margin-top:4px;font-weight:bold}
  .classes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
  .class-btn{background:#1e293b;border:3px solid #475569;padding:10px;text-align:left;color:#fff;cursor:pointer;box-shadow:4px 4px 0 #000}
  .class-btn b{display:block;margin-bottom:4px}
  .class-btn span{font-size:11px;color:#94a3b8;display:block;margin-bottom:4px}
  .class-btn .stats{font-size:10px;color:#fbbf24}
  .upgrades{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px}
  .upgrade-btn{background:#1e293b;border:3px solid #475569;padding:12px;text-align:left;color:#fff;cursor:pointer;box-shadow:4px 4px 0 #000}
  .upgrade-btn b{display:block;margin-bottom:4px;font-size:14px}
  .upgrade-btn span{font-size:12px;color:#94a3b8}
  .upgrade-btn.common{border-color:#64748b}
  .upgrade-btn.rare{border-color:#3b82f6}
  .upgrade-btn.epic{border-color:#a855f7}
  .upgrade-btn.legend{border-color:#fbbf24}
  .rarity-tag{font-size:10px;padding:2px 6px;margin-left:8px;border:1px solid currentColor}
  .mutators{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px;margin-bottom:16px}
  .mutator{background:#1e293b;border:2px solid #475569;padding:10px;cursor:pointer;display:flex;justify-content:space-between;color:#fff;text-align:left}
  .mutator.on{border-color:#4ade80;background:#064e3b}
  .mutator .mname{font-weight:bold;font-size:13px;margin-bottom:2px}
  .mutator .mdesc{font-size:11px;color:#94a3b8}
  .stat-row{display:flex;justify-content:space-between;color:#94a3b8;font-size:13px;padding:6px 0;border-bottom:2px dashed #334155;width:100%;max-width:320px}
  .stat-row span:last-child{color:#fbbf24;font-weight:bold}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-50px);background:#fbbf24;color:#000;padding:10px 20px;font-weight:bold;border:3px solid #000;opacity:0;transition:all .3s;z-index:99}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
  .shop-item{background:#1e293b;border:3px solid #475569;padding:10px;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:4px 4px 0 #000}
  .shop-item.owned{border-color:#4ade80;background:#064e3b}
  .shop-item b{font-size:13px;display:block;margin-bottom:4px}
  .shop-item span{font-size:11px;color:#94a3b8}
  .shop-item .price{color:#fbbf24;font-weight:bold;margin-top:8px;font-size:12px}
  .settings-row{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:320px;padding:12px 0;border-bottom:2px dashed #334155;color:#fff}
  input[type=checkbox]{width:20px;height:20px;accent-color:#4ade80}
  input[type=range]{width:120px}
  .roll-box{width:200px;height:120px;background:#000;border:4px solid #475569;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px 0}
  .roll-box .wicon{font-size:40px}
  .roll-box .wname{color:#4ade80;font-weight:bold;font-size:16px;margin-top:10px}
  .rolling{animation:shake 0.1s infinite}
  @keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="toast" id="toast"></div>

<div id="mainMenu" class="overlay">
  <h1>ZOMBIE PIXEL SURVIVAL</h1>
  <p id="bloodDisplay">Кровь: 0</p>
  <button class="btn big" onclick="showMapSelect()">ИГРАТЬ</button>
  <button class="btn big" id="continueBtn" onclick="loadGameState()" style="background:#3b82f6;color:#fff;display:none">ПРОДОЛЖИТЬ</button>
  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center">
    <button class="btn alt" onclick="showShop()">МАГАЗИН</button>
    <button class="btn alt" onclick="showSettings(false)">НАСТРОЙКИ</button>
    <button class="btn alt" onclick="showAchievements()">ДОСТИЖЕНИЯ</button>
  </div>
</div>

<div id="shopScreen" class="overlay hidden">
  <h1>МАГАЗИН</h1>
  <p id="shopBlood" style="color:#fbbf24">Кровь: 0</p>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn alt" onclick="renderShop('skins')">СКИНЫ</button>
    <button class="btn alt" onclick="renderShop('perks')">ПЕРКИ</button>
    <button class="btn alt" onclick="renderShop('maps')">КАРТЫ</button>
  </div>
  <div class="shop-grid" id="shopList"></div>
  <button class="btn alt" style="margin-top:20px" onclick="hideShop()">НАЗАД</button>
</div>

<div id="mapScreen" class="overlay hidden">
  <h1>ВЫБОР ЛОКАЦИИ</h1>
  <div class="cards" id="mapList"></div>
  <button class="btn alt" style="margin-top:20px" onclick="quitToMenu()">НАЗАД</button>
</div>

<div id="mutatorScreen" class="overlay hidden">
  <h1>МУТАТОРЫ</h1>
  <div class="mutators" id="mutatorList"></div>
  <button class="btn" onclick="startFromMutators()">ДАЛЬШЕ</button>
  <button class="btn alt" onclick="quitToMenu()">НАЗАД</button>
</div>

<div id="startScreen" class="overlay hidden">
  <h1>КЛАСС</h1>
  <p id="mapName"></p>
  <div class="classes" id="classList"></div>
  <button class="btn alt" style="margin-top:20px" onclick="showMapSelect()">НАЗАД</button>
</div>

<div id="upgradeScreen" class="overlay hidden">
  <h1>ВОЛНА ПРОЙДЕНА</h1>
  <div class="upgrades" id="upgradeList"></div>
</div>

<div id="weaponScreen" class="overlay hidden">
  <h1>НОВОЕ ОРУЖИЕ</h1>
  <div class="roll-box rolling" id="weaponRoll">
    <div class="wicon" id="rollIcon">🔫</div>
    <div class="wname" id="rollName">Крутим...</div>
  </div>
  <button class="btn" onclick="finishWeaponRoll()">ЗАБРАТЬ</button>
</div>

<div id="pauseScreen" class="overlay hidden">
  <h1>ПАУЗА</h1>
  <button class="btn" onclick="togglePause()">ПРОДОЛЖИТЬ</button>
  <button class="btn alt" onclick="showSettings(true)">НАСТРОЙКИ</button>
  <button class="btn red" onclick="saveGameState()">СОХРАНИТЬ И ВЫЙТИ</button>
</div>

<div id="settingsScreen" class="overlay hidden">
  <h1>НАСТРОЙКИ</h1>
  <div class="settings-row"><span>Звук</span><input type="checkbox" id="setSound"></div>
  <div class="settings-row"><span>Вибрация</span><input type="checkbox" id="setVibe"></div>
  <div class="settings-row"><span>Джойстик</span><input type="range" id="setJoy" min="40" max="90" step="5"></div>
  <button class="btn" onclick="closeSettings()">ГОТОВО</button>
</div>

<div id="achScreen" class="overlay hidden">
  <h1>ДОСТИЖЕНИЯ</h1>
  <div id="achList" style="width:100%;max-width:320px;margin-bottom:20px;max-height:50vh;overflow-y:auto"></div>
  <button class="btn" onclick="closeAchievements()">НАЗАД</button>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h1 id="goTitle">ТЫ ПОГИБ</h1>
  <div id="resultStats"></div>
  <button class="btn" onclick="restartGame()">ЗАНОВО</button>
  <button class="btn alt" onclick="quitToMenu()">В МЕНЮ</button>
</div>

<script>
// ==========================================
// БАЗОВЫЕ НАСТРОЙКИ И СОСТОЯНИЕ
// ==========================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
bgCtx.imageSmoothingEnabled = false;
let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);
  if(game.player) buildBackground();
}
window.addEventListener('resize', resize); resize();

const settings = Object.assign({ sound: true, vibe: true, joySize: 60 }, JSON.parse(localStorage.getItem('zs_settings') || '{}'));
function saveSettings() { localStorage.setItem('zs_settings', JSON.stringify(settings)); }

const meta = Object.assign({ blood: 0, kills: 0, bestWave: 0, unlockedWeapons: ['pistol','shotgun','smg','rifle'], unlockedMaps: ['forest','industrial'], achievements: [], ownedSkins: [], activeSkin: 'default', ownedPerks: [] }, JSON.parse(localStorage.getItem('zs_meta') || '{}'));
function saveMeta() { localStorage.setItem('zs_meta', JSON.stringify(meta)); }

const game = {
  running: false, paused: false, wave: 1, score: 0, kills: 0, bestCombo: 0, startTime: 0, damageDealt: 0,
  player: null, zombies: [], bullets: [], enemyBullets: [], particles: [], pickups: [], hazards: [], bloodDecals: [], damageNumbers: [], ambient: [],
  obstacles: [], originalObstacles: [], decorations: [], patches: [], world: null, mapKey: null, bosses: [], interactive: [],
  spawnQueue: 0, spawnTimer: 0, waveActive: false, lastTime: 0, screenShake: 0, hitStop: 0, nextId: 1, waveBanner: 0,
  activeMods: [], waveTimer: 0, weather: null, weatherTimer: 0, selectedMutators: [], combo: 0, comboTimer: 0, comboMult: 1, lastWeaponRoll: null
};
const camera = { x: 0, y: 0, tx: 0, ty: 0 };
let selectedMap = null;

// ==========================================
// ДАННЫЕ
// ==========================================
const WEAPONS = {
  pistol: { name:'Пистолет', icon:'🔫', dmg:12, fireRate:0.35, bulletSpeed:520, range:260, pellets:1, spread:0, pierce:0, color:'#fde047' },
  shotgun: { name:'Дробовик', icon:'💥', dmg:8, fireRate:0.7, bulletSpeed:450, range:200, pellets:5, spread:0.55, pierce:0, color:'#fb923c' },
  smg: { name:'ПП', icon:'⚡', dmg:7, fireRate:0.12, bulletSpeed:560, range:240, pellets:1, spread:0.09, pierce:0, color:'#60a5fa' },
  rifle: { name:'Винтовка', icon:'🎯', dmg:35, fireRate:0.9, bulletSpeed:750, range:400, pellets:1, spread:0, pierce:2, color:'#a78bfa' },
  laser: { name:'Лазер', icon:'🔴', dmg:14, fireRate:0.4, bulletSpeed:900, range:340, pellets:1, spread:0, pierce:3, color:'#f87171' },
  flame: { name:'Огнемёт', icon:'🔥', dmg:5, fireRate:0.06, bulletSpeed:280, range:140, pellets:1, spread:0.25, pierce:0, color:'#f97316', elemental:'fire' },
  plasma: { name:'Плазма', icon:'💠', dmg:20, fireRate:0.5, bulletSpeed:600, range:300, pellets:1, spread:0, pierce:1, color:'#22d3ee', elemental:'shock' },
  railgun: { name:'Рельса', icon:'⚡', dmg:80, fireRate:1.4, bulletSpeed:1400, range:600, pellets:1, spread:0, pierce:8, color:'#e879f9' }
};
const CLASSES = {
  soldier: { name:'Солдат', desc:'Баланс', weapon:'pistol', hp:100, speed:170, dmg:1, rate:1, color:'#4ade80' },
  tank: { name:'Танк', desc:'Танк', weapon:'shotgun', hp:180, speed:130, dmg:1.15, rate:1.1, color:'#60a5fa' },
  scout: { name:'Разведчик', desc:'Быстрый', weapon:'smg', hp:70, speed:220, dmg:0.85, rate:0.9, color:'#facc15' },
  sniper: { name:'Снайпер', desc:'Урон', weapon:'rifle', hp:75, speed:150, dmg:1.3, rate:1.2, color:'#a855f7' }
};
const ZOMBIES = {
  walker: { hp:30, speed:55, dmg:8, r:14, color:'#ef4444', score:10 },
  runner: { hp:18, speed:115, dmg:6, r:12, color:'#f59e0b', score:15 },
  brute: { hp:85, speed:40, dmg:16, r:20, color:'#a855f7', score:25 },
  spitter: { hp:40, speed:45, dmg:8, r:15, color:'#22c55e', score:20, ranged:true, range:230, projSpeed:260 },
  exploder: { hp:26, speed:80, dmg:12, r:14, color:'#f97316', score:20, explodes:true, exRad:80 },
  flyer: { hp:14, speed:105, dmg:5, r:11, color:'#f472b6', score:18, flying:true },
  kamikaze: { hp:22, speed:140, dmg:20, r:12, color:'#dc2626', score:22, kamikaze:true },
  necro: { hp:55, speed:35, dmg:10, r:16, color:'#8b5cf6', score:40, necro:true, range:220 },
  crusher: { hp:120, speed:60, dmg:20, r:18, color:'#94a3b8', score:35 },
  spider: { hp:15, speed:160, dmg:7, r:10, color:'#fb7185', score:25 },
  armored: { hp:150, speed:30, dmg:12, r:16, color:'#64748b', score:45, dmgRed:0.5 }
};
const BOSSES = [
  { name:'Громила', color:'#dc2626', r:40, speed:60, dmg:12, hp:1500, attacks:['charge','summon'] },
  { name:'Чумной', color:'#16a34a', r:44, speed:50, dmg:10, hp:1800, attacks:['radial','spray'] },
  { name:'Фантом', color:'#7c3aed', r:38, speed:85, dmg:9, hp:2200, attacks:['teleport','homing'] },
  { name:'Мясник', color:'#be123c', r:48, speed:55, dmg:14, hp:3000, attacks:['charge','radial'] },
  { name:'Некромант', color:'#8b5cf6', r:46, speed:45, dmg:12, hp:3500, attacks:['summon','homing'] },
  { name:'Мать', color:'#ec4899', r:42, speed:70, dmg:11, hp:2500, attacks:['summon'], spawner:true },
  { name:'Кибердемон', color:'#06b6d4', r:42, speed:75, dmg:15, hp:2800, attacks:['spray','charge'] },
  { name:'Слизь', color:'#84cc16', r:36, speed:40, dmg:8, hp:2000, attacks:['radial'] },
  { name:'НЕКРОЛОРД', color:'#eab308', r:60, speed:65, dmg:18, hp:8000, attacks:['charge','radial','summon','homing','spray'], final:true }
];
const MAPS = {
  forest: { name:'Лес', desc:'Поляны и деревья', icon:'🌲', ground:'#0a1410', grid:'#15803d', price:0 },
  industrial: { name:'Завод', desc:'Цеха и ящики', icon:'🏭', ground:'#0f1014', grid:'#334155', price:0 },
  desert: { name:'Пустошь', desc:'Руины и кости', icon:'🏜️', ground:'#1a1410', grid:'#78350f', price:500 },
  city: { name:'Город', desc:'Улицы и дома', icon:'🏙️', ground:'#14161a', grid:'#475569', price:1000 }
};
const UPGRADES = [
  { id:'dmg1', name:'Урон +10%', desc:'Сильнее', rarity:'common', apply:p=>p.dmgMult*=1.1 },
  { id:'rate1', name:'Скорость +10%', desc:'Быстрее', rarity:'common', apply:p=>p.rateMult*=0.9 },
  { id:'spd1', name:'Бег +8%', desc:'Шустрее', rarity:'common', apply:p=>p.speed*=1.08 },
  { id:'hp1', name:'HP +15', desc:'Живучесть', rarity:'common', apply:p=>{p.maxHp+=15;p.hp+=15;} },
  { id:'rng1', name:'Радиус +30', desc:'Дальше', rarity:'common', apply:p=>p.rangeBonus+=30 },
  { id:'dmg2', name:'Урон +20%', desc:'Мощнее', rarity:'rare', apply:p=>p.dmgMult*=1.2 },
  { id:'rate2', name:'Скорость +20%', desc:'Шквал', rarity:'rare', apply:p=>p.rateMult*=0.8 },
  { id:'hp2', name:'HP +30', desc:'Толще', rarity:'rare', apply:p=>{p.maxHp+=30;p.hp+=30;} },
  { id:'heal', name:'Лечение', desc:'+50 HP', rarity:'rare', apply:p=>p.hp=Math.min(p.maxHp,p.hp+50) },
  { id:'pierce', name:'Пробивание', desc:'Навылет', rarity:'rare', apply:p=>p.pierce+=1 },
  { id:'mag', name:'Магнит', desc:'Сбор', rarity:'rare', apply:p=>p.pickupRange+=50 },
  { id:'dash', name:'Dash -30%', desc:'Рывок', rarity:'rare', apply:p=>p.dashCdMax*=0.7 },
  { id:'fire', name:'Огонь', desc:'Поджог', rarity:'epic', apply:p=>p.elements.fire=true },
  { id:'ice', name:'Лёд', desc:'Заморозка', rarity:'epic', apply:p=>p.elements.ice=true },
  { id:'dmg3', name:'Урон +40%', desc:'Убийца', rarity:'epic', apply:p=>p.dmgMult*=1.4 },
  { id:'vamp', name:'Вампиризм', desc:'+2 HP', rarity:'epic', apply:p=>p.vamp+=2 },
  { id:'multi', name:'Мультивыстрел', desc:'+1 пуля', rarity:'epic', apply:p=>p.extraPellets+=1 },
  { id:'expl', name:'Разрывные', desc:'Взрыв', rarity:'epic', apply:p=>p.explosive=true },
  { id:'wep', name:'Смена оружия', desc:'Рулетка', rarity:'epic', apply:p=>{} },
  { id:'shld', name:'Щит', desc:'Блок урона', rarity:'epic', apply:p=>p.shieldRegen=8 }
];

// ==========================================
// УТИЛИТЫ И ЗВУК
// ==========================================
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rand = (a,b)=>a+Math.random()*(b-a);
function shade(hex, amt) { const n=parseInt(hex.slice(1),16); let r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&0xff)+amt,0,255),b=clamp((n&0xff)+amt,0,255); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); }
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}
function vibrate(ms){if(settings.vibe&&navigator.vibrate)navigator.vibrate(ms);}

let actx=null;
function initAudio(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function sfx(freq, type='square', dur=0.1, vol=0.05){
  if(!actx||!settings.sound)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.4,actx.currentTime+dur);
  g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
}

// ==========================================
// ИНИЦИАЛИЗАЦИЯ ИГРОКА И МИРА
// ==========================================
function makePlayer(key){
  const c=CLASSES[key];
  const p={class:key, weapon:c.weapon, x:0,y:0,r:14,hp:c.hp,maxHp:c.hp,speed:c.speed,
    dmgMult:1,rateMult:1,rangeBonus:0,extraPellets:0,pierce:0,pickupRange:28,vamp:0,
    explosive:false,elements:{},fireCd:0,lastAim:0,dashCd:0,dashCdMax:2.5,dashTime:0,dashDir:{x:0,y:0},
    grenades:3,grenadeMax:3,grenadeCd:0,shield:0,shieldRegen:0,shieldCd:0,rageTimer:0};
  if(meta.ownedPerks.includes('hp')){p.maxHp+=20;p.hp+=20;}
  if(meta.ownedPerks.includes('dmg'))p.dmgMult*=1.1;
  if(meta.ownedPerks.includes('spd'))p.speed*=1.1;
  return p;
}

function generateObstacles(mapKey, world){
  const obs=[]; const cx=world.w/2, cy=world.h/2;
  const add=(o)=>{
    const ox=o.shape==='rect'?o.x+o.w/2:o.x, oy=o.shape==='rect'?o.y+o.h/2:o.y;
    const rT=o.shape==='rect'?Math.max(o.w,o.h)/2:o.r;
    if(Math.hypot(cx-ox,cy-oy)<rT+150)return false;
    for(const e of obs){const eox=e.shape==='rect'?e.x+e.w/2:e.x,eoy=e.shape==='rect'?e.y+e.h/2:e.y,rO=e.shape==='rect'?Math.max(e.w,e.h)/2:e.r;if(Math.hypot(eox-ox,eoy-oy)<rO+rT+40)return false;}
    obs.push(o);return true;
  };
  if(mapKey==='city'){
    const bx=[100,400,700,1000], by=[100,400,700,1000];
    for(let x of bx)for(let y of by)if(Math.random()<0.7)add({shape:'rect',kind:'building',w:rand(120,180),h:rand(100,160),x:x+rand(0,40),y:y+rand(0,40),hp:500,maxHp:500});
    for(let i=0;i<10;i++)add({shape:'rect',kind:'car',w:70,h:35,x:rand(200,1000),y:rand(200,1000),hp:100,maxHp:100});
  } else if(mapKey==='forest'){
    for(let i=0;i<30;i++)add({shape:'circle',kind:'tree',r:rand(25,40),x:rand(0,world.w),y:rand(0,world.h),seed:Math.random()*100,hp:50,maxHp:50});
    for(let i=0;i<15;i++)add({shape:'circle',kind:'bush',r:rand(15,25),x:rand(0,world.w),y:rand(0,world.h),hp:10,maxHp:10});
  } else if(mapKey==='desert'){
    add({shape:'rect',kind:'ruins',w:150,h:100,x:world.w/2-150,y:world.h/2-100,hp:200,maxHp:200});
    add({shape:'rect',kind:'ruins',w:100,h:120,x:world.w/2+50,y:world.h/2+20,hp:200,maxHp:200});
    for(let i=0;i<20;i++)add({shape:'circle',kind:'cactus',r:rand(15,25),x:rand(0,world.w),y:rand(0,world.h),seed:Math.random()*100,hp:30,maxHp:30});
  } else if(mapKey==='industrial'){
    for(let i=0;i<4;i++){
      add({shape:'rect',kind:'machine',w:120,h:80,x:200+i*250,y:150,hp:150,maxHp:150});
      add({shape:'rect',kind:'machine',w:120,h:80,x:200+i*250,y:600,hp:150,maxHp:150});
    }
    for(let i=0;i<15;i++)add({shape:'circle',kind:'barrel',r:rand(15,20),x:rand(100,world.w-100),y:rand(100,world.h-100),hp:20,maxHp:20,fuel:true});
  }
  return obs;
}

function buildBackground() {
  bgCanvas.width = game.world.w; bgCanvas.height = game.world.h;
  const m = MAPS[game.mapKey];
  bgCtx.fillStyle = m.ground; bgCtx.fillRect(0, 0, game.world.w, game.world.h);
  // Пиксельная сетка
  bgCtx.fillStyle = m.grid; bgCtx.globalAlpha = 0.1;
  for (let x = 0; x < game.world.w; x += 40) for (let y = 0; y < game.world.h; y += 40) bgCtx.fillRect(x, y, 20, 20);

}

function startGame(mapKey, classKey){
  ['startScreen','mapScreen','mutatorScreen'].forEach(id=>document.getElementById(id).classList.add('hidden'));

  if(game.selectedMutators.includes('oneshot')){p.hp=1;p.maxHp=1;p.dmgMult*=5;}

    wave:1, score:0, kills:0, damageDealt:0, bestCombo:0, combo:0, comboTimer:0, comboMult:1,

  });

function startWave(){
  game.waveActive=true; game.waveBanner=2.5; game.activeMods=[];
  let mc = game.wave>=30?3 : game.wave>=20?2 : game.wave>=10?1 : 0;
  if(game.wave % 5 === 0){
    const bc = game.wave>=35?3 : game.wave>=25?2 : 1;
    game.spawnQueue = 3 + Math.floor(game.wave/3);
    spawnBosses(bc);
    game.waveTimer = 0;
  } else {
    game.spawnQueue = 5 + game.wave * 2;
    game.waveTimer = 45;
  }
  game.spawnTimer=0.6;
}

function endWave(){
  game.waveActive=false; game.score+=100+game.wave*10;
  const bg=Math.floor(game.score/150)+Math.floor(game.kills/2);
  meta.blood+=bg; meta.kills+=game.kills; meta.bestWave=Math.max(meta.bestWave,game.wave);
  saveMeta();

    game.obstacles = JSON.parse(JSON.stringify(game.originalObstacles)); // Восстановление карты
    toast('Карта восстановлена!');

}

function gameOver(win){

// ==========================================
// ФИЗИКА И КОЛЛИЗИИ
// ==========================================
function collides(x,y,r,obs){for(const o of obs){if(o.destroyed)continue; if(o.shape==='rect'){if(x>o.x-r&&x<o.x+o.w+r&&y>o.y-r&&y<o.y+o.h+r)return true;}else{if(Math.hypot(x-o.x,y-o.y)<r+o.r)return true;}}return false;}
function pushOut(ent,obs){
  for(const o of obs){if(o.destroyed)continue;
    if(o.shape==='rect'){
      const nx=clamp(ent.x,o.x,o.x+o.w), ny=clamp(ent.y,o.y,o.y+o.h), dx=ent.x-nx, dy=ent.y-ny, d=Math.hypot(dx,dy);
      if(d<ent.r){ if(d>0.01){ent.x=nx+dx/d*ent.r;ent.y=ny+dy/d*ent.r;} }
    }else{
      const dx=ent.x-o.x, dy=ent.y-o.y, d=Math.hypot(dx,dy), md=ent.r+o.r;
      if(d<md&&d>0.01){ent.x=o.x+dx/d*md;ent.y=o.y+dy/d*md;}
    }
  }
}
function hasLOS(x1,y1,x2,y2,obs){
  const dist=Math.hypot(x2-x1,y2-y1), steps=Math.ceil(dist/10);
  for(let i=1;i<steps;i++){
    const t=i/steps, px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
    for(const o of obs){if(o.destroyed)continue; if(o.shape==='rect'){if(px>o.x&&px<o.x+o.w&&py>o.y&&py<o.y+o.h)return false;}else{if(Math.hypot(px-o.x,py-o.y)<o.r)return false;}}
  }
  return true;
}
function moveEnemy(z,dx,dy,speed,dt){
  const a=Math.atan2(dy,dx), st=speed*dt;
  let mx=Math.cos(a)*st, my=Math.sin(a)*st;
  if(!z.flying&&collides(z.x+mx,z.y+my,z.r,game.obstacles)){
    const angs=[0.5,-0.5,1,-1,1.5,-1.5,Math.PI]; let f=false;
    for(const o of angs){const ta=a+o, tx=Math.cos(ta)*st, ty=Math.sin(ta)*st; if(!collides(z.x+tx,z.y+ty,z.r,game.obstacles)){mx=tx;my=ty;f=true;break;}}
    if(!f){mx=0;my=0;}
  }
  z.x+=mx; z.y+=my;
  if(!z.flying)pushOut(z,game.obstacles);
  z.x=clamp(z.x,z.r,game.world.w-z.r); z.y=clamp(z.y,z.r,game.world.h-z.r);
}

function particles(x,y,n,color){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, sp=rand(30,150); game.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(0.3,0.8),max:0.8,size:rand(2,5),color});}}
function dmgNum(x,y,dmg,color='#fff'){game.damageNumbers.push({x,y,dmg:Math.round(dmg),life:0.8,vy:-60,vx:rand(-30,30),color});}
function explode(x,y,rad,dmg,color){
  for(const z of game.zombies){if(z.type==='boss')continue; if(Math.hypot(z.x-x,z.y-y)<rad){z.hp-=dmg*(1-Math.hypot(z.x-x,z.y-y)/rad*0.5);z.hitFlash=0.1;}}
  for(const o of game.obstacles){if(o.destroyed)continue; const ox=o.shape==='rect'?o.x+o.w/2:o.x, oy=o.shape==='rect'?o.y+o.h/2:o.y; if(Math.hypot(ox-x,oy-y)<rad+20){o.hp-=dmg; if(o.hp<=0){o.destroyed=true;particles(ox,oy,20,'#9ca3af');}}}
  particles(x,y,25,color||'#f97316'); game.screenShake=Math.min(game.screenShake+8,16); sfx(150,'sawtooth',0.2,0.1);
}

const joy={active:false,id:null,bx:0,by:0,dx:0,dy:0,maxR:60};
const dashBtn={x:0,y:0,r:44}, grenBtn={x:0,y:0,r:44};
function updateBtns(){joy.maxR=settings.joySize; dashBtn.x=W-80; dashBtn.y=H-130; grenBtn.x=W-80; grenBtn.y=H-220;}
updateBtns();

function jStart(x,y,id){if(joy.active)return; joy.active=true; joy.id=id; joy.bx=x; joy.by=y; joy.dx=0; joy.dy=0;}
function jMove(x,y){const dx=x-joy.bx, dy=y-joy.by, d=Math.hypot(dx,dy); if(d>1){const cl=Math.min(d,joy.maxR); joy.dx=(dx/d)*(cl/joy.maxR); joy.dy=(dy/d)*(cl/joy.maxR);}else{joy.dx=0;joy.dy=0;}}
function jEnd(){joy.active=false; joy.id=null; joy.dx=0; joy.dy=0;}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); initAudio();
  for(const t of e.changedTouches){
    if(game.running && Math.hypot(t.clientX-(W-36), t.clientY-100)<30){ togglePause(); return; }
    if(Math.hypot(t.clientX-dashBtn.x, t.clientY-dashBtn.y)<dashBtn.r+10){doDash(); continue;}
    if(Math.hypot(t.clientX-grenBtn.x, t.clientY-grenBtn.y)<grenBtn.r+10){throwGrenade(); continue;}
    if(t.clientX<W*0.55 && !joy.active)jStart(t.clientX,t.clientY,t.identifier);
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault(); for(const t of e.changedTouches)if(t.identifier===joy.id)jMove(t.clientX,t.clientY);},{passive:false});
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id)jEnd();});
canvas.addEventListener('mousedown',e=>{
  initAudio();
  if(game.running && Math.hypot(e.clientX-(W-36), e.clientY-100)<30){ togglePause(); return; }
  if(Math.hypot(e.clientX-dashBtn.x, e.clientY-dashBtn.y)<dashBtn.r+10){doDash(); return;}
  if(Math.hypot(e.clientX-grenBtn.x, e.clientY-grenBtn.y)<grenBtn.r+10){throwGrenade(); return;}
  if(e.clientX<W*0.55)jStart(e.clientX,e.clientY,'m');
});
canvas.addEventListener('mousemove',e=>{if(joy.active)jMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>jEnd());
window.addEventListener('keydown',e=>{if(e.key===' '&&game.running&&!game.paused){e.preventDefault();doDash();} if(e.key==='Escape'&&game.running)togglePause();});

function doDash(){
  const p=game.player; if(!p||p.dashCd>0||p.dashTime>0)return;
  let dx=joy.dx,dy=joy.dy; if(!dx&&!dy){dx=Math.cos(p.lastAim);dy=Math.sin(p.lastAim);}
  const d=Math.hypot(dx,dy)||1; p.dashDir={x:dx/d,y:dy/d}; p.dashTime=0.22; p.dashCd=p.dashCdMax; vibrate(15);
}
function throwGrenade(){
  const p=game.player; if(!p||p.grenades<=0||p.grenadeCd>0)return;
  p.grenades--; p.grenadeCd=0.8;
  game.pickups.push({kind:'grenade',x:p.x,y:p.y,vx:Math.cos(p.lastAim)*400,vy:Math.sin(p.lastAim)*400,r:8,life:1.5,fuse:1.2});
}

// ==========================================
// ОБНОВЛЕНИЕ (UPDATE)
// ==========================================
function update(dt){
  const p=game.player, c=CLASSES[p.class], w=WEAPONS[p.weapon];
  const mods=game.activeMods.map(m=>m.id);
  
  if(game.waveBanner>0)game.waveBanner-=dt;
  if(game._hitTimer>0)game._hitTimer-=dt;
  if(p.rageTimer>0)p.rageTimer-=dt;
  p.dashCd=Math.max(0,p.dashCd-dt); p.grenadeCd=Math.max(0,p.grenadeCd-dt);

  // Атмосфера и урон
  if(Math.random()<0.1 && game.ambient.length<40){game.ambient.push({x:camera.x+rand(0,W),y:camera.y+H+10,vx:rand(-20,20),vy:rand(-40,-10),life:5,size:rand(2,4),color:MAPS[game.mapKey].grid});}
  for(let i=game.ambient.length-1;i>=0;i--){const a=game.ambient[i];a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;if(a.life<=0)game.ambient.splice(i,1);}
  for(let i=game.damageNumbers.length-1;i>=0;i--){const d=game.damageNumbers[i];d.x+=d.vx*dt;d.y+=d.vy*dt;d.life-=dt;if(d.life<=0)game.damageNumbers.splice(i,1);}

  // Движение игрока
  if(p.dashTime>0){p.dashTime-=dt;p.x+=p.dashDir.x*800*dt;p.y+=p.dashDir.y*800*dt;pushOut(p,game.obstacles);}
  else if(joy.active){p.x+=joy.dx*p.speed*dt;p.y+=joy.dy*p.speed*dt;pushOut(p,game.obstacles);}
  p.x=clamp(p.x,p.r,game.world.w-p.r); p.y=clamp(p.y,p.r,game.world.h-p.r);

  // Щит
  if(p.shieldRegen>0){p.shieldCd-=dt;if(p.shieldCd<=0&&p.shield===0){p.shield=1;p.shieldCd=p.shieldRegen;}}

  // Камера
  camera.tx=clamp(p.x-W/2,0,game.world.w-W); camera.ty=clamp(p.y-H/2,0,game.world.h-H);
  camera.x+=(camera.tx-camera.x)*Math.min(1,dt*8); camera.y+=(camera.ty-camera.y)*Math.min(1,dt*8);

  // Стрельба
  p.fireCd-=dt;
  if(p.fireCd<=0){
    let near=null,nd=Infinity;
    for(const z of game.zombies){const d=Math.hypot(z.x-p.x,z.y-p.y); if(d<nd&&d<(w.range+p.rangeBonus)&&hasLOS(p.x,p.y,z.x,z.y,game.obstacles)){nd=d;near=z;}}
    if(near){
      p.fireCd=(w.fireRate*c.rate)/p.rateMult;
      const baseAng=Math.atan2(near.y-p.y,near.x-p.x); p.lastAim=baseAng;
      sfx(w.pierce>0?800:500, 'square', 0.05, 0.05);
      const crit=Math.random()<0.1, dmgMul=crit?2:1;
      for(let i=0;i<w.pellets+p.extraPellets;i++){
        const ang=baseAng+rand(-w.spread,w.spread)/2;
        game.bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*w.bulletSpeed,vy:Math.sin(ang)*w.bulletSpeed,dmg:w.dmg*c.dmg*p.dmgMult*dmgMul,color:crit?'#fff':w.color,crit,dist:0,maxDist:(w.range+p.rangeBonus)*1.1,pierce:w.pierce+p.pierce,hitIds:[],explosive:p.explosive,element:w.elemental});
      }
    }
  }

  // Пули
  for(let i=game.bullets.length-1;i>=0;i--){
    const b=game.bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.dist+=Math.hypot(b.vx,b.vy)*dt;
    let dead = b.dist>b.maxDist || b.x<0 || b.x>game.world.w || b.y<0 || b.y>game.world.h;
    if(!dead){ for(const o of game.obstacles){if(o.destroyed||!o.hp)continue; if(collides(b.x,b.y,2,[o])){o.hp-=b.dmg;dead=true;particles(b.x,b.y,3,'#fff');break;}} }
    if(!dead){ for(const z of game.zombies){ if(b.hitIds.includes(z.id))continue; if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+4){
      b.hitIds.push(z.id); let dmg=b.dmg; if(z.dmgRed)dmg*=(1-z.dmgRed);
      z.hp-=dmg; z.hitFlash=0.08; dmgNum(z.x,z.y-z.r,dmg,b.crit?'#fbbf24':'#fff');
      if(b.explosive)explode(b.x,b.y,50,b.dmg*0.5);
      if(b.pierce>0)b.pierce--; else {dead=true; break;}
    }}}
    if(dead)game.bullets.splice(i,1);
  }

  // Зомби и Боссы
  for(let i=game.zombies.length-1;i>=0;i--){
    const z=game.zombies[i];
    if(z.type==='boss'){ updateBoss(z,dt,p); }
    else {
      const dx=p.x-z.x, dy=p.y-z.y, d=Math.hypot(dx,dy)||1;
      if(d<z.r+p.r+2){ if(z.atkCd<=0){z.atkCd=mods.includes('frenzy')?0.3:0.6; hurtPlayer(z.dmg*(game.selectedMutators.includes('double')?2:1));} }
      else if(z.ranged && d<z.range && hasLOS(z.x,z.y,p.x,p.y,game.obstacles)){ if(z.atkCd<=0){z.atkCd=2; game.enemyBullets.push({x:z.x,y:z.y,vx:(dx/d)*z.projSpeed,vy:(dy/d)*z.projSpeed,dmg:z.dmg,color:z.color,dist:0,max:500});} }
      else { moveEnemy(z,dx,dy,z.speed,dt); }
    }
    z.hitFlash=Math.max(0,z.hitFlash-dt);
    if(z.hp<=0){
      game.zombies.splice(i,1); game.kills++; game.score+=z.score; particles(z.x,z.y,15,z.color);
      game.bloodDecals.push({x:z.x,y:z.y,r:z.r,life:15}); if(game.bloodDecals.length>150)game.bloodDecals.shift();
      if(z.type==='boss'){
        game.bosses=game.bosses.filter(b=>b.id!==z.id); game.screenShake=20;
        for(let k=0;k<5;k++)game.pickups.push({kind:'grenade',x:z.x+rand(-40,40),y:z.y+rand(-40,40),r:8,life:20});
        if(z.final)setTimeout(()=>gameOver(true),1500);
      } else if(Math.random()<0.15) game.pickups.push({kind:'hp',x:z.x,y:z.y,r:8,life:12});
    }
  }

  // Вражеские снаряды, пикапы, частицы
  for(let i=game.enemyBullets.length-1;i>=0;i--){const b=game.enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.dist+=Math.hypot(b.vx,b.vy)*dt; if(b.dist>b.max||Math.hypot(b.x-p.x,b.y-p.y)<p.r+5){if(b.dist<=b.max)hurtPlayer(b.dmg);game.enemyBullets.splice(i,1);}}
  for(let i=game.pickups.length-1;i>=0;i--){const pk=game.pickups[i];pk.life-=dt; if(pk.kind==='grenade'){pk.x+=pk.vx*dt;pk.y+=pk.vy*dt;pk.fuse-=dt;if(pk.fuse<=0){explode(pk.x,pk.y,120,80);game.pickups.splice(i,1);}continue;}
    if(Math.hypot(p.x-pk.x,p.y-pk.y)<p.r+pk.r){ if(pk.kind==='hp'){p.hp=Math.min(p.maxHp,p.hp+25);} sfx(600,'sine',0.1,0.05); game.pickups.splice(i,1);continue;}
    if(Math.hypot(p.x-pk.x,p.y-pk.y)<p.pickupRange+p.r) {pk.x+=(p.x-pk.x)*dt*5; pk.y+=(p.y-pk.y)*dt*5;}
    if(pk.life<=0)game.pickups.splice(i,1);
  }
  for(let i=game.particles.length-1;i>=0;i--){const pt=game.particles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;if(pt.life<=0)game.particles.splice(i,1);}
  for(let i=game.bloodDecals.length-1;i>=0;i--){game.bloodDecals[i].life-=dt;if(game.bloodDecals[i].life<=0)game.bloodDecals.splice(i,1);}

  game.screenShake*=0.88;
  if(game.waveActive){
    if(game.spawnQueue>0){game.spawnTimer-=dt; if(game.spawnTimer<=0){game.spawnTimer=0.4;game.spawnQueue--;spawnZombie();}}
    else if(game.zombies.length===0)endWave();
  }
  if(game.waveTimer>0){game.waveTimer-=dt; if(game.waveTimer<=0){game.waveTimer=0;for(let i=0;i<20;i++)spawnZombie();}}
  if(p.hp<=0){p.hp=0; gameOver(false);}
}

function hurtPlayer(dmg){
  const p=game.player;
  if(p.shield>0){p.shield=0;particles(p.x,p.y,10,'#60a5fa');}
  else{p.hp-=dmg; sfx(150,'sawtooth',0.15,0.1); vibrate(20);}
  game.screenShake=Math.min(game.screenShake+6,14); game._hitTimer=1; particles(p.x,p.y,8,'#f87171');
}

function updateBoss(b,dt,p){
  b.hitFlash=Math.max(0,b.hitFlash-dt); b.contactCd-=dt;
  if(!b.enraged && b.hp/b.maxHp<0.35){b.enraged=true;b.speed*=1.3;b.atkCd=0.5;particles(b.x,b.y,30,'#fbbf24');}
  if(b.state==='idle'){
    const dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy)||1;
    if(d<b.r+p.r+5){ if(b.contactCd<=0){b.contactCd=0.8;hurtPlayer(b.dmg);} }
    else moveEnemy(b,dx,dy,b.speed,dt);
    b.atkCd-=dt; if(b.atkCd<=0){ startBossAtk(b,p); }
  } else if(b.state==='charge'){
    b.stateTimer-=dt; b.x+=b.cdx*400*dt; b.y+=b.cdy*400*dt;
    // Ломает здания
    for(const o of game.obstacles){if(!o.destroyed && collides(b.x,b.y,b.r,[o])){o.hp-=100*dt; if(o.hp<=0){o.destroyed=true;particles(b.x,b.y,20,'#9ca3af');game.screenShake=10;}}}
    if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r){hurtPlayer(b.dmg*1.5);b.state='idle';b.atkCd=2;}
    if(b.stateTimer<=0){b.state='idle';b.atkCd=2;}
  }
}
function startBossAtk(b,p){
  const atk=b.attackSet[Math.floor(Math.random()*b.attackSet.length)];
  if(atk==='charge'){const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;b.cdx=dx/d;b.cdy=dy/d;b.state='charge';b.stateTimer=0.8;}
  else if(atk==='radial'){for(let i=0;i<16;i++){const a=i/16*Math.PI*2;game.enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,dmg:5,color:b.color,dist:0,max:600});} b.atkCd=3;}
  else if(atk==='spray'){const ang=Math.atan2(p.y-b.y,p.x-b.x);for(let i=-2;i<=2;i++){game.enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(ang+i*0.15)*280,vy:Math.sin(ang+i*0.15)*280,dmg:7,color:b.color,dist:0,max:600});} b.atkCd=2.5;}
  else b.atkCd=1.5;
}

// ==========================================
// ГРАФИКА (ПИКСЕЛЬНЫЙ СТИЛЬ)

function drawPixelCircle(x, y, r, color) {
  ctx.fillStyle = color;
  const step = 4; 
  for (let i = -r; i <= r; i += step) {
    for (let j = -r; j <= r; j += step) {
      if (i*i + j*j <= r*r) ctx.fillRect(x + i, y + j, step, step);
    }
  }
}

function drawObstacle(o){
  if(o.destroyed){ctx.fillStyle='rgba(0,0,0,0.2)';if(o.shape==='rect')ctx.fillRect(o.x,o.y,o.w,o.h);return;}
  const cx=o.shape==='rect'?o.x+o.w/2:o.x, cy=o.shape==='rect'?o.y+o.h/2:o.y;
  const r=o.shape==='rect'?Math.max(o.w,o.h)/2:o.r;
  if(cx+r<camera.x||cx-r>camera.x+W||cy+r<camera.y||cy-r>camera.y+H)return;

  ctx.fillStyle='rgba(0,0,0,0.4)';
  if(o.shape==='rect')ctx.fillRect(o.x+5,o.y+5,o.w,o.h);
  else drawPixelCircle(o.x+5,o.y+5,o.r,'rgba(0,0,0,0.4)');

  if(o.kind==='building'){
    ctx.fillStyle='#1e293b';ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#334155';for(let x=o.x+10;x<o.x+o.w-10;x+=20)for(let y=o.y+10;y<o.y+o.h-10;y+=20)ctx.fillRect(x,y,12,12);
    ctx.strokeStyle='#0f172a';ctx.lineWidth=4;ctx.strokeRect(o.x,o.y,o.w,o.h);
  } else if(o.kind==='car'){
    ctx.fillStyle='#64748b';ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#1e293b';ctx.fillRect(o.x+10,o.y+5,o.w-20,o.h-10);
    ctx.fillStyle='#94a3b8';ctx.fillRect(o.x+5,o.y+5,8,8);ctx.fillRect(o.x+o.w-13,o.y+5,8,8);
  } else if(o.kind==='tree'){
    ctx.fillStyle='#3b2412';ctx.fillRect(o.x-o.r*0.2,o.y,o.r*0.4,o.r*0.8);
    drawPixelCircle(o.x,o.y-o.r*0.2,o.r,'#15803d');
    drawPixelCircle(o.x,o.y-o.r*0.4,o.r*0.7,'#22c55e');
    drawPixelCircle(o.x-o.r*0.2,o.y-o.r*0.5,o.r*0.3,'#4ade80');
  } else if(o.kind==='ruins'){
    ctx.fillStyle='#78716c';ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#44403c';for(let i=0;i<6;i++)ctx.fillRect(o.x+Math.random()*o.w,o.y+Math.random()*o.h,15,15);
    ctx.strokeStyle='#292524';ctx.lineWidth=3;ctx.strokeRect(o.x,o.y,o.w,o.h);
  } else if(o.kind==='machine'){
    ctx.fillStyle='#475569';ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#1e293b';for(let i=0;i<4;i++)ctx.fillRect(o.x+10,o.y+10+i*15,o.w-20,8);
    ctx.fillStyle='#4ade80';ctx.fillRect(o.x+o.w-15,o.y+10,5,5);ctx.fillStyle='#ef4444';ctx.fillRect(o.x+o.w-15,o.y+20,5,5);
  } else if(o.kind==='cactus'){
    ctx.fillStyle='#166534';ctx.fillRect(o.x-o.r*0.4,o.y-o.r,o.r*0.8,o.r*2);
    ctx.fillRect(o.x-o.r,o.y-o.r*0.4,o.r*0.6,o.r*0.8);ctx.fillRect(o.x+o.r*0.4,o.y,o.r*0.6,o.r*0.8);
  } else {
    drawPixelCircle(o.x,o.y,o.r,o.kind==='rock'?'#64748b':(o.kind==='barrel'?'#dc2626':'#166534'));
  }
}

function drawPlayer(p){
  const c=CLASSES[p.class]; const skin=meta.activeSkin;
  const color = skin==='default' ? c.color : (skin==='gold'?'#fbbf24':skin==='shadow'?'#374151':'#22d3ee');
  const bob = joy.active ? Math.sin(performance.now()/100)*2 : 0;
  
  if(p.dashTime>0){ctx.globalAlpha=0.3;drawPixelCircle(p.x,p.y,p.r,color);ctx.globalAlpha=1;}
  if(p.shield>0){ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r+6,0,Math.PI*2);ctx.stroke();}

  // Тень
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(p.x-p.r,p.y+p.r*0.6,p.r*2,p.r*0.4);

  // Ноги
  ctx.fillStyle='#1e293b';ctx.fillRect(p.x-6,p.y+p.r*0.3,4,8);ctx.fillRect(p.x+2,p.y+p.r*0.3,4,8);
  // Тело
  drawPixelCircle(p.x,p.y+bob,p.r,color);
  // Глаза
  ctx.fillStyle='#000';ctx.fillRect(p.x-5,p.y+bob-4,3,3);ctx.fillRect(p.x+2,p.y+bob-4,3,3);
  // Оружие
  ctx.save();ctx.translate(p.x,p.y+bob);ctx.rotate(p.lastAim);
  ctx.fillStyle='#111827';ctx.fillRect(p.r, -3, 16, 6);
  if(p.fireCd>0.1){ctx.fillStyle='#fde047';ctx.fillRect(p.r+16,-5,6,10);}
  ctx.restore();
}

function drawZombie(z){
  if(z.type==='boss'){drawBoss(z);return;}
  const bob=Math.sin(performance.now()/200+z.id)*2;
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(z.x-z.r,z.y+z.r*0.6,z.r*2,z.r*0.4);
  drawPixelCircle(z.x,z.y+bob,z.r, z.hitFlash>0?'#fff':z.color);
  
  if(z.type==='brute'){ctx.fillStyle='#000';ctx.fillRect(z.x-z.r*0.6,z.y+bob-z.r*0.5,z.r*1.2,6);}
  else if(z.type==='runner'||z.type==='spider'){ctx.fillStyle='#000';ctx.fillRect(z.x-z.r,z.y+bob,z.r*2,2);}
  else if(z.type==='exploder'||z.type==='kamikaze'){
    const pl=0.5+Math.sin(performance.now()/100)*0.5;
    ctx.strokeStyle=`rgba(249,115,22,${pl})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(z.x,z.y+bob,z.r+4,0,Math.PI*2);ctx.stroke();
  }
  // Глаза
  ctx.fillStyle='#fde047';ctx.fillRect(z.x-z.r*0.5,z.y+bob-z.r*0.3,4,4);ctx.fillRect(z.x+z.r*0.3,z.y+bob-z.r*0.3,4,4);
}

function drawBoss(b){
  const bob=Math.sin(performance.now()/300)*4;
  const aura = b.enraged ? '#fbbf24' : b.color;
  
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(b.x-b.r,b.y+b.r*0.7,b.r*2,b.r*0.5);
  
  // Аура
  ctx.globalAlpha=0.3;drawPixelCircle(b.x,b.y+bob,b.r*1.5,aura);ctx.globalAlpha=1;
  // Тело
  drawPixelCircle(b.x,b.y+bob,b.r, b.hitFlash>0?'#fff':b.color);
  
  // Уникальные детали для каждого босса
  if(b.name==='НЕКРОЛОРД'){
    ctx.fillStyle='#fbbf24'; // Корона
    ctx.fillRect(b.x-b.r*0.8, b.y+bob-b.r-15, b.r*1.6, 10);
    ctx.fillRect(b.x-b.r*0.8, b.y+bob-b.r-25, 10, 10); ctx.fillRect(b.x-5, b.y+bob-b.r-25, 10, 10); ctx.fillRect(b.x+b.r*0.8-10, b.y+bob-b.r-25, 10, 10);
  } else if(b.name==='Кибердемон'){
    ctx.fillStyle='#1e293b';ctx.fillRect(b.x-b.r*0.6,b.y+bob-b.r*0.2,b.r*1.2,8);
    ctx.fillStyle='#ef4444';ctx.fillRect(b.x-b.r*0.4,b.y+bob-b.r*0.2,6,8);ctx.fillRect(b.x+b.r*0.2,b.y+bob-b.r*0.2,6,8);
  } else if(b.name==='Слизь'){
    ctx.fillStyle='rgba(132,204,22,0.8)';for(let i=0;i<5;i++)ctx.fillRect(b.x+Math.cos(i*1.7)*b.r*0.6, b.y+bob+Math.sin(i*2.3)*b.r*0.6, 8, 8);
  } else {
    ctx.fillStyle='#000';ctx.fillRect(b.x-b.r*0.6,b.y+bob-b.r*0.4,10,10);ctx.fillRect(b.x+b.r*0.6-10,b.y+bob-b.r*0.4,10,10);
    ctx.fillStyle='#ef4444';ctx.fillRect(b.x-b.r*0.5,b.y+bob-b.r*0.3,6,6);ctx.fillRect(b.x+b.r*0.5-6,b.y+bob-b.r*0.3,6,6);
  }
}

function drawHUD(){
  const p=game.player, w=WEAPONS[p.weapon];
  // HP
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(16,16,144,18);
  ctx.fillStyle=p.hp>p.maxHp*0.5?'#4ade80':p.hp>p.maxHp*0.25?'#facc15':'#f87171';
  ctx.fillRect(18,18,140*(p.hp/p.maxHp),14);
  ctx.fillStyle='#fff';ctx.font='bold 12px "Courier New"';ctx.fillText(`${Math.ceil(p.hp)}/${p.maxHp}`, 24, 30);
  
  ctx.fillStyle='#4ade80';ctx.font='bold 16px "Courier New"';ctx.fillText(`ВОЛНА ${game.wave}`, 16, 56);
  ctx.fillStyle='#9ca3af';ctx.font='12px "Courier New"';ctx.fillText(`${w.icon} ${w.name}  💣${p.grenades}`, 16, 74);
  
  // Очки
  ctx.textAlign='right'; ctx.fillStyle='#fff';ctx.font='bold 16px "Courier New"';
  ctx.fillText(`ОЧКИ: ${game.score}`, W-20, 30);
  ctx.font='12px "Courier New"';ctx.fillStyle='#9ca3af';
  ctx.fillText(`Убито: ${game.kills}`, W-20, 50);
  ctx.fillText(`Кровь: ${meta.blood}`, W-20, 68);
  ctx.textAlign='left';

  // Кнопка паузы
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(W-36,100,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(W-41,94,4,12);ctx.fillRect(W-33,94,4,12);

  // Боссы
  if(game.bosses.length>0){
    game.bosses.forEach((b,i)=>{
      const bw=Math.min(300,W*0.6), bx=(W-bw)/2, by=150+i*30;
      ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(bx,by,bw,16);
      ctx.fillStyle=b.enraged?'#fbbf24':b.color;ctx.fillRect(bx+2,by+2,(bw-4)*(b.hp/b.maxHp),12);
      ctx.fillStyle='#fff';ctx.font='10px "Courier New"';ctx.textAlign='center';ctx.fillText(b.name,W/2,by-4);ctx.textAlign='left';
    });
  }

  if(joy.active){
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.bx,joy.by,joy.maxR,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(74,222,128,0.6)';ctx.beginPath();ctx.arc(joy.bx+joy.dx*joy.maxR,joy.by+joy.dy*joy.maxR,24,0,Math.PI*2);ctx.fill();
  }
  
  // Кнопки Dash и Grenade
  ctx.fillStyle=p.dashCd<=0?'rgba(74,222,128,0.8)':'rgba(75,85,99,0.5)';
  ctx.beginPath();ctx.arc(dashBtn.x,dashBtn.y,dashBtn.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('➤',dashBtn.x,dashBtn.y);
  
  ctx.fillStyle=p.grenades>0?'rgba(251,191,36,0.8)':'rgba(75,85,99,0.5)';
  ctx.beginPath();ctx.arc(grenBtn.x,grenBtn.y,grenBtn.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.fillText('💣',grenBtn.x,grenBtn.y);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function draw(){
  ctx.fillStyle=MAPS[game.mapKey].ground; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(game.screenShake>0.5)ctx.translate(rand(-game.screenShake,game.screenShake),rand(-game.screenShake,game.screenShake));
  ctx.translate(-camera.x,-camera.y);

  ctx.drawImage(bgCanvas,0,0);

  // Кровь
  for(const bd of game.bloodDecals){ctx.fillStyle=`rgba(127,29,29,${Math.min(0.5,bd.life/15)})`;drawPixelCircle(bd.x,bd.y,bd.r,'rgba(127,29,29,'+Math.min(0.5,bd.life/15)+')');}
  
  for(const o of game.obstacles)drawObstacle(o);
  for(const pk of game.pickups){if(pk.kind==='hp'){drawPixelCircle(pk.x,pk.y,8,'#4ade80');}else if(pk.kind==='grenade'){drawPixelCircle(pk.x,pk.y,8,'#fbbf24');}}

  // Частицы
  for(const pt of game.particles){ctx.globalAlpha=Math.max(0,pt.life/pt.max);ctx.fillStyle=pt.color;ctx.fillRect(pt.x,pt.y,pt.size,pt.size);}ctx.globalAlpha=1;

  // Пули (свечение)
  ctx.globalCompositeOperation='lighter';
  for(const b of game.bullets){ctx.strokeStyle=b.color+'80';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x-b.vx*0.02,b.y-b.vy*0.02);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(b.x-2,b.y-2,4,4);}
  for(const b of game.enemyBullets){ctx.fillStyle=b.color;ctx.fillRect(b.x-4,b.y-4,8,8);}
  ctx.globalCompositeOperation='source-over';

  // Сущности
  const ents=[...game.zombies,game.player].sort((a,b)=>a.y-b.y);
  for(const e of ents){if(e===game.player)drawPlayer(e);else drawZombie(e);}

  ctx.restore();

  // Атмосфера
  ctx.globalCompositeOperation='lighter';
  for(const a of game.ambient){ctx.fillStyle=a.color;ctx.globalAlpha=Math.min(1,a.life/5)*0.3;ctx.fillRect(a.x-camera.x,a.y-camera.y,a.size,a.size);}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

  // Виньетка
  const grd=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.8);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,0.7)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  // Цифры урона
  ctx.textAlign='center';
  for(const d of game.damageNumbers){ctx.globalAlpha=Math.min(1,d.life*2);ctx.font='bold 16px "Courier New"';ctx.fillStyle=d.color;ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(d.dmg,d.x-camera.x,d.y-camera.y);ctx.fillText(d.dmg,d.x-camera.x,d.y-camera.y);}
  ctx.globalAlpha=1;ctx.textAlign='left';

  drawHUD();
}

// ==========================================
// UI И МЕНЮ
// ==========================================
function togglePause(){if(!game.running)return; game.paused=!game.paused; document.getElementById('pauseScreen').classList.toggle('hidden',!game.paused); if(game.paused)game.lastTime=0;}
function saveGameState(){if(!game.running)return; const data={...game, player:{...game.player, x:game.player.x, y:game.player.y}}; localStorage.setItem('zs_save',JSON.stringify(data)); toast('Сохранено'); quitToMenu();}
function loadGameState(){const d=localStorage.getItem('zs_save'); if(!d)return; try{const p=JSON.parse(d); document.getElementById('mainMenu').classList.add('hidden'); Object.assign(game,p); game.running=true;game.paused=false;game.lastTime=0; game.bullets=[];game.enemyBullets=[];game.particles=[]; game.player=Object.assign(makePlayer(game.player.class),game.player); camera.x=clamp(game.player.x-W/2,0,game.world.w-W);camera.y=clamp(game.player.y-H/2,0,game.world.h-H); buildBackground(); toast('Загружено');}catch(e){toast('Ошибка');localStorage.removeItem('zs_save');}}
function quitToMenu(){game.running=false;game.paused=false;game.player=null; ['pauseScreen','gameOverScreen','startScreen','upgradeScreen','settingsScreen','mutatorScreen','weaponScreen'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById('mainMenu').classList.remove('hidden'); showMainMenu();}
function showMainMenu(){document.getElementById('bloodDisplay').textContent=`Кровь: ${meta.blood}  •  Лучшая волна: ${meta.bestWave}`; document.getElementById('continueBtn').style.display=localStorage.getItem('zs_save')?'block':'none';}
function showMapSelect(){document.getElementById('mainMenu').classList.add('hidden');document.getElementById('mapScreen').classList.remove('hidden'); const l=document.getElementById('mapList');l.innerHTML=''; for(const[k,m]of Object.entries(MAPS)){const locked=!meta.unlockedMaps.includes(k);const b=document.createElement('button');b.className='card-btn'+(locked?' locked':'');b.innerHTML=`<div class="icon">${m.icon}</div><div><b>${m.name}</b><span>${m.desc}</span>${locked?`<div class="price">Открыть: ${m.price} 🩸</div>`:''}</div>`;b.onclick=()=>{if(locked){if(meta.blood>=m.price){meta.blood-=m.price;meta.unlockedMaps.push(k);saveMeta();toast('Открыто!');showMapSelect();}else toast('Мало крови');return;}selectedMap=k;showMutators();};l.appendChild(b);}}
function showMutators(){document.getElementById('mapScreen').classList.add('hidden');document.getElementById('mutatorScreen').classList.remove('hidden');const l=document.getElementById('mutatorList');l.innerHTML='';game.selectedMutators=[];for(const mu of [{id:'arena',name:'Арена',desc:'Без апгрейдов'},{id:'oneshot',name:'Стеклянная пушка',desc:'1 HP, х5 урон'},{id:'double',name:'Ад',desc:'Враги бьют х2'}]){const d=document.createElement('div');d.className='mutator';d.innerHTML=`<div><div class="mname">${mu.name}</div><div class="mdesc">${mu.desc}</div></div>`;d.onclick=()=>{const i=game.selectedMutators.indexOf(mu.id);if(i>=0){game.selectedMutators.splice(i,1);d.classList.remove('on');}else{game.selectedMutators.push(mu.id);d.classList.add('on');}};l.appendChild(d);}}
function startFromMutators(){document.getElementById('mutatorScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden');document.getElementById('mapName').textContent=MAPS[selectedMap].name;const l=document.getElementById('classList');l.innerHTML='';for(const[k,c]of Object.entries(CLASSES)){const b=document.createElement('button');b.className='class-btn';b.innerHTML=`<b>${c.name}</b><span>${c.desc}</span><div class="stats">HP ${c.hp}</div>`;b.onclick=()=>startGame(selectedMap,k);l.appendChild(b);}}
function showShop(){document.getElementById('mainMenu').classList.add('hidden');document.getElementById('shopScreen').classList.remove('hidden');document.getElementById('shopBlood').textContent=`Кровь: ${meta.blood}`;renderShop('skins');}
function hideShop(){document.getElementById('shopScreen').classList.add('hidden');document.getElementById('mainMenu').classList.remove('hidden');showMainMenu();}
function renderShop(t){const l=document.getElementById('shopList');l.innerHTML='';document.getElementById('shopBlood').textContent=`Кровь: ${meta.blood}`;if(t==='skins'){const sk=[{id:'default',n:'Стандарт',p:0},{id:'gold',n:'Золотой',p:1000},{id:'neon',n:'Неон',p:1500}];for(const s of sk){const own=meta.ownedSkins.includes(s.id)||s.p===0;const act=meta.activeSkin===s.id;const d=document.createElement('div');d.className='shop-item'+(act?' owned':'');d.innerHTML=`<b>${s.n}</b>${act?'<div class="price">НАДЕТО</div>':own?'<div class="price">НАДЕТЬ</div>':`<div class="price">${s.p} 🩸</div>`}`;d.onclick=()=>{if(own){meta.activeSkin=s.id;saveMeta();renderShop('skins');}else if(meta.blood>=s.p){meta.blood-=s.p;meta.ownedSkins.push(s.id);saveMeta();renderShop('skins');}};l.appendChild(d);}}}
function showSettings(f){document.getElementById('setSound').checked=settings.sound;document.getElementById('setVibe').checked=settings.vibe;document.getElementById('setJoy').value=settings.joySize;document.getElementById(f?'pauseScreen':'mainMenu').classList.add('hidden');document.getElementById('settingsScreen').classList.remove('hidden');document.getElementById('settingsScreen')._f=f;}
function closeSettings(){settings.sound=document.getElementById('setSound').checked;settings.vibe=document.getElementById('setVibe').checked;settings.joySize=+document.getElementById('setJoy').value;saveSettings();updateBtns();const f=document.getElementById('settingsScreen')._f;document.getElementById('settingsScreen').classList.add('hidden');document.getElementById(f?'pauseScreen':'mainMenu').classList.remove('hidden');}
document.getElementById('setSound').onchange=()=>{settings.sound=document.getElementById('setSound').checked;saveSettings();};
document.getElementById('setVibe').onchange=()=>{settings.vibe=document.getElementById('setVibe').checked;saveSettings();};
document.getElementById('setJoy').oninput=()=>{settings.joySize=+document.getElementById('setJoy').value;updateBtns();saveSettings();};
function showAchievements(){document.getElementById('mainMenu').classList.add('hidden');document.getElementById('achScreen').classList.remove('hidden');}
function closeAchievements(){document.getElementById('achScreen').classList.add('hidden');document.getElementById('mainMenu').classList.remove('hidden');}
function restartGame(){document.getElementById('gameOverScreen').classList.add('hidden');game.player=null;game.running=false;document.getElementById('mainMenu').classList.remove('hidden');showMainMenu();}

function showUpgrades(){
  if(game.selectedMutators.includes('arena')){game.wave++;game.running=true;game.lastTime=0;startWave();return;}
  document.getElementById('upgradeScreen').classList.remove('hidden');
  const l=document.getElementById('upgradeList');l.innerHTML='';
  const pool=[...UPGRADES].sort(()=>Math.random()-0.5).slice(0,3);
  for(const u of pool){
    const b=document.createElement('button');b.className='upgrade-btn '+u.rarity;
    b.innerHTML=`<b>${u.name} <span class="rarity-tag" style="color:inherit">${u.rarity}</span></b><span>${u.desc}</span>`;
    b.onclick=()=>{
      if(u.id==='wep'){document.getElementById('upgradeScreen').classList.add('hidden');showWeaponRoll();}
      else{u.apply(game.player);document.getElementById('upgradeScreen').classList.add('hidden');game.wave++;game.running=true;game.lastTime=0;startWave();}
    };
    l.appendChild(b);
  }
}
function showWeaponRoll(){document.getElementById('weaponScreen').classList.remove('hidden');const r=document.getElementById('weaponRoll');r.classList.add('rolling');let t=0;const int=setInterval(()=>{const k=Object.keys(WEAPONS)[Math.floor(Math.random()*4)];document.getElementById('rollIcon').textContent=WEAPONS[k].icon;document.getElementById('rollName').textContent=WEAPONS[k].name;t++;if(t>15){clearInterval(int);game.lastWeaponRoll=k;r.classList.remove('rolling');}},100);}
function finishWeaponRoll(){if(game.lastWeaponRoll){game.player.weapon=game.lastWeaponRoll;game.lastWeaponRoll=null;}document.getElementById('weaponScreen').classList.add('hidden');game.wave++;game.running=true;game.lastTime=0;startWave();}

// ==========================================
// ЗАПУСК
// ==========================================
function loop(ts){
  requestAnimationFrame(loop);
  if(!game.lastTime)game.lastTime=ts;
  let dt=(ts-game.lastTime)/1000;game.lastTime=ts;
  dt=Math.min(dt,0.05);
  if(game.hitStop>0){game.hitStop-=dt;dt*=0.2;}
  if(game.running&&!game.paused&&game.player)update(dt);
  if(game.player)draw();
  else{ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,W,H);}
}

resize();
updateBtns();
showMainMenu();
requestAnimationFrame(loop);
</script>
</body>
